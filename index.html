<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NPC Violator 9000</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0c;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: system-ui, -apple-system, sans-serif;
    overflow: hidden;
    user-select: none;
    color: #fff;
  }

  #game-wrapper {
    position: relative;
    width: 760px;
    height: 500px;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.1), 0 20px 50px rgba(0,0,0,0.9);
    border-radius: 12px;
    overflow: hidden;
    background: #000;
  }

  #canvas {
    display: block;
    image-rendering: auto; /* Smoother render for premium feel */
  }

  .info {
    z-index: 10;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: 0.75rem;
    margin: 0 auto;
    width: fit-content;
    max-width: min(60rem, 100vw - 10rem);
    background-color: #1117;
    backdrop-filter: blur(0.4rem);
    -webkit-backdrop-filter: blur(0.4rem);
    border-radius: 0.6rem;
    border-top-left-radius: 0;
    border-top-right-radius: 0;
    text-align: center;
    box-shadow: 0 0 1.5rem #0006;
    display: flex;
    align-items: center;
    gap: 1rem;
    pointer-events: auto;
  }

  .info .text {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }

  .info h1 {
    font-size: 1.1rem;
    font-weight: 600;
    color: white;
  }

  .info strong {
    color: gold;
    font-weight: 600;
  }

  .info p {
    font-size: 0.8rem;
    color: rgba(255,255,255,0.7);
  }

  .controls {
    z-index: 10;
    position: absolute;
    bottom: 0.75rem;
    left: 0;
    right: 0;
    margin: 0 auto;
    width: fit-content;
    max-width: calc(100vw - 4rem);
    background-color: #2228;
    backdrop-filter: blur(0.3rem);
    -webkit-backdrop-filter: blur(0.3rem);
    border-radius: 1rem;
    padding: 0.75rem;
    box-shadow: 0 0 1.5rem #0006;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 1.25rem;
    pointer-events: auto;
  }

  .block-chooser {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .block-chooser label {
    display: block;
    width: 3rem;
    height: 3rem;
    border-radius: 0.3rem;
    background: rgba(255,255,255,0.05);
    position: relative;
    cursor: pointer;
    transition: outline 0.1s;
    outline-offset: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .block-chooser label:hover { outline: 2px solid silver; }
  .block-chooser label.active { outline: 2px solid white; }

  .action-sq {
    width: 1.8rem;
    height: 1.8rem;
    border-radius: 2px;
  }

  .slot-id {
    position: absolute;
    bottom: 2px;
    right: 3px;
    font-size: 0.6rem;
    font-weight: 800;
    color: rgba(255,255,255,0.4);
  }

  .mini-radar {
    width: 90px;
    height: 70px;
    background: #000;
    border-radius: 0.4rem;
    overflow: hidden;
  }

  #minimap-canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .stat-bars {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100px;
  }

  .bar-rail {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    overflow: hidden;
  }

  .bar-inner {
    height: 100%;
    transition: width 0.3s;
  }

  #hp-inner { background: #ff4d4d; }
  #mp-inner { background: #00d2ff; }

  .key-hints {
    display: flex;
    gap: 1rem;
  }

  .hint-item {
    font-size: 0.75rem;
    color: rgba(255,255,255,0.6);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .kb-badge {
    background: rgba(255,255,255,0.1);
    padding: 1px 4px;
    border-radius: 3px;
    color: #fff;
    font-weight: 800;
    font-size: 0.65rem;
  }

  #combo-alert {
    position: absolute;
    top: 6rem;
    left: 50%;
    transform: translateX(-50%) scale(0.8);
    font-size: 3rem;
    font-weight: 900;
    color: gold;
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    pointer-events: none;
  }

  #combo-alert.show {
    opacity: 1;
    transform: translateX(-50%) scale(1);
  }

  .float-text {
    position: absolute;
    font-size: 14px;
    font-weight: 900;
    color: #fff;
    pointer-events: none;
    animation: floatAnim 0.8s ease-out forwards;
    z-index: 100;
    text-shadow: 0 0 4px rgba(0,0,0,0.5);
  }

  @keyframes floatAnim {
    0% { opacity: 0; transform: translateY(0); }
    20% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-50px); }
  }
</style>
</head>
<body>
<div id="game-wrapper">
  <canvas id="canvas" width="760" height="500"></canvas>
    <section class="info">
      <div class="text">
        <h1>Chaos <strong>Violator</strong></h1>
        <p>
          Status: HP <strong id="hp-val">85</strong> | 
          MP <strong id="mp-val">40</strong> | 
          Kills: <strong id="kill-count">0</strong> | 
          Streak: <strong id="streak-count">0</strong>
        </p>
      </div>
      <div class="mini-radar">
        <canvas id="minimap-canvas" width="90" height="70"></canvas>
      </div>
    </section>

    <div id="combo-alert">STREAK X3</div>

    <section class="controls">
      <div class="block-chooser">
        <label class="active" title="Strike">
          <div class="action-sq" style="background:#ff4d4d"></div>
          <span class="slot-id">1</span>
        </label>
        <label title="Bash">
          <div class="action-sq" style="background:#f9cb28"></div>
          <span class="slot-id">2</span>
        </label>
        <label title="Surge">
          <div class="action-sq" style="background:#00d2ff"></div>
          <span class="slot-id">3</span>
        </label>
        <label title="Pulse">
          <div class="action-sq" style="background:#3a7bd5"></div>
          <span class="slot-id">4</span>
        </label>
        <label title="Void">
          <div class="action-sq" style="background:#ffffff"></div>
          <span class="slot-id">5</span>
        </label>
      </div>

      <div class="stat-bars">
        <div class="bar-rail"><div id="hp-inner" class="bar-inner" style="width:85%"></div></div>
        <div class="bar-rail"><div id="mp-inner" class="bar-inner" style="width:40%"></div></div>
      </div>

      <div class="key-hints">
        <div class="hint-item"><span class="kb-badge">WASD</span> Move</div>
        <div class="hint-item"><span class="kb-badge">SPACE</span> Strike</div>
        <div class="hint-item"><span class="kb-badge">E</span> Whirl</div>
      </div>
    </section>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const minimapCanvas = document.getElementById('minimap-canvas');
const mctx = minimapCanvas.getContext('2d');

const W = canvas.width, H = canvas.height;

// ─── Game state ─────────────────────────────────────────────────────────────
let kills = 0;
let combo = 0;
let comboTimer = 0;

// Camera
const cam = { x: 0, y: 0, shakeX: 0, shakeY: 0, shakeMag: 0, shakeDecay: 0.88 };

// Hitstop
let hitstop = 0;

// World size
const WORLD_W = 1200, WORLD_H = 900;

// ─── Player ──────────────────────────────────────────────────────────────────
const player = {
  x: WORLD_W / 2, y: WORLD_H / 2,
  vx: 0, vy: 0,
  w: 14, h: 18,
  hp: 85, maxHp: 100,
  mp: 40, maxMp: 100,
  speed: 2.5,
  dir: 0, // 0=down 1=up 2=left 3=right
  frame: 0, frameTimer: 0,
  attackTimer: 0,
  spinTimer: 0,
  tilt: 0,
  color: '#4488ff',
  hairColor: '#4488ff',
  skinColor: '#f5c89a',
  moving: false,
  lastAttack: 'none',
  activeSlot: 0
};

const slots = [
  { name: 'STRIKE', color: '#ff4d4d' },
  { name: 'BASH', color: '#f9cb28' },
  { name: 'SURGE', color: '#00d2ff' },
  { name: 'PULSE', color: '#3a7bd5' },
  { name: 'VOID', color: '#ffffff' }
];

// ─── Keys ─────────────────────────────────────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => { keys[e.code] = true; e.preventDefault(); });
document.addEventListener('keyup', e => { keys[e.code] = false; });

// ─── Tilemap ─────────────────────────────────────────────────────────────────
const TILE = 32;
const COLS = Math.ceil(WORLD_W / TILE);
const ROWS = Math.ceil(WORLD_H / TILE);
const tileMap = [];

// Build map: mostly grass, some dirt paths, rocks
function buildMap() {
  for (let r = 0; r < ROWS; r++) {
    tileMap[r] = [];
    for (let c = 0; c < COLS; c++) {
      let t = 0; // grass
      // diagonal path
      const d = Math.abs((r * TILE) - (c * TILE));
      if (d < 24 && ((r + c) % 17 < 5)) t = 1; // dirt
      tileMap[r][c] = t;
    }
  }
}
buildMap();

// Tile colors (rendered via canvas, pixelated)
function grassVariant(r, c) {
  const n = ((r * 7 + c * 13) * 31337) % 100;
  if (n < 10) return '#6abf4b';
  if (n < 20) return '#72c450';
  if (n < 30) return '#65ba45';
  return '#69bf49';
}

function dirtVariant(r, c) {
  const n = ((r * 11 + c * 17) * 99991) % 100;
  if (n < 30) return '#c8a060';
  if (n < 60) return '#c09050';
  return '#d4aa70';
}

// ─── Trees ────────────────────────────────────────────────────────────────────
const trees = [];
function spawnTrees() {
  const colors = ['#3d8b2a', '#2d7a1a', '#4a9b35', '#e8821a', '#d97010', '#f09020'];
  for (let i = 0; i < 60; i++) {
    const x = 60 + Math.random() * (WORLD_W - 120);
    const y = 60 + Math.random() * (WORLD_H - 120);
    const dist = Math.hypot(x - player.x, y - player.y);
    if (dist < 100) continue;
    trees.push({
      x, y,
      canopy: colors[Math.floor(Math.random() * colors.length)],
      size: 20 + Math.random() * 14,
      shadow: 0.5 + Math.random() * 0.3
    });
  }
}
spawnTrees();

// ─── Rocks ────────────────────────────────────────────────────────────────────
const rocks = [];
function spawnRocks() {
  for (let i = 0; i < 25; i++) {
    rocks.push({
      x: 60 + Math.random() * (WORLD_W - 120),
      y: 60 + Math.random() * (WORLD_H - 120),
      r: 8 + Math.random() * 10
    });
  }
}
spawnRocks();

// ─── NPCs ──────────────────────────────────────────────────────────────────────
const npcNames = ['Blorbo','Flinky','Goober','Snoot','Wumbo','Dingus','Plonk','Zorp','Klubb','Meebs'];
const npcColors = ['#ff8844','#44ff88','#ff44aa','#44aaff','#ffff44','#aa44ff','#ff4444','#44ffff','#ffaa44','#aaffaa'];

const npcs = [];
function spawnNPC() {
  const angle = Math.random() * Math.PI * 2;
  const dist = 200 + Math.random() * 350;
  const x = player.x + Math.cos(angle) * dist;
  const y = player.y + Math.sin(angle) * dist;
  if (x < 40 || x > WORLD_W - 40 || y < 40 || y > WORLD_H - 40) return;
  const idx = Math.floor(Math.random() * npcNames.length);
  npcs.push({
    x, y, vx: 0, vy: 0,
    w: 12, h: 16,
    hp: 3,
    maxHp: 3,
    name: npcNames[idx],
    color: npcColors[idx % npcColors.length],
    state: 'wander', // wander / flee / launched / dead
    wanderTimer: Math.floor(Math.random() * 120),
    wanderDx: 0, wanderDy: 0,
    invuln: 0,
    frame: 0, frameTimer: 0,
    deathTimer: 0,
    spinAngularVel: 0,
    angle: 0,
    squishX: 1, squishY: 1,
    trail: [],
    exclaim: '',
    exclaimTimer: 0,
  });
}

for (let i = 0; i < 12; i++) spawnNPC();

// ─── Particles ────────────────────────────────────────────────────────────────
const particles = [];
function spawnParticles(x, y, color, count = 8, speed = 4) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const s = (0.5 + Math.random()) * speed;
    particles.push({
      x, y,
      vx: Math.cos(angle) * s,
      vy: Math.sin(angle) * s,
      life: 1, decay: 0.04 + Math.random() * 0.03,
      size: 3 + Math.random() * 4,
      color
    });
  }
}

// Stars (hit sparks)
const sparks = [];
function spawnSparks(x, y, count = 6) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const s = 2 + Math.random() * 5;
    sparks.push({
      x, y,
      vx: Math.cos(angle) * s,
      vy: Math.sin(angle) * s,
      life: 1, decay: 0.07 + Math.random() * 0.05,
      color: Math.random() > 0.5 ? '#ffff44' : '#ffffff'
    });
  }
}

// Hit flash overlay
let hitFlash = 0;
let hitFlashColor = 'rgba(255,255,255,0.4)';

// Floating texts
const floatTexts = [];
function spawnFloatText(x, y, text, crit = false) {
  const el = document.createElement('div');
  el.className = 'float-text' + (crit ? ' crit' : '');
  el.textContent = text;
  // convert world to screen
  const sx = x - cam.x + W / 2;
  const sy = y - cam.y + H / 2;
  el.style.left = sx + 'px';
  el.style.top = sy + 'px';
  document.getElementById('game-wrapper').appendChild(el);
  setTimeout(() => el.remove(), 1000);
}

// Exclamation texts for NPCs
const exclaimPool = ['OW!','BONK!','HEY!','YEOW!','NOOO!','YEET!','WTF!','HELP!','MAMA!','STOOOP!'];

// ─── Attack ───────────────────────────────────────────────────────────────────
function doAttack(type) {
  if (hitstop > 0) return;
  player.attackTimer = 20;
  player.lastAttack = type;

  let range = 45, knockback = 9, dmg = 1;
  let text = 'BONK';
  if (type === 'spin') { range = 65; knockback = 14; dmg = 2; text = 'WHIRL'; }
  if (type === 'yeet') { range = 55; knockback = 24; dmg = 3; text = 'BLAST'; }

  const dirAngles = [Math.PI/2, 3*Math.PI/2, Math.PI, 0]; // 0=down, 1=up, 2=left, 3=right
  const attackAngle = dirAngles[player.dir];

  let hit = false;
  for (const npc of npcs) {
    if (npc.state === 'dead') continue;
    const dx = npc.x - player.x;
    const dy = npc.y - player.y;
    const dist = Math.hypot(dx, dy);

    let inRange = dist < range;
    if (type === 'bonk' && inRange) {
      // directional check: dot product between attack angle and npc direction
      const angToNpc = Math.atan2(dy, dx);
      // Normalized dot product is cos(angle diff)
      const dot = Math.cos(angToNpc - attackAngle);
      inRange = dot > 0.4; // approx 60 degrees cone
    }

    if (inRange && npc.invuln <= 0) {
      npc.hp -= dmg;
      npc.invuln = 30;
      const angle = Math.atan2(dy, dx);
      npc.vx = Math.cos(angle) * knockback;
      npc.vy = Math.sin(angle) * knockback;
      npc.state = 'launched';
      npc.squishX = 0.5; npc.squishY = 1.5;
      if (type === 'spin') npc.spinAngularVel = (Math.random() - 0.5) * 0.6;
      if (type === 'yeet') { npc.vy -= 15; npc.spinAngularVel = (Math.random() > 0.5 ? 1 : -1) * 0.9; }

      const crit = type === 'yeet' || (Math.random() < 0.25);
      const dmgText = crit ? `${dmg * 2}!!` : `${dmg}`;
      spawnFloatText(npc.x, npc.y - 20, dmgText, crit);

      npc.exclaim = exclaimPool[Math.floor(Math.random() * exclaimPool.length)];
      npc.exclaimTimer = 90;

      spawnSparks(npc.x, npc.y, 8);
      spawnParticles(npc.x, npc.y, npc.color, 6, 3);

      hit = true;
      hitstop = type === 'yeet' ? 12 : type === 'spin' ? 8 : 5;
      hitFlash = 8;
      hitFlashColor = type === 'yeet' ? 'rgba(255,150,50,0.35)' : 'rgba(255,255,255,0.3)';

      // Camera shake (re-implemented)
      cam.shakeMag = type === 'yeet' ? 10 : type === 'spin' ? 7 : 4;

      if (npc.hp <= 0) {
        npc.state = 'dead';
        npc.deathTimer = 80;
        kills++;
        document.getElementById('kill-count').textContent = kills;
        combo++;
        comboTimer = 120;
        updateCombo();
        spawnParticles(npc.x, npc.y, npc.color, 18, 5);
        spawnParticles(npc.x, npc.y, '#ffff88', 10, 7);
        setTimeout(() => spawnNPC(), 3000);
      }

      // Camera shake
      cam.shakeMag = type === 'yeet' ? 10 : type === 'spin' ? 7 : 4;
    }
  }
}

function updateCombo() {
  const el = document.getElementById('combo-alert');
  document.getElementById('streak-count').textContent = combo;
  el.textContent = 'STREAK X' + combo;
  el.classList.add('show');
}

// ─── Draw pixel humanoid NPC ──────────────────────────────────────────────────
function drawNPC(npc, cx, cy) {
  ctx.save();
  ctx.translate(cx, cy);

  if (npc.state === 'dead') {
    ctx.globalAlpha = npc.deathTimer / 80;
  }
  if (npc.invuln > 0 && Math.floor(npc.invuln / 3) % 2 === 0 && npc.state !== 'dead') {
    ctx.globalAlpha = 0.4;
  }

  // Spinning
  if (npc.spinAngularVel !== 0) {
    ctx.rotate(npc.angle);
    ctx.scale(npc.squishX, npc.squishY);
  } else {
    ctx.scale(npc.squishX, npc.squishY);
  }

  const h = npc.h, w = npc.w;
  const skin = '#f5c89a';
  const shirt = npc.color;
  const pants = shadeColor(npc.color, -40);
  const hair = shadeColor(npc.color, 30);

  // Shadow under NPC
  if (npc.spinAngularVel === 0) {
    ctx.save();
    ctx.resetTransform();
    ctx.translate(cx, cy);
    ctx.globalAlpha *= 0.3;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(0, h / 2 - 2, w * 0.55, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.globalAlpha = npc.state === 'dead' ? npc.deathTimer / 80 :
                      (npc.invuln > 0 && Math.floor(npc.invuln / 3) % 2 === 0) ? 0.4 : 1;
  }

  // Legs
  ctx.fillStyle = pants;
  ctx.fillRect(-w / 2, h / 6, w / 2 - 1, h / 3);
  ctx.fillRect(1, h / 6, w / 2 - 1, h / 3);

  // Body / shirt
  ctx.fillStyle = shirt;
  ctx.fillRect(-w / 2, -h / 6, w, h / 3 + 2);

  // Arms
  ctx.fillStyle = shirt;
  const armSwing = player.attackTimer > 0 ? Math.sin(Date.now() * 0.05) * 4 : 0;
  ctx.fillRect(-w / 2 - 4, -h / 6, 4, h / 4);
  ctx.fillRect(w / 2, -h / 6, 4, h / 4);

  // Neck
  ctx.fillStyle = skin;
  ctx.fillRect(-2, -h / 2 + h / 6, 4, 5);

  // Head
  ctx.fillStyle = skin;
  ctx.fillRect(-w / 2 + 1, -h / 2, w - 2, h / 4 + 2);

  // Hair
  ctx.fillStyle = hair;
  ctx.fillRect(-w / 2 + 1, -h / 2, w - 2, 5);

  // Eyes
  if (npc.state !== 'dead') {
    ctx.fillStyle = '#222';
    ctx.fillRect(-w / 2 + 3, -h / 2 + 7, 3, 3);
    ctx.fillRect(w / 2 - 6, -h / 2 + 7, 3, 3);
    // Scared eyes when fleeing
    if (npc.state === 'flee' || npc.state === 'launched') {
      ctx.fillStyle = '#fff';
      ctx.fillRect(-w / 2 + 2, -h / 2 + 6, 5, 5);
      ctx.fillStyle = '#222';
      ctx.fillRect(-w / 2 + 3, -h / 2 + 7, 2, 2);
      ctx.fillRect(w / 2 - 6, -h / 2 + 6, 5, 5);
      ctx.fillStyle = '#222';
      ctx.fillRect(w / 2 - 5, -h / 2 + 7, 2, 2);
    }
  } else {
    // X eyes
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-w / 2 + 2, -h / 2 + 6); ctx.lineTo(-w / 2 + 6, -h / 2 + 10);
    ctx.moveTo(-w / 2 + 6, -h / 2 + 6); ctx.lineTo(-w / 2 + 2, -h / 2 + 10);
    ctx.moveTo(w / 2 - 7, -h / 2 + 6); ctx.lineTo(w / 2 - 3, -h / 2 + 10);
    ctx.moveTo(w / 2 - 3, -h / 2 + 6); ctx.lineTo(w / 2 - 7, -h / 2 + 10);
    ctx.stroke();
  }

  // Exclamation bubble
  if (npc.exclaimTimer > 0) {
    ctx.restore();
    ctx.save();
    ctx.translate(cx, cy);
    const txt = npc.exclaim;
    ctx.font = 'bold 10px Courier New';
    const tw = ctx.measureText(txt).width;
    const bx = -tw / 2 - 4;
    const by = -h / 2 - 22;
    // Bubble bg
    ctx.fillStyle = '#fffde7';
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    roundRect(ctx, bx, by, tw + 8, 14, 3);
    ctx.fill(); ctx.stroke();
    // Bubble tail
    ctx.fillStyle = '#fffde7';
    ctx.strokeStyle = '#333';
    ctx.beginPath();
    ctx.moveTo(-2, by + 14); ctx.lineTo(4, by + 14); ctx.lineTo(0, by + 19);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#333';
    ctx.fillText(txt, bx + 4, by + 11);
    ctx.restore();
    return;
  }

  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

// ─── Draw player ─────────────────────────────────────────────────────────────
function drawPlayer(cx, cy) {
  ctx.save();
  ctx.translate(cx, cy);

  if (player.spinTimer > 0) {
    ctx.rotate(player.spinTimer * 0.3);
  } else {
    ctx.rotate(player.tilt);
  }

  const h = player.h, w = player.w;
  const skin = '#f5c89a';

  // Shadow
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(0, h / 2, w * 0.6, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;

  // Legs
  const legBob = player.moving ? Math.sin(player.frame * 0.5) * 3 : 0;
  ctx.fillStyle = '#2244aa';
  ctx.fillRect(-w / 2, h / 6 + legBob, w / 2 - 1, h / 3);
  ctx.fillRect(1, h / 6 - legBob, w / 2 - 1, h / 3);

  // Body
  ctx.fillStyle = '#3366cc';
  ctx.fillRect(-w / 2, -h / 6, w, h / 3 + 2);

  // Attack arm swing
  const atkSwing = player.attackTimer > 10 ? -30 : player.attackTimer > 0 ? 30 : 0;
  ctx.fillStyle = '#3366cc';
  ctx.save();
  ctx.translate(-w / 2 - 2, -h / 6);
  ctx.rotate((atkSwing) * Math.PI / 180);
  ctx.fillRect(-3, 0, 4, h / 4 + 2);
  ctx.restore();
  ctx.save();
  ctx.translate(w / 2 + 2, -h / 6);
  ctx.rotate((-atkSwing) * Math.PI / 180);
  ctx.fillRect(0, 0, 4, h / 4 + 2);
  ctx.restore();

  // Neck
  ctx.fillStyle = skin;
  ctx.fillRect(-2, -h / 2 + h / 6, 4, 5);

  // Head
  ctx.fillStyle = skin;
  ctx.fillRect(-w / 2 + 1, -h / 2, w - 2, h / 4 + 2);

  // Hair - spiky blue
  ctx.fillStyle = '#4488ff';
  ctx.fillRect(-w / 2 + 1, -h / 2, w - 2, 4);
  // Spikes
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(-w / 2 + 2 + i * 4, -h / 2);
    ctx.lineTo(-w / 2 + 4 + i * 4, -h / 2 - 6);
    ctx.lineTo(-w / 2 + 6 + i * 4, -h / 2);
    ctx.fill();
  }

  // Eyes
  ctx.fillStyle = '#222';
  ctx.fillRect(-w / 2 + 3, -h / 2 + 6, 3, 3);
  ctx.fillRect(w / 2 - 6, -h / 2 + 6, 3, 3);
  // Angry brows when attacking
  if (player.attackTimer > 0) {
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-w / 2 + 2, -h / 2 + 4);
    ctx.lineTo(-w / 2 + 6, -h / 2 + 6);
    ctx.moveTo(w / 2 - 2, -h / 2 + 4);
    ctx.lineTo(w / 2 - 6, -h / 2 + 6);
    ctx.stroke();
  }

  // Weapon / attack effect
  if (player.attackTimer > 0) {
    const a = (player.attackTimer / 20);
    ctx.globalAlpha = a;
    if (player.lastAttack === 'bonk') {
      ctx.strokeStyle = '#ffdd44';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(w / 2 + 10, -h / 4, 14, -0.5, 1.2);
      ctx.stroke();
    } else if (player.lastAttack === 'spin') {
      ctx.strokeStyle = '#44ffff';
      ctx.lineWidth = 2;
      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        const ang = i * Math.PI / 2 + player.frame * 0.2;
        ctx.moveTo(Math.cos(ang) * 8, Math.sin(ang) * 8);
        ctx.lineTo(Math.cos(ang) * 28, Math.sin(ang) * 28);
        ctx.stroke();
      }
    } else if (player.lastAttack === 'yeet') {
      ctx.strokeStyle = '#ff8844';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(0, 0, 38, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

// ─── Draw tree ────────────────────────────────────────────────────────────────
function drawTree(t, cx, cy) {
  const s = t.size;
  // Shadow
  ctx.globalAlpha = 0.3;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(cx + 4, cy + s - 4, s * 0.5, s * 0.2, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;

  // Trunk
  ctx.fillStyle = '#8B5A2B';
  ctx.fillRect(cx - 4, cy + s * 0.2, 8, s * 0.5);
  // Trunk shadow
  ctx.fillStyle = '#6B3A1B';
  ctx.fillRect(cx, cy + s * 0.2, 4, s * 0.5);

  // Canopy layers
  ctx.fillStyle = shadeColor(t.canopy, -20);
  ctx.beginPath();
  ctx.arc(cx, cy, s * 0.7, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = t.canopy;
  ctx.beginPath();
  ctx.arc(cx - 3, cy - 3, s * 0.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = shadeColor(t.canopy, 25);
  ctx.beginPath();
  ctx.arc(cx - s * 0.15, cy - s * 0.15, s * 0.4, 0, Math.PI * 2);
  ctx.fill();
  // Highlight
  ctx.fillStyle = shadeColor(t.canopy, 50);
  ctx.beginPath();
  ctx.arc(cx - s * 0.2, cy - s * 0.25, s * 0.2, 0, Math.PI * 2);
  ctx.fill();
}

// ─── Draw rock ────────────────────────────────────────────────────────────────
function drawRock(rock, cx, cy) {
  ctx.globalAlpha = 0.2;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(cx + 3, cy + rock.r - 2, rock.r * 0.9, rock.r * 0.3, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;

  ctx.fillStyle = '#888';
  ctx.beginPath();
  ctx.ellipse(cx, cy, rock.r * 1.1, rock.r * 0.75, -0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#aaa';
  ctx.beginPath();
  ctx.ellipse(cx - rock.r * 0.2, cy - rock.r * 0.2, rock.r * 0.5, rock.r * 0.35, -0.3, 0, Math.PI * 2);
  ctx.fill();
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function shadeColor(hex, amount) {
  let r = parseInt(hex.slice(1, 3), 16);
  let g = parseInt(hex.slice(3, 5), 16);
  let b = parseInt(hex.slice(5, 7), 16);
  r = Math.max(0, Math.min(255, r + amount));
  g = Math.max(0, Math.min(255, g + amount));
  b = Math.max(0, Math.min(255, b + amount));
  return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
}

// ─── Update ───────────────────────────────────────────────────────────────────
function update() {
  if (hitstop > 0) { hitstop--; return; }

  // Player movement
  let dx = 0, dy = 0;
  if (keys['KeyA'] || keys['ArrowLeft'])  { dx -= 1; player.dir = 2; }
  if (keys['KeyD'] || keys['ArrowRight']) { dx += 1; player.dir = 3; }
  if (keys['KeyW'] || keys['ArrowUp'])    { dy -= 1; player.dir = 1; }
  if (keys['KeyS'] || keys['ArrowDown'])  { dy += 1; player.dir = 0; }

  if (dx !== 0 && dy !== 0) { dx *= 0.707; dy *= 0.707; }
  player.moving = dx !== 0 || dy !== 0;
  player.x = Math.max(20, Math.min(WORLD_W - 20, player.x + dx * player.speed));
  player.y = Math.max(20, Math.min(WORLD_H - 20, player.y + dy * player.speed));

  const targetTilt = dx * 0.15;
  player.tilt += (targetTilt - player.tilt) * 0.1;

  if (player.moving) {
    player.frameTimer++;
    if (player.frameTimer > 6) { player.frame++; player.frameTimer = 0; }
  }

  // Combat
  if (keys['Space'] && player.attackTimer <= 0) doAttack('bonk');
  if (keys['KeyE'] && player.attackTimer <= 0) { doAttack('spin'); player.spinTimer = 18; }
  if (keys['KeyQ'] && player.attackTimer <= 0) doAttack('yeet');
  if (player.attackTimer > 0) player.attackTimer--;
  if (player.spinTimer > 0) player.spinTimer--;

  // Camera
  cam.x += (player.x - cam.x) * 0.1;
  cam.y += (player.y - cam.y) * 0.1;

  if (cam.shakeMag > 0.1) {
    cam.shakeX = (Math.random() - 0.5) * cam.shakeMag * 2;
    cam.shakeY = (Math.random() - 0.5) * cam.shakeMag * 2;
    cam.shakeMag *= cam.shakeDecay;
  } else {
    cam.shakeX = 0; cam.shakeY = 0; cam.shakeMag = 0;
  }

  // Systems
  player.mp = Math.min(player.maxMp, player.mp + 0.1); 
  document.getElementById('hp-val').textContent = Math.floor(player.hp);
  document.getElementById('mp-val').textContent = Math.floor(player.mp);
  document.getElementById('hp-inner').style.width = (player.hp/player.maxHp*100) + '%';
  document.getElementById('mp-inner').style.width = (player.mp/player.maxMp*100) + '%';

  if (comboTimer > 0) {
    comboTimer--;
    if (comboTimer <= 0) {
      combo = 0;
      document.getElementById('combo-alert').classList.remove('show');
      document.getElementById('streak-count').textContent = '0';
    }
  }

  for (let i = 0; i < 5; i++) {
    if (keys[`Digit${i+1}`]) { player.activeSlot = i; updateHotbarUI(); }
  }

  // Entity Logic
  for (const npc of npcs) {
    if (npc.exclaimTimer > 0) npc.exclaimTimer--;
    if (npc.invuln > 0) npc.invuln--;
    npc.squishX += (1 - npc.squishX) * 0.15;
    npc.squishY += (1 - npc.squishY) * 0.15;

    if (npc.state === 'dead') {
      npc.deathTimer--;
      npc.vx *= 0.85; npc.vy *= 0.85;
      npc.x += npc.vx; npc.y += npc.vy;
      npc.angle += npc.spinAngularVel;
      npc.spinAngularVel *= 0.9;
      continue;
    }

    if (npc.state === 'launched') {
      npc.x += npc.vx; npc.y += npc.vy;
      npc.vx *= 0.88; npc.vy *= 0.88;
      npc.angle += npc.spinAngularVel;
      npc.spinAngularVel *= 0.9;
      if (npc.x < 20 || npc.x > WORLD_W - 20) npc.vx *= -0.7;
      if (npc.y < 20 || npc.y > WORLD_H - 20) npc.vy *= -0.7;
      if (Math.hypot(npc.vx, npc.vy) < 0.3) npc.state = 'wander';
    } else if (npc.state === 'flee') {
      const dist = Math.hypot(npc.x - player.x, npc.y - player.y);
      if (dist < 180) {
        npc.x += ((npc.x - player.x) / dist) * 1.8;
        npc.y += ((npc.y - player.y) / dist) * 1.8;
      } else { npc.state = 'wander'; }
    } else {
      npc.wanderTimer--;
      if (npc.wanderTimer <= 0) {
        npc.wanderTimer = 80 + Math.floor(Math.random() * 120);
        const a = Math.random() * Math.PI * 2;
        npc.wanderDx = Math.cos(a); npc.wanderDy = Math.sin(a);
      }
      npc.x += npc.wanderDx * 0.7; npc.y += npc.wanderDy * 0.7;
    }
    npc.x = Math.max(20, Math.min(WORLD_W - 20, npc.x));
    npc.y = Math.max(20, Math.min(WORLD_H - 20, npc.y));
  }

  // Cleanup
  if (hitFlash > 0) hitFlash--;
  for (let i = npcs.length - 1; i >= 0; i--) {
    if (npcs[i].state === 'dead' && npcs[i].deathTimer <= 0) npcs.splice(i, 1);
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].x += particles[i].vx; particles[i].y += particles[i].vy;
    particles[i].vy += 0.1; particles[i].life -= particles[i].decay;
    if (particles[i].life <= 0) particles.splice(i, 1);
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    sparks[i].x += sparks[i].vx; sparks[i].y += sparks[i].vy;
    sparks[i].vx *= 0.92; sparks[i].vy *= 0.92; sparks[i].life -= sparks[i].decay;
    if (sparks[i].life <= 0) sparks.splice(i, 1);
  }
}

function updateHotbarUI() {
  const slotEls = document.querySelectorAll('.block-chooser label');
  slotEls.forEach((el, i) => {
    if (i === player.activeSlot) el.classList.add('active');
    else el.classList.remove('active');
  });
}

// ─── Render ───────────────────────────────────────────────────────────────────
function render() {
  ctx.clearRect(0, 0, W, H);

  const ox = W / 2 - cam.x;
  const oy = H / 2 - cam.y;

  // 1. Tiles
  const startC = Math.max(0, Math.floor((cam.x - W / 2) / TILE));
  const endC = Math.min(COLS, Math.ceil((cam.x + W / 2) / TILE));
  const startR = Math.max(0, Math.floor((cam.y - H / 2) / TILE));
  const endR = Math.min(ROWS, Math.ceil((cam.y + H / 2) / TILE));

  for (let r = startR; r < endR; r++) {
    for (let c = startC; c < endC; c++) {
      const t = tileMap[r][c];
      ctx.fillStyle = t === 1 ? dirtVariant(r, c) : grassVariant(r, c);
      ctx.fillRect(c * TILE + ox, r * TILE + oy, TILE, TILE);
      if (t === 0 && ((r + c) % 5 === 0)) {
        ctx.fillStyle = 'rgba(0,0,0,0.06)';
        ctx.fillRect(c * TILE + ox + 8, r * TILE + oy + 8, 2, 2);
      }
    }
  }

  // 2. Shadows/Lower layer
  for (const rock of rocks) drawRock(rock, rock.x + ox, rock.y + oy);

  // 3. Effects layer
  for (const npc of npcs) {
    for (const t of npc.trail) {
      ctx.globalAlpha = t.life * 0.4;
      ctx.fillStyle = npc.color;
      ctx.beginPath();
      ctx.arc(t.x + ox, t.y + oy, 5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x + ox - p.size / 2, p.y + oy - p.size / 2, p.size, p.size);
  }
  for (const s of sparks) {
    ctx.globalAlpha = s.life;
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(s.x + ox, s.y + oy);
    ctx.lineTo(s.x - s.vx * 4 + ox, s.y - s.vy * 4 + oy);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // 4. Depth-sorted entities
  const entities = [];
  for (const npc of npcs) entities.push({ type: 'npc', data: npc, y: npc.y });
  entities.push({ type: 'player', x: player.x, y: player.y });
  for (const t of trees) entities.push({ type: 'tree', data: t, y: t.y + t.size * 0.3 });
  entities.sort((a, b) => a.y - b.y);

  for (const e of entities) {
    const ex = (e.type === 'player' ? e.x : e.data.x) + ox;
    const ey = (e.type === 'player' ? e.y : e.data.y) + oy;
    if (ex < -100 || ex > W + 100 || ey < -100 || ey > H + 100) continue;

    if (e.type === 'player') drawPlayer(ex, ey);
    else if (e.type === 'npc') drawNPC(e.data, ex, ey);
    else if (e.type === 'tree') drawTree(e.data, ex, ey);
  }

  // Hit flash overlay
  if (hitFlash > 0) {
    ctx.fillStyle = hitFlashColor;
    ctx.globalAlpha = hitFlash / 8;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  // Vignette
  const vignette = ctx.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.75);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, W, H);

  // Minimap
  renderMinimap();
}

function renderMinimap() {
  const mw = minimapCanvas.width, mh = minimapCanvas.height;
  mctx.fillStyle = '#0a0a0c';
  mctx.fillRect(0, 0, mw, mh);

  const scaleX = mw / WORLD_W;
  const scaleY = mh / WORLD_H;

  for (const t of trees) {
    mctx.fillStyle = '#2a6a1a';
    mctx.fillRect(t.x * scaleX - 2, t.y * scaleY - 2, 4, 4);
  }

  for (const npc of npcs) {
    if (npc.state === 'dead') continue;
    mctx.fillStyle = npc.color;
    mctx.fillRect(npc.x * scaleX - 1, npc.y * scaleY - 1, 3, 3);
  }

  // Player dot
  mctx.fillStyle = '#4488ff';
  mctx.fillRect(player.x * scaleX - 2, player.y * scaleY - 2, 4, 4);

  // Frame
  mctx.strokeStyle = 'rgba(255,255,255,0.15)';
  mctx.strokeRect(0, 0, 96, 76);
}

// ─── Game loop ────────────────────────────────────────────────────────────────
function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

loop();
</script>
