<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chaos Violator - Vampire Survivors</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a0a00;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Press Start 2P', monospace;
    overflow: hidden;
    user-select: none;
    color: #fff;
    image-rendering: pixelated;
  }

  #game-wrapper {
    position: relative;
    width: 760px;
    height: 500px;
    box-shadow: 0 0 0 4px #8b4513, 0 0 0 8px #5c2d0a, 0 0 40px rgba(0,0,0,0.9);
    overflow: hidden;
    background: #000;
    image-rendering: pixelated;
  }

  #canvas {
    display: block;
    image-rendering: pixelated;
  }

  /* HUD */
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 8px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    pointer-events: none;
    z-index: 10;
  }

  #hud-left {
    display: flex;
    flex-direction: column;
    gap: 4px;
    background: rgba(0,0,0,0.75);
    border: 2px solid #8b4513;
    padding: 6px 8px;
    min-width: 180px;
  }

  .hud-label {
    font-size: 6px;
    color: #aaa;
    margin-bottom: 1px;
    letter-spacing: 1px;
  }

  .bar-row {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 3px;
  }

  .bar-label {
    font-size: 6px;
    width: 14px;
    color: #ccc;
  }

  .bar-track {
    flex: 1;
    height: 8px;
    background: #222;
    border: 1px solid #555;
    position: relative;
  }

  .bar-fill {
    height: 100%;
    transition: width 0.2s;
  }

  #hp-bar { background: #cc2222; }
  #xp-bar { background: #22aa44; }

  .hud-stats {
    font-size: 6px;
    color: #ffdd44;
    line-height: 1.8;
  }

  #hud-center {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.8);
    border: 2px solid #8b4513;
    padding: 5px 12px;
    text-align: center;
  }

  #timer-display {
    font-size: 14px;
    color: #ffdd44;
  }

  #wave-display {
    font-size: 6px;
    color: #ff8844;
    margin-top: 3px;
  }

  #hud-right {
    background: rgba(0,0,0,0.75);
    border: 2px solid #8b4513;
    padding: 6px 8px;
    min-width: 140px;
  }

  .weapon-slot {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 3px;
    font-size: 6px;
    color: #ccc;
  }

  .weapon-icon {
    width: 12px;
    height: 12px;
    border: 1px solid #666;
  }

  .weapon-cd {
    flex: 1;
    height: 4px;
    background: #333;
    border: 1px solid #555;
  }

  .weapon-cd-fill {
    height: 100%;
    background: #44aaff;
    transition: width 0.1s;
  }

  /* Level-up overlay */
  #levelup-screen {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 50;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }

  #levelup-screen.show { display: flex; }

  #levelup-title {
    font-size: 14px;
    color: #ffdd44;
    text-shadow: 0 0 8px #ffaa00;
    animation: pulse 0.5s ease-in-out infinite alternate;
  }

  @keyframes pulse {
    from { transform: scale(1); }
    to { transform: scale(1.04); }
  }

  #levelup-subtitle {
    font-size: 7px;
    color: #aaa;
    margin-top: -8px;
  }

  .upgrade-cards {
    display: flex;
    gap: 12px;
  }

  .upgrade-card {
    width: 148px;
    background: #1a1a1a;
    border: 3px solid #8b4513;
    padding: 10px;
    cursor: pointer;
    transition: border-color 0.1s, transform 0.1s;
    text-align: center;
  }

  .upgrade-card:hover {
    border-color: #ffdd44;
    transform: scale(1.04);
    background: #2a1a0a;
  }

  .upgrade-card-icon {
    width: 28px;
    height: 28px;
    margin: 0 auto 6px;
    border: 2px solid #555;
  }

  .upgrade-card-name {
    font-size: 7px;
    color: #ffdd44;
    margin-bottom: 5px;
  }

  .upgrade-card-desc {
    font-size: 5px;
    color: #aaa;
    line-height: 1.6;
  }

  .upgrade-card-rarity {
    font-size: 5px;
    margin-top: 5px;
  }

  .rarity-common { color: #aaaaaa; }
  .rarity-rare { color: #4488ff; }
  .rarity-epic { color: #aa44ff; }

  /* Death / Win screen */
  #endgame-screen {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.9);
    z-index: 60;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  #endgame-screen.show { display: flex; }

  #endgame-title {
    font-size: 18px;
  }

  #endgame-stats {
    font-size: 7px;
    color: #ccc;
    text-align: center;
    line-height: 2.2;
  }

  #restart-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    background: #8b4513;
    color: #fff;
    border: 3px solid #ffdd44;
    padding: 8px 16px;
    cursor: pointer;
    margin-top: 8px;
  }

  #restart-btn:hover { background: #aa5520; }

  .float-text {
    position: absolute;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    font-weight: 900;
    pointer-events: none;
    animation: floatAnim 1s ease-out forwards;
    z-index: 100;
    text-shadow: 1px 1px 0 #000;
  }

  @keyframes floatAnim {
    0%   { opacity: 0; transform: translateY(0); }
    20%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(-45px); }
  }

  #controls-hint {
    margin-top: 6px;
    font-size: 6px;
    color: #666;
    letter-spacing: 1px;
  }

  #minimap-wrap {
    position: absolute;
    bottom: 8px;
    right: 8px;
    border: 2px solid #8b4513;
    background: #000;
    z-index: 10;
  }

  #minimap-canvas { display: block; }
</style>
</head>
<body>
<div id="game-wrapper">
  <canvas id="canvas" width="760" height="500"></canvas>

  <!-- HUD -->
  <div id="hud">
    <div id="hud-left">
      <div class="bar-row">
        <div class="bar-label">HP</div>
        <div class="bar-track"><div class="bar-fill" id="hp-bar" style="width:100%"></div></div>
        <div id="hp-val" style="font-size:6px;min-width:24px;text-align:right">100</div>
      </div>
      <div class="bar-row">
        <div class="bar-label">XP</div>
        <div class="bar-track"><div class="bar-fill" id="xp-bar" style="width:0%"></div></div>
        <div id="xp-val" style="font-size:6px;min-width:24px;text-align:right">0</div>
      </div>
      <div class="hud-stats">
        LVL <span id="level-val">1</span> &nbsp; KILLS <span id="kill-count">0</span>
      </div>
    </div>

    <div id="hud-center">
      <div id="timer-display">30:00</div>
      <div id="wave-display">WAVE 1</div>
    </div>

    <div id="hud-right">
      <div class="hud-label">WEAPONS</div>
      <div id="weapon-slots"></div>
    </div>
  </div>

  <div id="minimap-wrap">
    <canvas id="minimap-canvas" width="80" height="60"></canvas>
  </div>

  <!-- Level-up -->
  <div id="levelup-screen">
    <div id="levelup-title">LEVEL UP!</div>
    <div id="levelup-subtitle">CHOOSE AN UPGRADE</div>
    <div class="upgrade-cards" id="upgrade-cards"></div>
  </div>

  <!-- End game -->
  <div id="endgame-screen">
    <div id="endgame-title"></div>
    <div id="endgame-stats"></div>
    <button id="restart-btn" onclick="restartGame()">PLAY AGAIN</button>
  </div>
</div>

<div id="controls-hint">WASD MOVE &nbsp; SPACE DASH</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const minimapCanvas = document.getElementById('minimap-canvas');
const mctx = minimapCanvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
mctx.imageSmoothingEnabled = false;

const W = 760, H = 500;
const WORLD_W = 1600, WORLD_H = 1200;
const TILE = 16;
const COLS = Math.ceil(WORLD_W / TILE);
const ROWS = Math.ceil(WORLD_H / TILE);

// ─── Minecraft Pixel Tile Palette ─────────────────────────────────────────────
// Tile types: 0=grass, 1=dirt, 2=stone, 3=gravel, 4=sand
const MC_GRASS = [
  '#5d8a32','#5a8730','#62912e','#4f7a29','#589030','#66982f','#578529','#4e7828'
];
const MC_DIRT = [
  '#8B5E3C','#7d5535','#9a6840','#8a5b3a','#7a5030','#9c6a42','#855a38','#7f5233'
];
const MC_STONE = [
  '#888','#7a7a7a','#909090','#828282','#9a9a9a','#777','#868686','#8e8e8e'
];
const MC_GRAVEL = [
  '#918989','#898080','#998f8f','#8a8181','#7f7676','#9e9494'
];
const MC_SAND = [
  '#dcce89','#d4c67f','#e0d290','#cec285','#d8ca88','#e4d694'
];

function seedRand(a, b) {
  return (((a * 1664525 + b * 214013 + 2531011) ^ (a * 214013 + b * 1664525)) >>> 0) % 100;
}

// Build map
const tileMap = [];
function buildMap() {
  for (let r = 0; r < ROWS; r++) {
    tileMap[r] = [];
    for (let c = 0; c < COLS; c++) {
      const n = seedRand(r, c);
      let t = 0; // grass
      if (n < 5) t = 1;       // dirt patches
      else if (n < 9) t = 2;  // stone
      else if (n < 11) t = 3; // gravel
      else if (n < 13) t = 4; // sand strip
      tileMap[r][c] = t;
    }
  }
  // Carve dirt paths
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (Math.abs(r - c) < 2) tileMap[r][c] = 1;
      if (Math.abs(r + c - ROWS) < 2) tileMap[r][c] = 1;
    }
  }
}
buildMap();

function getTileColor(t, r, c) {
  const arr = [MC_GRASS, MC_DIRT, MC_STONE, MC_GRAVEL, MC_SAND][t] || MC_GRASS;
  const idx = seedRand(r * 3, c * 7) % arr.length;
  return arr[idx];
}

// MC Block top-face pixel overlay pattern
function drawMCTile(r, c, x, y) {
  const t = tileMap[r][c];
  ctx.fillStyle = getTileColor(t, r, c);
  ctx.fillRect(x, y, TILE, TILE);

  // Pixel highlight / shadow edges (MC look)
  const base = getTileColor(t, r, c);
  // Lighter top-left edge
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.fillRect(x, y, TILE, 1);
  ctx.fillRect(x, y, 1, TILE);
  // Darker bottom-right edge
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.fillRect(x, y + TILE - 1, TILE, 1);
  ctx.fillRect(x + TILE - 1, y, 1, TILE);

  // Occasional pixel detail dots (like MC texture noise)
  const d1 = seedRand(r * 17 + 3, c * 13 + 5);
  if (d1 < 20) {
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    const px = (d1 % 12) + 2;
    const py = Math.floor(d1 / 12) * 3 + 2;
    ctx.fillRect(x + px, y + py, 2, 2);
  }
}

// MC grass top with green overlay
function drawGrassTop(r, c, x, y) {
  drawMCTile(r, c, x, y);
  // MC grass has a green tinted top layer
  ctx.fillStyle = 'rgba(80,160,30,0.08)';
  ctx.fillRect(x, y, TILE, 4);
}

// ─── Trees (MC style - pixelated squares) ─────────────────────────────────────
const trees = [];
function spawnTrees() {
  for (let i = 0; i < 80; i++) {
    const x = 80 + Math.random() * (WORLD_W - 160);
    const y = 80 + Math.random() * (WORLD_H - 160);
    if (Math.hypot(x - WORLD_W/2, y - WORLD_H/2) < 120) continue;
    const leafColor = Math.random() > 0.3 ? '#3a7d23' : '#2d6b1c';
    trees.push({ x, y, size: 14 + Math.random() * 8, leafColor });
  }
}
spawnTrees();

function drawTree(t, cx, cy) {
  const s = Math.round(t.size);
  const half = Math.floor(s / 2);
  // MC oak tree: brown log, square leaf block
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(cx - half + 3, cy + s * 0.2, s, 4);

  // Log (brown trunk pixel)
  const logW = Math.max(4, Math.round(s * 0.28));
  const logH = Math.round(s * 0.6);
  ctx.fillStyle = '#6b3e26';
  ctx.fillRect(cx - Math.floor(logW/2), cy - logH * 0.1, logW, logH);
  ctx.fillStyle = '#7a4830';
  ctx.fillRect(cx - Math.floor(logW/2), cy - logH * 0.1, Math.max(1,Math.floor(logW/2)), logH);

  // Leaf block (MC leaves are square with dark corners)
  const lx = cx - half;
  const ly = cy - s;
  ctx.fillStyle = t.leafColor;
  ctx.fillRect(lx, ly, s, s);
  // Leaf variation
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.fillRect(lx, ly, 3, 3);
  ctx.fillRect(lx + s - 3, ly, 3, 3);
  ctx.fillRect(lx, ly + s - 3, 3, 3);
  ctx.fillRect(lx + s - 3, ly + s - 3, 3, 3);
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  ctx.fillRect(lx + 2, ly + 2, s - 4, 3);

  // Pixel outline
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.lineWidth = 1;
  ctx.strokeRect(lx + 0.5, ly + 0.5, s - 1, s - 1);
}

// ─── Weapons system ────────────────────────────────────────────────────────────
const WEAPON_DEFS = {
  whip: {
    name: 'WHIP',
    color: '#e8821a',
    baseDmg: 10,
    baseCooldown: 90,
    baseRange: 80,
    desc: 'Lashes all enemies in front. Evolves with Hollow Heart.',
    update(w, bullets, player) {
      w.cd--;
      if (w.cd <= 0) {
        w.cd = Math.round(w.baseCooldown * (1 - (w.level-1)*0.06));
        const angle = Math.atan2(
          player.vy || (player.dir===0?1:player.dir===1?-1:0),
          player.vx || (player.dir===3?1:player.dir===2?-1:0)
        ) || 0;
        bullets.push({ type:'whip', x:player.x, y:player.y,
          angle, range: w.range, life: 20, dmg: w.dmg,
          w: w.range * 2, h: 22, weapon: w });
      }
    }
  },
  knife: {
    name: 'KNIFE',
    color: '#aaaaaa',
    baseDmg: 8,
    baseCooldown: 60,
    baseRange: 300,
    desc: 'Fast piercing blade. Fires toward nearest enemy.',
    update(w, bullets, player, enemies) {
      w.cd--;
      if (w.cd <= 0) {
        w.cd = Math.round(w.baseCooldown * (1 - (w.level-1)*0.08));
        // Aim at closest enemy
        let best = null, bestD = 9999;
        for (const e of enemies) {
          if (e.dead) continue;
          const d = Math.hypot(e.x - player.x, e.y - player.y);
          if (d < bestD) { bestD = d; best = e; }
        }
        const angle = best ? Math.atan2(best.y - player.y, best.x - player.x) : Math.random() * Math.PI * 2;
        const count = 1 + Math.floor((w.level-1)/3);
        for (let i = 0; i < count; i++) {
          const spread = (i - (count-1)/2) * 0.18;
          bullets.push({ type:'knife', x:player.x, y:player.y,
            vx: Math.cos(angle+spread)*7, vy: Math.sin(angle+spread)*7,
            life: 45, dmg: w.dmg, piercing: w.level >= 5, hit: new Set() });
        }
      }
    }
  },
  magic_wand: {
    name: 'WAND',
    color: '#ff44aa',
    baseDmg: 15,
    baseCooldown: 100,
    baseRange: 280,
    desc: 'Homing magic bolt seeks enemies.',
    update(w, bullets, player, enemies) {
      w.cd--;
      if (w.cd <= 0) {
        w.cd = Math.round(w.baseCooldown * (1 - (w.level-1)*0.05));
        let targets = enemies.filter(e=>!e.dead)
          .sort((a,b) => Math.hypot(a.x-player.x,a.y-player.y) - Math.hypot(b.x-player.x,b.y-player.y))
          .slice(0, 1 + Math.floor((w.level-1)/2));
        for (const t of targets) {
          bullets.push({ type:'wand', x:player.x, y:player.y,
            target: t, speed: 5, life: 80, dmg: w.dmg, homing: true });
        }
      }
    }
  },
  axe: {
    name: 'AXE',
    color: '#44bbff',
    baseDmg: 22,
    baseCooldown: 130,
    baseRange: 250,
    desc: 'Hurls spinning axe in an arc. Area damage.',
    update(w, bullets, player, enemies) {
      w.cd--;
      if (w.cd <= 0) {
        w.cd = Math.round(w.baseCooldown * (1 - (w.level-1)*0.05));
        const dir = (player.dir===3?1:player.dir===2?-1:Math.random()>0.5?1:-1);
        const count = 1 + Math.floor((w.level-1)/3);
        for (let i = 0; i < count; i++) {
          bullets.push({ type:'axe', x:player.x, y:player.y,
            vx: dir * (4 + i * 1.5), vy: -8 - i, spin:0, dmg: w.dmg,
            life: 55, hit: new Set() });
        }
      }
    }
  },
  garlic: {
    name: 'GARLIC',
    color: '#ffffaa',
    baseDmg: 5,
    baseCooldown: 1,
    baseRange: 55,
    desc: 'Repels and damages nearby enemies constantly.',
    update(w, bullets, player, enemies) {
      // Garlic is a persistent aura, handled directly in bullet update
      w.cd--;
      if (w.cd <= 0) {
        w.cd = 50 - (w.level * 3);
        bullets.push({ type:'garlic', x:player.x, y:player.y,
          r: w.range, dmg: w.dmg, life: 30, hit: new Set() });
      }
    }
  },
  cross: {
    name: 'CROSS',
    color: '#ffdd44',
    baseDmg: 18,
    baseCooldown: 110,
    baseRange: 350,
    desc: 'Returns like a boomerang through enemies.',
    update(w, bullets, player, enemies) {
      w.cd--;
      if (w.cd <= 0) {
        w.cd = Math.round(w.baseCooldown * (1 - (w.level-1)*0.06));
        // aim away from player direction, returns
        let targetAngle = Math.random() * Math.PI * 2;
        let best = null, bestD = 9999;
        for (const e of enemies) {
          if (e.dead) continue;
          const d = Math.hypot(e.x - player.x, e.y - player.y);
          if (d < bestD) { bestD = d; best = e; }
        }
        if (best) targetAngle = Math.atan2(best.y-player.y, best.x-player.x);
        bullets.push({ type:'cross', x:player.x, y:player.y,
          ox:player.x, oy:player.y,
          vx: Math.cos(targetAngle)*6, vy: Math.sin(targetAngle)*6,
          returning: false, speed:6, dmg: w.dmg,
          life: 90, hit: new Set() });
      }
    }
  }
};

// ─── Upgrade pool ─────────────────────────────────────────────────────────────
const UPGRADES = [
  { id:'whip',      type:'weapon', name:'WHIP',       rarity:'common', color:'#e8821a', desc:'Auto-lash in movement direction. Great area clear.' },
  { id:'knife',     type:'weapon', name:'KNIFE',       rarity:'common', color:'#aaaaaa', desc:'Rapid-fire blades toward nearest enemy.' },
  { id:'magic_wand',type:'weapon', name:'WAND',        rarity:'rare',   color:'#ff44aa', desc:'Homing bolt seeks out targets automatically.' },
  { id:'axe',       type:'weapon', name:'AXE',         rarity:'rare',   color:'#44bbff', desc:'Arcing thrown axe, massive damage on impact.' },
  { id:'garlic',    type:'weapon', name:'GARLIC',      rarity:'common', color:'#ffffaa', desc:'Persistent aura pushes and burns nearby enemies.' },
  { id:'cross',     type:'weapon', name:'CROSS',       rarity:'epic',   color:'#ffdd44', desc:'Boomerang cross tears through the crowd.' },
  { id:'might',     type:'passive', name:'MIGHT',      rarity:'common', color:'#ff4444', desc:'+10% weapon damage on all attacks.' },
  { id:'speed',     type:'passive', name:'SWIFTNESS',  rarity:'common', color:'#44ff88', desc:'+0.4 movement speed.' },
  { id:'maxhp',     type:'passive', name:'VITALITY',   rarity:'common', color:'#ff8888', desc:'+20 max HP and restore 20 HP.' },
  { id:'cooldown',  type:'passive', name:'HASTE',      rarity:'rare',   color:'#aaaaff', desc:'-8% weapon cooldowns.' },
  { id:'area',      type:'passive', name:'ARCANE',     rarity:'rare',   color:'#cc44ff', desc:'+12% weapon range and area.' },
  { id:'regen',     type:'passive', name:'REGEN',      rarity:'rare',   color:'#44ffcc', desc:'+0.5 HP regen per second.' },
];

// ─── Game state ───────────────────────────────────────────────────────────────
let gameState = 'playing'; // playing | levelup | dead | win
let kills = 0;
let gameTime = 0; // frames
let GAME_DURATION = 30 * 60 * 60; // 30 min at 60fps (we speed it up)
let waveNumber = 1;

let paused = false;

// Camera
const cam = { x: 0, y: 0, shakeX:0, shakeY:0, shakeMag:0, shakeDecay:0.85 };

// Player
const player = {
  x: WORLD_W/2, y: WORLD_H/2,
  vx:0, vy:0,
  w:12, h:16,
  hp:100, maxHp:100,
  regen:0,
  speed:2.8,
  dir:0,
  moving:false,
  frame:0, frameTimer:0,
  invuln:0,
  dashTimer:0,
  tilt:0,
  activeWeapons: [],  // weapon def instances
  passives: {},
  xp: 0,
  xpToNext: 30,
  level: 1,
  might: 1.0,       // damage multiplier
  hasteBonus: 0,    // cooldown reduction
  areaBonus: 0,     // range mult
};

// Start with whip
function initWeapon(id) {
  const def = WEAPON_DEFS[id];
  return {
    id, def,
    level: 1,
    cd: 10,
    dmg: def.baseDmg,
    baseCooldown: def.baseCooldown,
    range: def.baseRange,
  };
}
player.activeWeapons.push(initWeapon('whip'));
player.activeWeapons.push(initWeapon('knife'));

// ─── Enemies ──────────────────────────────────────────────────────────────────
const ENEMY_TYPES = [
  { name:'ZOMBIE',   color:'#44cc44', hp:30,  spd:0.9,  dmg:8,  xp:2,  size:10, score:10 },
  { name:'SKELETON', color:'#ddddbb', hp:20,  spd:1.4,  dmg:6,  xp:2,  size:9,  score:15 },
  { name:'BAT',      color:'#9944cc', hp:15,  spd:2.0,  dmg:5,  xp:3,  size:7,  score:20 },
  { name:'OGRE',     color:'#cc4422', hp:120, spd:0.6,  dmg:20, xp:8,  size:18, score:50 },
  { name:'GHOST',    color:'#88aaff', hp:35,  spd:1.2,  dmg:10, xp:4,  size:11, score:25 },
  { name:'SPIDER',   color:'#aa6622', hp:25,  spd:1.8,  dmg:7,  xp:3,  size:8,  score:20 },
  { name:'DEMON',    color:'#ff2244', hp:200, spd:0.8,  dmg:25, xp:15, size:22, score:100 },
];

const enemies = [];
const gems = [];
const bullets = [];
const particles = [];

let spawnTimer = 0;
let spawnInterval = 120;

function spawnEnemy(isBoss = false) {
  const side = Math.floor(Math.random() * 4);
  let x, y;
  const margin = 60;
  if (side===0) { x = player.x + (Math.random()-0.5)*800; y = player.y - 320; }
  else if (side===1) { x = player.x + (Math.random()-0.5)*800; y = player.y + 320; }
  else if (side===2) { x = player.x - 380; y = player.y + (Math.random()-0.5)*600; }
  else { x = player.x + 380; y = player.y + (Math.random()-0.5)*600; }
  x = Math.max(40, Math.min(WORLD_W-40, x));
  y = Math.max(40, Math.min(WORLD_H-40, y));

  let type;
  if (isBoss) {
    type = ENEMY_TYPES[waveNumber % 2 === 0 ? 6 : 3];
  } else {
    // Weight by wave
    const pool = ENEMY_TYPES.slice(0, Math.min(ENEMY_TYPES.length, 2 + Math.floor(waveNumber/2)));
    type = pool[Math.floor(Math.random() * pool.length)];
  }

  const waveScale = 1 + (waveNumber-1) * 0.15;
  enemies.push({
    x, y, vx:0, vy:0,
    hp: Math.round(type.hp * waveScale),
    maxHp: Math.round(type.hp * waveScale),
    spd: type.spd * (1 + (waveNumber-1)*0.05),
    dmg: Math.round(type.dmg * waveScale),
    xp: type.xp,
    size: type.size,
    color: type.color,
    name: type.name,
    dead: false, deathTimer:0,
    invuln:0,
    wobble:0,
    vx:0, vy:0,
    flash:0,
    isBoss,
    score: type.score,
  });
}

// ─── Bullets update ───────────────────────────────────────────────────────────
function updateBullets() {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.life--;

    if (b.type === 'knife') {
      b.x += b.vx; b.y += b.vy;
      if (b.life <= 0) { bullets.splice(i, 1); continue; }
      for (const e of enemies) {
        if (e.dead || b.hit.has(e)) continue;
        if (Math.hypot(e.x - b.x, e.y - b.y) < e.size + 3) {
          hitEnemy(e, b.dmg);
          b.hit.add(e);
          if (!b.piercing) { b.life = 0; }
          spawnHitParticles(e.x, e.y, e.color);
        }
      }
    }
    else if (b.type === 'wand') {
      if (b.homing && b.target && !b.target.dead) {
        const ang = Math.atan2(b.target.y - b.y, b.target.x - b.x);
        b.vx = Math.cos(ang) * b.speed;
        b.vy = Math.sin(ang) * b.speed;
      }
      b.x += b.vx||0; b.y += b.vy||0;
      if (b.life <= 0) { bullets.splice(i, 1); continue; }
      for (const e of enemies) {
        if (e.dead) continue;
        if (Math.hypot(e.x - b.x, e.y - b.y) < e.size + 5) {
          hitEnemy(e, b.dmg);
          b.life = 0;
          spawnHitParticles(e.x, e.y, '#ff44aa');
          break;
        }
      }
    }
    else if (b.type === 'axe') {
      b.vy += 0.35;
      b.x += b.vx; b.y += b.vy;
      b.spin += 0.25;
      if (b.life <= 0) { bullets.splice(i, 1); continue; }
      for (const e of enemies) {
        if (e.dead || b.hit.has(e)) continue;
        if (Math.hypot(e.x - b.x, e.y - b.y) < e.size + 8) {
          hitEnemy(e, b.dmg);
          b.hit.add(e);
          spawnHitParticles(e.x, e.y, '#44bbff');
        }
      }
    }
    else if (b.type === 'whip') {
      if (b.life <= 0) { bullets.splice(i, 1); continue; }
      // whip lingers briefly, hits all in arc
      for (const e of enemies) {
        if (e.dead) continue;
        const dx = e.x - b.x, dy = e.y - b.y;
        if (Math.hypot(dx, dy) < b.range) {
          // directional cone check
          const angleToE = Math.atan2(dy, dx);
          const diff = Math.abs(((angleToE - b.angle) + Math.PI * 3) % (Math.PI * 2) - Math.PI);
          if (diff < Math.PI * 0.55) {
            hitEnemy(e, b.dmg);
            spawnHitParticles(e.x, e.y, '#e8821a');
          }
        }
      }
    }
    else if (b.type === 'garlic') {
      b.x = player.x; b.y = player.y;
      if (b.life <= 0) { bullets.splice(i, 1); continue; }
      if (b.life % 8 === 0) {
        for (const e of enemies) {
          if (e.dead || b.hit.has(e)) continue;
          if (Math.hypot(e.x - b.x, e.y - b.y) < b.r + e.size) {
            hitEnemy(e, b.dmg);
            b.hit.add(e);
            // Push away
            const ang = Math.atan2(e.y - b.y, e.x - b.x);
            e.vx += Math.cos(ang) * 2.5;
            e.vy += Math.sin(ang) * 2.5;
            spawnHitParticles(e.x, e.y, '#ffffaa');
          }
        }
      }
    }
    else if (b.type === 'cross') {
      if (!b.returning) {
        b.x += b.vx; b.y += b.vy;
        const d = Math.hypot(b.x - b.ox, b.y - b.oy);
        if (d > 200) b.returning = true;
      } else {
        const ang = Math.atan2(player.y - b.y, player.x - b.x);
        b.vx = Math.cos(ang) * b.speed;
        b.vy = Math.sin(ang) * b.speed;
        b.x += b.vx; b.y += b.vy;
        if (Math.hypot(b.x - player.x, b.y - player.y) < 12) { b.life = 0; }
      }
      b.spin = (b.spin||0) + 0.18;
      if (b.life <= 0) { bullets.splice(i, 1); continue; }
      for (const e of enemies) {
        if (e.dead || b.hit.has(e)) continue;
        if (Math.hypot(e.x - b.x, e.y - b.y) < e.size + 7) {
          hitEnemy(e, b.dmg);
          b.hit.add(e);
          spawnHitParticles(e.x, e.y, '#ffdd44');
        }
      }
    }
  }
}

function hitEnemy(e, rawDmg) {
  if (e.dead || e.invuln > 0) return;
  const dmg = Math.round(rawDmg * player.might);
  e.hp -= dmg;
  e.invuln = 15;
  e.flash = 8;
  spawnFloatText(e.x, e.y - e.size - 4, '-' + dmg, '#ffdd44');
  cam.shakeMag = Math.min(cam.shakeMag + 2, 8);
  if (e.hp <= 0) killEnemy(e);
}

function killEnemy(e) {
  e.dead = true;
  e.deathTimer = 40;
  kills++;
  document.getElementById('kill-count').textContent = kills;
  // Drop XP gem
  gems.push({ x: e.x, y: e.y, val: e.xp, size: 5 + e.xp * 0.8, life:999, color: e.isBoss ? '#00ffff' : '#00ff44' });
  spawnDeathParticles(e.x, e.y, e.color);
}

// XP gems
function updateGems() {
  for (let i = gems.length - 1; i >= 0; i--) {
    const g = gems[i];
    // Attract when close
    const d = Math.hypot(g.x - player.x, g.y - player.y);
    const attractRange = 80 + player.level * 5;
    if (d < attractRange) {
      const ang = Math.atan2(player.y - g.y, player.x - g.x);
      const spd = d < 30 ? 8 : 4;
      g.x += Math.cos(ang) * spd;
      g.y += Math.sin(ang) * spd;
    }
    if (d < 12) {
      player.xp += g.val;
      gems.splice(i, 1);
      checkLevelUp();
      continue;
    }
    g.life--;
    if (g.life <= 0) gems.splice(i, 1);
  }
}

function checkLevelUp() {
  while (player.xp >= player.xpToNext) {
    player.xp -= player.xpToNext;
    player.level++;
    player.xpToNext = Math.round(player.xpToNext * 1.22);
    document.getElementById('level-val').textContent = player.level;
    triggerLevelUp();
    return; // one level at a time
  }
  updateXpBar();
}

function updateXpBar() {
  const pct = Math.min(100, (player.xp / player.xpToNext) * 100);
  document.getElementById('xp-bar').style.width = pct + '%';
  document.getElementById('xp-val').textContent = player.level;
}

// ─── Level-up screen ──────────────────────────────────────────────────────────
function triggerLevelUp() {
  gameState = 'levelup';
  paused = true;
  const screen = document.getElementById('levelup-screen');
  screen.classList.add('show');
  const container = document.getElementById('upgrade-cards');
  container.innerHTML = '';

  // Pick 3 random upgrades
  const choices = pickUpgrades();
  for (const upg of choices) {
    const card = document.createElement('div');
    card.className = 'upgrade-card';
    card.innerHTML = `
      <canvas class="upgrade-card-icon" width="28" height="28" data-color="${upg.color}"></canvas>
      <div class="upgrade-card-name">${upg.name}</div>
      <div class="upgrade-card-desc">${upg.desc}</div>
      <div class="upgrade-card-rarity rarity-${upg.rarity}">${upg.rarity.toUpperCase()}</div>
    `;
    card.addEventListener('click', () => applyUpgrade(upg));
    container.appendChild(card);
    // Draw icon
    const ic = card.querySelector('canvas');
    const ictx = ic.getContext('2d');
    drawUpgradeIcon(ictx, upg, 28, 28);
  }
}

function drawUpgradeIcon(ictx, upg, w, h) {
  ictx.fillStyle = '#1a1a1a';
  ictx.fillRect(0,0,w,h);
  ictx.fillStyle = upg.color;
  // Simple pixel icon
  const cx = w/2, cy = h/2;
  if (upg.type === 'weapon') {
    ictx.fillRect(cx-2, cy-8, 4, 14); // staff
    ictx.fillRect(cx-5, cy-6, 10, 3); // crosspiece
  } else {
    ictx.fillRect(cx-5, cy-5, 10, 10); // passive orb
    ictx.fillStyle = 'rgba(255,255,255,0.3)';
    ictx.fillRect(cx-3, cy-3, 4, 4);
  }
}

function pickUpgrades() {
  const options = [];
  // Always offer one weapon upgrade or new weapon
  const owned = new Set(player.activeWeapons.map(w=>w.id));

  const weaponPool = UPGRADES.filter(u => u.type === 'weapon');
  const passivePool = UPGRADES.filter(u => u.type === 'passive');

  const shuffled = [...weaponPool].sort(()=>Math.random()-0.5);
  const passShuffled = [...passivePool].sort(()=>Math.random()-0.5);

  // Pick up to 3 unique upgrades
  const picks = [];
  // Try to include weapon options
  for (const w of shuffled) {
    if (picks.length >= 2) break;
    const existing = player.activeWeapons.find(pw=>pw.id===w.id);
    if (!existing && player.activeWeapons.length < 6) {
      picks.push({...w, isNew:true, levelUp: false});
    } else if (existing && existing.level < 8) {
      picks.push({...w, isNew:false, levelUp:true, weaponRef: existing,
        desc: `Level ${existing.level} -> ${existing.level+1}. ${w.desc}`});
    }
  }
  for (const p of passShuffled) {
    if (picks.length >= 3) break;
    picks.push({...p});
  }
  while (picks.length < 3) picks.push({...passShuffled[picks.length % passShuffled.length]});
  return picks.slice(0,3);
}

function applyUpgrade(upg) {
  if (upg.type === 'weapon') {
    if (upg.isNew) {
      player.activeWeapons.push(initWeapon(upg.id));
    } else if (upg.levelUp && upg.weaponRef) {
      const w = upg.weaponRef;
      w.level++;
      w.dmg = Math.round(w.def.baseDmg * (1 + (w.level-1)*0.2) * player.might);
      w.range = Math.round(w.def.baseRange * (1 + player.areaBonus));
    }
  } else {
    if (upg.id === 'might')    { player.might += 0.10; recalcWeaponDmg(); }
    if (upg.id === 'speed')    { player.speed += 0.4; }
    if (upg.id === 'maxhp')    { player.maxHp += 20; player.hp = Math.min(player.hp+20, player.maxHp); }
    if (upg.id === 'cooldown') { player.hasteBonus += 0.08; recalcCooldowns(); }
    if (upg.id === 'area')     { player.areaBonus += 0.12; recalcRanges(); }
    if (upg.id === 'regen')    { player.regen += 0.5; }
  }
  document.getElementById('levelup-screen').classList.remove('show');
  gameState = 'playing';
  paused = false;
  updateXpBar();
  buildWeaponHUD();
}

function recalcWeaponDmg() {
  for (const w of player.activeWeapons) {
    w.dmg = Math.round(w.def.baseDmg * (1 + (w.level-1)*0.2) * player.might);
  }
}
function recalcCooldowns() {
  for (const w of player.activeWeapons) {
    w.baseCooldown = Math.round(w.def.baseCooldown * (1 - player.hasteBonus));
  }
}
function recalcRanges() {
  for (const w of player.activeWeapons) {
    w.range = Math.round(w.def.baseRange * (1 + player.areaBonus));
  }
}

function buildWeaponHUD() {
  const container = document.getElementById('weapon-slots');
  container.innerHTML = '';
  for (const w of player.activeWeapons) {
    const div = document.createElement('div');
    div.className = 'weapon-slot';
    div.id = 'wslot-' + w.id;
    div.innerHTML = `
      <canvas class="weapon-icon" width="12" height="12" data-wid="${w.id}"></canvas>
      <span style="color:${w.def.color};width:36px">${w.def.name}</span>
      <div class="weapon-cd"><div class="weapon-cd-fill" id="wcd-${w.id}" style="width:100%"></div></div>
      <span style="font-size:5px;color:#888">L${w.level}</span>
    `;
    container.appendChild(div);
    const ic = div.querySelector('canvas');
    const ictx = ic.getContext('2d');
    ictx.fillStyle = w.def.color;
    ictx.fillRect(4,1,4,10); ictx.fillRect(1,3,10,3);
  }
}
buildWeaponHUD();

// ─── Keys ─────────────────────────────────────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => {
  if (['KeyW','KeyA','KeyS','KeyD','Space'].includes(e.code)) {
    keys[e.code] = true;
    e.preventDefault();
  }
});
document.addEventListener('keyup', e => {
  keys[e.code] = false;
});

// ─── Particles ────────────────────────────────────────────────────────────────
function spawnHitParticles(x, y, color, count=5) {
  for (let i=0; i<count; i++) {
    const a = Math.random()*Math.PI*2, s=1+Math.random()*3;
    particles.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
      life:1, decay:0.06+Math.random()*0.04, size:2+Math.random()*3, color });
  }
}
function spawnDeathParticles(x, y, color) {
  spawnHitParticles(x, y, color, 12);
  spawnHitParticles(x, y, '#ffff44', 6);
}

// Floating text
function spawnFloatText(x, y, text, color='#fff') {
  const el = document.createElement('div');
  el.className = 'float-text';
  el.textContent = text;
  el.style.color = color;
  const sx = x - cam.x + W/2;
  const sy = y - cam.y + H/2;
  el.style.left = sx + 'px';
  el.style.top  = sy + 'px';
  document.getElementById('game-wrapper').appendChild(el);
  setTimeout(()=>el.remove(), 1000);
}

// ─── Update ───────────────────────────────────────────────────────────────────
let frameCount = 0;

function update() {
  if (gameState !== 'playing') return;

  frameCount++;
  gameTime++;

  // Timer (1 game-second = 60 frames, total 30 min)
  const totalSec = Math.max(0, Math.floor((GAME_DURATION - gameTime) / 60));
  const min = Math.floor(totalSec / 60);
  const sec = totalSec % 60;
  document.getElementById('timer-display').textContent =
    String(min).padStart(2,'0') + ':' + String(sec).padStart(2,'0');

  if (gameTime >= GAME_DURATION) { endGame(true); return; }

  // Wave scaling
  waveNumber = 1 + Math.floor(gameTime / (60 * 60)); // new wave every minute
  document.getElementById('wave-display').textContent = 'WAVE ' + waveNumber;

  // HP regen
  if (player.regen > 0) {
    player.hp = Math.min(player.maxHp, player.hp + player.regen / 60);
  }

  // WASD movement
  let dx=0, dy=0;
  if (keys['KeyA']) { dx=-1; player.dir=2; }
  if (keys['KeyD']) { dx=+1; player.dir=3; }
  if (keys['KeyW']) { dy=-1; player.dir=1; }
  if (keys['KeyS']) { dy=+1; player.dir=0; }
  if (dx!==0 && dy!==0) { dx*=0.707; dy*=0.707; }
  player.moving = dx!==0 || dy!==0;

  // Dash on SPACE
  if (keys['Space'] && player.dashTimer <= 0) {
    player.dashTimer = 40;
    const dashSpd = 7;
    player.vx = dx !== 0 ? dx * dashSpd : (player.dir===3?dashSpd:player.dir===2?-dashSpd:0);
    player.vy = dy !== 0 ? dy * dashSpd : (player.dir===0?dashSpd:player.dir===1?-dashSpd:0);
    player.invuln = 30;
    spawnHitParticles(player.x, player.y, '#44aaff', 8);
  }
  if (player.dashTimer > 0) { player.dashTimer--; player.vx *= 0.82; player.vy *= 0.82; }
  else { player.vx = 0; player.vy = 0; }

  player.x = Math.max(20, Math.min(WORLD_W-20, player.x + dx*player.speed + player.vx));
  player.y = Math.max(20, Math.min(WORLD_H-20, player.y + dy*player.speed + player.vy));

  if (player.moving) {
    player.frameTimer++;
    if (player.frameTimer>6) { player.frame++; player.frameTimer=0; }
  }
  player.tilt += (dx*0.12 - player.tilt)*0.12;
  if (player.invuln>0) player.invuln--;

  // Cam
  cam.x += (player.x - cam.x)*0.1;
  cam.y += (player.y - cam.y)*0.1;
  if (cam.shakeMag > 0.2) {
    cam.shakeX = (Math.random()-0.5)*cam.shakeMag*2;
    cam.shakeY = (Math.random()-0.5)*cam.shakeMag*2;
    cam.shakeMag *= cam.shakeDecay;
  } else { cam.shakeX=0; cam.shakeY=0; cam.shakeMag=0; }

  // Spawn enemies
  spawnTimer--;
  const spawnInterval = Math.max(20, 100 - waveNumber * 8);
  if (spawnTimer <= 0) {
    spawnTimer = spawnInterval;
    const count = 1 + Math.floor(waveNumber / 3);
    for (let i=0; i<count; i++) spawnEnemy();
  }
  // Boss every 3 waves
  if (gameTime % (60*60*3) === 0) spawnEnemy(true);

  // Enemy AI
  for (const e of enemies) {
    if (e.dead) { e.deathTimer--; continue; }
    if (e.invuln>0) e.invuln--;
    if (e.flash>0) e.flash--;
    e.wobble = Math.sin(frameCount*0.12 + e.x*0.01)*1.5;

    // Move toward player
    const edx = player.x - e.x, edy = player.y - e.y;
    const ed = Math.hypot(edx, edy);
    if (ed > 2) {
      e.vx += (edx/ed)*e.spd*0.15;
      e.vy += (edy/ed)*e.spd*0.15;
    }
    // Clamp velocity
    const ev = Math.hypot(e.vx, e.vy);
    const maxSpd = e.spd * 1.2;
    if (ev > maxSpd) { e.vx=(e.vx/ev)*maxSpd; e.vy=(e.vy/ev)*maxSpd; }

    e.x = Math.max(20, Math.min(WORLD_W-20, e.x + e.vx));
    e.y = Math.max(20, Math.min(WORLD_H-20, e.y + e.vy));
    e.vx *= 0.75; e.vy *= 0.75;

    // Hit player
    if (player.invuln<=0 && Math.hypot(e.x-player.x, e.y-player.y) < e.size + player.w/2) {
      player.hp -= e.dmg / 60; // per frame
      if (player.hp <= 0) { player.hp=0; endGame(false); return; }
      player.invuln = 6;
    }
  }

  // Cleanup dead enemies
  for (let i=enemies.length-1; i>=0; i--) {
    if (enemies[i].dead && enemies[i].deathTimer <= 0) enemies.splice(i,1);
  }

  // Auto weapons
  for (const w of player.activeWeapons) {
    w.def.update(w, bullets, player, enemies);
  }

  updateBullets();
  updateGems();

  // Particles
  for (let i=particles.length-1; i>=0; i--) {
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.08;
    p.life-=p.decay;
    if(p.life<=0) particles.splice(i,1);
  }

  // Update HUD bars
  document.getElementById('hp-bar').style.width = (player.hp/player.maxHp*100)+'%';
  document.getElementById('hp-val').textContent = Math.ceil(player.hp);

  // Weapon cooldown HUD
  for (const w of player.activeWeapons) {
    const el = document.getElementById('wcd-'+w.id);
    if (el) {
      const pct = Math.max(0, 100 - (w.cd / w.baseCooldown)*100);
      el.style.width = pct + '%';
    }
  }
}

// ─── End game ─────────────────────────────────────────────────────────────────
function endGame(win) {
  gameState = win ? 'win' : 'dead';
  const screen = document.getElementById('endgame-screen');
  const title = document.getElementById('endgame-title');
  const stats = document.getElementById('endgame-stats');
  title.textContent = win ? 'SURVIVED!' : 'YOU DIED';
  title.style.color = win ? '#ffdd44' : '#cc2222';
  const survived = Math.floor(gameTime/60);
  stats.innerHTML = `KILLS: ${kills}<br>LEVEL: ${player.level}<br>TIME: ${Math.floor(survived/60)}:${String(survived%60).padStart(2,'0')}`;
  screen.classList.add('show');
}

function restartGame() {
  location.reload();
}

// ─── Render ───────────────────────────────────────────────────────────────────
function render() {
  ctx.clearRect(0,0,W,H);
  const ox = Math.round(W/2 - cam.x + cam.shakeX);
  const oy = Math.round(H/2 - cam.y + cam.shakeY);

  // Tiles
  const startC = Math.max(0, Math.floor((cam.x - W/2)/TILE));
  const endC   = Math.min(COLS, Math.ceil((cam.x + W/2)/TILE)+1);
  const startR = Math.max(0, Math.floor((cam.y - H/2)/TILE));
  const endR   = Math.min(ROWS, Math.ceil((cam.y + H/2)/TILE)+1);

  for (let r=startR; r<endR; r++) {
    for (let c=startC; c<endC; c++) {
      const tx = c*TILE+ox, ty = r*TILE+oy;
      const t = tileMap[r][c];
      if (t===0) drawGrassTop(r,c,tx,ty);
      else drawMCTile(r,c,tx,ty);
    }
  }

  // XP gems
  for (const g of gems) {
    const gx = g.x+ox, gy = g.y+oy;
    if (gx < -20 || gx > W+20 || gy < -20 || gy > H+20) continue;
    // MC-style diamond shape
    const pulse = 1 + Math.sin(frameCount*0.12)*0.15;
    const gs = Math.round(g.size * pulse);
    ctx.fillStyle = g.color;
    ctx.fillRect(gx - gs/2, gy - gs/2, gs, gs);
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillRect(gx - gs/4, gy - gs/2, gs/4, gs/4);
  }

  // Particles
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(Math.round(p.x+ox-p.size/2), Math.round(p.y+oy-p.size/2), Math.round(p.size), Math.round(p.size));
  }
  ctx.globalAlpha = 1;

  // Depth-sorted entities
  const entList = [];
  for (const e of enemies) entList.push({ type:'enemy', d:e, y:e.y });
  entList.push({ type:'player', y:player.y });
  for (const t of trees) entList.push({ type:'tree', d:t, y:t.y+t.size*0.3 });
  entList.sort((a,b)=>a.y-b.y);

  for (const ent of entList) {
    const ex = ent.type==='player' ? player.x+ox : ent.d.x+ox;
    const ey = ent.type==='player' ? player.y+oy : ent.d.y+oy;
    if (ex<-60||ex>W+60||ey<-60||ey>H+60) continue;
    if (ent.type==='player') drawPlayer(ex,ey);
    else if (ent.type==='enemy') drawEnemy(ent.d, ex, ey);
    else drawTree(ent.d, ex, ey);
  }

  // Bullets
  for (const b of bullets) {
    const bx = b.x+ox, by = b.y+oy;
    if (b.type==='knife') {
      ctx.save();
      ctx.translate(bx,by);
      ctx.rotate(Math.atan2(b.vy,b.vx));
      ctx.fillStyle = '#dddddd';
      ctx.fillRect(-8,-2,16,4);
      ctx.fillStyle = '#888';
      ctx.fillRect(-8,-1,4,2);
      ctx.restore();
    } else if (b.type==='wand') {
      ctx.fillStyle = '#ff44aa';
      ctx.fillRect(bx-4, by-4, 8, 8);
      ctx.fillStyle = '#ffaadd';
      ctx.fillRect(bx-2, by-2, 4, 4);
    } else if (b.type==='axe') {
      ctx.save();
      ctx.translate(bx,by);
      ctx.rotate(b.spin||0);
      ctx.fillStyle = '#44bbff';
      ctx.fillRect(-7,-3,14,6);
      ctx.fillRect(-3,-7,6,14);
      ctx.fillStyle = '#88ddff';
      ctx.fillRect(-3,-3,6,6);
      ctx.restore();
    } else if (b.type==='whip') {
      ctx.globalAlpha = b.life/20*0.7;
      ctx.strokeStyle = '#e8821a';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(bx, by, b.range*0.7, b.angle - Math.PI*0.5, b.angle + Math.PI*0.5);
      ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (b.type==='garlic') {
      ctx.globalAlpha = 0.18;
      ctx.fillStyle = '#ffffaa';
      ctx.beginPath();
      ctx.arc(bx, by, b.r, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 0.35;
      ctx.strokeStyle = '#ffffaa';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (b.type==='cross') {
      ctx.save();
      ctx.translate(bx,by);
      ctx.rotate(b.spin||0);
      ctx.fillStyle = '#ffdd44';
      ctx.fillRect(-10,-3,20,6);
      ctx.fillRect(-3,-10,6,20);
      ctx.fillStyle = '#ffffaa';
      ctx.fillRect(-2,-2,4,4);
      ctx.restore();
    }
  }

  // Vignette
  const vig = ctx.createRadialGradient(W/2,H/2,H*0.2,W/2,H/2,H*0.75);
  vig.addColorStop(0,'rgba(0,0,0,0)');
  vig.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle = vig;
  ctx.fillRect(0,0,W,H);

  renderMinimap();
}

// ─── MC pixel player ──────────────────────────────────────────────────────────
function drawPlayer(cx, cy) {
  ctx.save();
  ctx.translate(Math.round(cx), Math.round(cy));
  ctx.rotate(player.tilt);

  if (player.invuln > 0 && frameCount % 4 < 2) { ctx.globalAlpha = 0.4; }

  const h = player.h, w = player.w;
  // Shadow
  ctx.globalAlpha *= 0.3;
  ctx.fillStyle = '#000';
  ctx.fillRect(-w/2, h/2-2, w, 4);
  ctx.globalAlpha = player.invuln>0 && frameCount%4<2 ? 0.4 : 1;

  // Legs (pixel blocks)
  const legBob = player.moving ? Math.sin(player.frame*0.5)*2 : 0;
  ctx.fillStyle = '#2244aa';
  ctx.fillRect(-w/2, h/6 + legBob, w/2-1, h/3);  // left
  ctx.fillRect(1,    h/6 - legBob, w/2-1, h/3);   // right

  // Body (diamond blue MC armor style)
  ctx.fillStyle = '#3a6fd8';
  ctx.fillRect(-w/2, -h/6, w, h/3+2);
  ctx.fillStyle = '#4a7fe8';
  ctx.fillRect(-w/2, -h/6, w/2, (h/3+2)/2);

  // Arms
  const atkSwing = player.dashTimer > 0 ? Math.sin(frameCount*0.3)*5 : 0;
  ctx.fillStyle = '#3a6fd8';
  ctx.save(); ctx.translate(-w/2-2,-h/6);
  ctx.rotate(-atkSwing*Math.PI/180);
  ctx.fillRect(-3,0,3,h/4+1); ctx.restore();
  ctx.save(); ctx.translate(w/2+2,-h/6);
  ctx.rotate(atkSwing*Math.PI/180);
  ctx.fillRect(0,0,3,h/4+1); ctx.restore();

  // Head
  ctx.fillStyle = '#f5c89a';
  ctx.fillRect(-w/2+1,-h/2, w-2, h/4+2);
  // Hair (brown/dark)
  ctx.fillStyle = '#5c3317';
  ctx.fillRect(-w/2+1,-h/2, w-2, 3);
  // Eyes
  ctx.fillStyle = '#222';
  ctx.fillRect(-w/2+3, -h/2+5, 2, 2);
  ctx.fillRect(w/2-5,  -h/2+5, 2, 2);

  // Weapon glow when dashing
  if (player.dashTimer > 0) {
    ctx.globalAlpha = player.dashTimer/40*0.6;
    ctx.fillStyle = '#44aaff';
    ctx.fillRect(-w/2-4,-h/2-4, w+8, h+8);
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

// ─── MC pixel enemy ───────────────────────────────────────────────────────────
function drawEnemy(e, cx, cy) {
  if (e.dead && e.deathTimer <= 0) return;
  ctx.save();
  ctx.translate(Math.round(cx), Math.round(cy + e.wobble));

  if (e.dead) ctx.globalAlpha = e.deathTimer / 40;
  else if (e.flash > 0 && frameCount%2===0) ctx.globalAlpha = 0.3;

  const s = e.size;
  // Shadow
  ctx.globalAlpha *= 0.3;
  ctx.fillStyle = '#000';
  ctx.fillRect(-s*0.7, s*0.5, s*1.4, 3);
  ctx.globalAlpha = e.dead ? e.deathTimer/40 : (e.flash>0&&frameCount%2===0 ? 0.4 : 1);

  // Pixel mob body (MC-style square)
  ctx.fillStyle = e.color;
  ctx.fillRect(-s/2, -s*0.6, s, s*1.1);
  // Shading
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fillRect(s/4, -s*0.6, s/4, s*1.1);
  // Highlight
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(-s/2, -s*0.6, s/4, s*0.4);

  // Pixel eyes
  ctx.fillStyle = '#ff2222';
  ctx.fillRect(-s/2+2, -s*0.4, Math.max(2,s/5), Math.max(2,s/5));
  ctx.fillRect(s/2 - 2 - Math.max(2,s/5), -s*0.4, Math.max(2,s/5), Math.max(2,s/5));

  // HP bar (for bosses and bruisers)
  if (e.isBoss || e.maxHp > 60) {
    const bw = s*2, bh = 4;
    const bx = -bw/2;
    const by = -s*0.7 - 8;
    ctx.fillStyle = '#333';
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = e.isBoss ? '#ff2200' : '#cc2222';
    ctx.fillRect(bx, by, Math.round(bw * e.hp/e.maxHp), bh);
  }

  ctx.restore();
}

function renderMinimap() {
  const mw=80, mh=60;
  mctx.fillStyle='#111';
  mctx.fillRect(0,0,mw,mh);
  const sx=mw/WORLD_W, sy=mh/WORLD_H;

  for (const t of trees) {
    mctx.fillStyle='#2a5a15';
    mctx.fillRect(t.x*sx-1, t.y*sy-1, 3, 3);
  }
  for (const e of enemies) {
    if (e.dead) continue;
    mctx.fillStyle = e.isBoss ? '#ff0000' : e.color;
    mctx.fillRect(e.x*sx-1, e.y*sy-1, 2, 2);
  }
  for (const g of gems) {
    mctx.fillStyle='#00ff44';
    mctx.fillRect(g.x*sx, g.y*sy, 1, 1);
  }
  // Player
  mctx.fillStyle='#ffffff';
  mctx.fillRect(player.x*sx-2, player.y*sy-2, 4, 4);

  mctx.strokeStyle='rgba(255,255,255,0.2)';
  mctx.strokeRect(0,0,mw,mh);
}

// ─── Main loop ────────────────────────────────────────────────────────────────
function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}
loop();
</script>
