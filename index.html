// ═══ UPDATE ═════════════════════════════════════════════════════════════════
function update(){
  if(gameState!=='playing')return;
  frameCount++;gameTime++;

  const totalSec=Math.max(0,Math.floor((GAME_DURATION-gameTime)/60));
  const min=Math.floor(totalSec/60),sec=totalSec%60;
  document.getElementById('timer-display').textContent=String(min).padStart(2,'0')+':'+String(sec).padStart(2,'0');
  if(gameTime>=GAME_DURATION){endGame(true);return;}

  signalDepth=1+Math.floor(gameTime/(60*60));
  document.getElementById('signal-display').textContent = currentCity.name.split(' ')[0] + ' SIG.' + signalDepth;

  if(player.regen>0)player.hp=Math.min(player.maxHp,player.hp+player.regen/60);
  if(comboTimer>0)comboTimer--;else if(comboCount>0){comboCount=0;updateComboDisplay();}

  // MEMETIC EXPOSURE increases over time
  memeticExposure=Math.min(100,memeticExposure+0.003+signalDepth*0.001);
  // Low ORDER accelerates memetic exposure
  if(orderValue<30)memeticExposure=Math.min(100,memeticExposure+0.005);
  updateOrderHUD();

  // Brain rot messages — frequency based on memetic exposure + ORDER
  if(brainrotTimer>0)brainrotTimer--;
  else{
    const brChance=0.0005+memeticExposure*0.0003+(orderValue<20?0.002:0);
    if(Math.random()<brChance)triggerBrainrotMsg();
  }

  // Progressive corruption: boss spawning
  const gameMinutes=gameTime/3600;
  if(Math.abs(gameTime-60*60*9)<2)spawnEnemy('moderator'); // ~9 min
  if(Math.abs(gameTime-60*60*18)<2)spawnEnemy('sun'); // ~18 min
  if(Math.abs(gameTime-60*60*26)<2)spawnEnemy('fish'); // ~26 min

  const slow=BCAST.active?BCAST.slowFactor:1;

  // Movement
  let dx=0,dy=0;
  if(isMobile && touchActive){
    const psc=toScreen(player.x,player.y,0);
    const tdx=touchX-psc.sx,tdy=touchY-psc.sy;
    const dist=Math.hypot(tdx,tdy);
    if(dist>8){
      dx=tdx/dist;dy=tdy/dist;
      if(Math.abs(dx)>Math.abs(dy)) player.dir = dx<0?2:3;
      else player.dir = dy<0?1:0;
      player.moving=true;
      
      // Face aim in the direction of touch/movement
      const ci=worldToIso(cam.x,cam.y);
      const rx=touchX-W/2+ci.sx-cam.shakeX;
      const ry=touchY-H/2+ci.sy-cam.shakeY;
      mouse.wx=(rx/(TILE_W/2)+ry/(TILE_H/2))/2;
      mouse.wy=(ry/(TILE_H/2)-rx/(TILE_W/2))/2;
      mouse.sx=touchX;
      mouse.sy=touchY;
    }
  }else{
    if(keys['KeyA']){dx=-1;player.dir=2;}
    if(keys['KeyD']){dx=+1;player.dir=3;}
    if(keys['KeyW']){dy=-1;player.dir=1;}
    if(keys['KeyS']){dy=+1;player.dir=0;}
    if(dx!==0&&dy!==0){dx*=0.707;dy*=0.707;}
    player.moving=dx!==0||dy!==0;
  }

  // Broadcast activation
  if(player.dashCooldown>0)player.dashCooldown--;
  if(keys['Space']&&!BCAST.active&&BCAST.cooldown<=0){
    BCAST.active=true;BCAST.timer=BCAST.maxTime;
    document.getElementById('broadcast-overlay').classList.add('active');
    flashScreen('#C5A03F2a',120);triggerGlitch(5);
    spawnKzParticles(player.x,player.y,KZ.gold,25);
    spawnKzParticles(player.x,player.y,KZ.bone,12);
    player.squash=0.6;player.stretch=1.5;
    playSound('broadcast');
  }
  if(keys['Space']&&BCAST.cooldown>0&&player.dashTimer<=0&&player.dashCooldown<=0){
    player.dashTimer=30;player.dashCooldown=25;
    const ds=6;const ang=Math.atan2(mouse.wy-player.y,mouse.wx-player.x);
    player.dashVx=dx!==0||dy!==0?dx*ds:Math.cos(ang)*ds;
    player.dashVy=dx!==0||dy!==0?dy*ds:Math.sin(ang)*ds;
    player.invuln=28;spawnKzParticles(player.x,player.y,KZ.gold,10);
  }
  if(player.dashTimer>0){player.dashTimer--;player.dashVx*=0.78;player.dashVy*=0.78;}
  else{player.dashVx=0;player.dashVy=0;}
  player.squash+=(1-player.squash)*0.18;player.stretch+=(1-player.stretch)*0.18;

  const spd=player.speed/TILE_W*2;
  player.x=Math.max(1,Math.min(WORLD_COLS-1,player.x+dx*spd+player.dashVx/TILE_W*2));
  player.y=Math.max(1,Math.min(WORLD_ROWS-1,player.y+dy*spd+player.dashVy/TILE_W*2));

  // Solid building/prop collision check
  const npx = player.x;
  const npy = player.y;
  for (const pr of props) {
    if (pr.type === 'building' || pr.type === 'wall' || pr.type === 'pillar') {
      const dist = Math.hypot(npx - pr.c, npy - pr.r);
      const minCollDist = pr.type === 'building' ? 0.95 : 0.6;
      if (dist < minCollDist) {
        const pushX = dist > 0.001 ? (npx - pr.c) / dist : 1;
        const pushY = dist > 0.001 ? (npy - pr.r) / dist : 0;
        player.x = pr.c + pushX * minCollDist;
        player.y = pr.r + pushY * minCollDist;
        if (frameCount % 15 === 0) playSound('hit');
      }
    }
  }
  player.tilt+=(dx*0.12-player.tilt)*0.12;
  if(player.moving){player.frameTimer++;if(player.frameTimer>5){player.frame++;player.frameTimer=0;}}
  if(player.invuln>0)player.invuln--;

  cam.x+=(player.x-cam.x)*0.10;cam.y+=(player.y-cam.y)*0.10;
  if(cam.shakeMag>0.2){
    cam.shakeX=(Math.random()-0.5)*cam.shakeMag*2;
    cam.shakeY=(Math.random()-0.5)*cam.shakeMag*1.5;
    cam.shakeMag*=cam.shakeDecay;
  }else{cam.shakeX=0;cam.shakeY=0;cam.shakeMag=0;}
  cam.shakeRot*=0.9;

  if(streakTimer>0)streakTimer--;else{streakCount=0;document.getElementById('streak-val').textContent=0;}

  // Spawn enemies
  spawnTimer--;
  const spInt=Math.max(14,85-signalDepth*7);
  if(spawnTimer<=0){
    spawnTimer=spInt;
    const cnt=1+Math.floor(signalDepth/3);
    for(let i=0;i<cnt;i++)spawnEnemy();
  }
  if(gameTime%(60*60*3)===1)spawnEnemy(true);

  // Update enemies
  for(const e of enemies){
    if(e.dead){e.deathTimer--;continue;}
    if(e.invuln>0)e.invuln--;
    if(e.flash>0)e.flash--;
    if(e.stunned>0){e.stunned-=BCAST.active?0.5:1;continue;}

    // Living shadows: delayed shadow position
    e.shadowX+=(e.x-e.shadowX)*0.06;
    e.shadowY+=(e.y-e.shadowY)*0.06;

    // Boss: The Moderator — removes a skill
    if(e.bossType==='moderator'&&!e.dead&&e.removeTimer<=0&&Math.random()<0.003&&player.activeWeapons.length>1){
      const idx=Math.floor(Math.random()*player.activeWeapons.length);
      e.removedSkill=player.activeWeapons.splice(idx,1)[0];
      e.removeTimer=600; // 10 seconds
      showSysNotif('COMMENT REMOVED');
      triggerGlitch(10);buildDripHUD();
    }
    if(e.removeTimer>0){
      e.removeTimer--;
      if(e.removeTimer<=0&&e.removedSkill){
        player.activeWeapons.push(e.removedSkill);
        e.removedSkill=null;buildDripHUD();
        showSysNotif('COMMENT RESTORED');
      }
    }

    // Boss: Sun That Is Looking — damages if player faces it
    if(e.bossType==='sun'&&!e.dead){
      const ang=Math.atan2(e.y-player.y,e.x-player.x);
      const pAng=Math.atan2(mouse.wy-player.y,mouse.wx-player.x);
      const diff=Math.abs(((pAng-ang)+Math.PI*3)%(Math.PI*2)-Math.PI);
      if(diff<0.4&&Math.hypot(e.x-player.x,e.y-player.y)<15){
        player.hp-=0.15;
        if(frameCount%20===0)spawnFloatText(toScreen(player.x,player.y,0).sx,toScreen(player.x,player.y,0).sy-30,'SEEN',KZ.gold,false);
      }
    }

    e.z=Math.sin(frameCount*0.08+e.bobPhase)*0.04;
    e.squash=(e.squash||1)+(1-(e.squash||1))*0.2;
    e.stretch=(e.stretch||1)+(1-(e.stretch||1))*0.2;

    const edx=player.x-e.x,edy=player.y-e.y;
    const ed=Math.hypot(edx,edy);
    const eSlow=BCAST.active?slow:1;
    if(ed>0.2){e.vx+=(edx/ed)*e.spd*0.012*eSlow;e.vy+=(edy/ed)*e.spd*0.012*eSlow;}
    const ev=Math.hypot(e.vx,e.vy),ms=e.spd*0.058*eSlow;
    if(ev>ms){e.vx=(e.vx/ev)*ms;e.vy=(e.vy/ev)*ms;}
    e.x=Math.max(0.5,Math.min(WORLD_COLS-0.5,e.x+e.vx));
    e.y=Math.max(0.5,Math.min(WORLD_ROWS-0.5,e.y+e.vy));
    e.vx*=0.8;e.vy*=0.8;

    if(player.invuln<=0&&Math.hypot(e.x-player.x,e.y-player.y)<e.size+0.22){
      player.hp-=e.dmg/60;
      if(player.hp<=0){player.hp=0;endGame(false);return;}
      player.invuln=8;
      document.getElementById('dmg-vignette').classList.add('hit');
      setTimeout(()=>document.getElementById('dmg-vignette').classList.remove('hit'),200);
      triggerGlitch(4);
      playSound('hit');
      // Reality stability flash
      orderValue=Math.max(0,orderValue-0.5);
    }
  }
  for(let i=enemies.length-1;i>=0;i--)if(enemies[i].dead&&enemies[i].deathTimer<=0)enemies.splice(i,1);

  for(const w of player.activeWeapons)w.def.update(w,bullets,player,enemies);
  updateBullets();updateGems();updateBroadcast();
  updateWatchingEyes();

  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.z+=p.vz;p.vz*=0.88;if(p.z<0){p.z=0;p.vz*=-0.35;}
    p.vx*=0.94;p.vy*=0.94;p.life-=p.decay;if(p.life<=0)particles.splice(i,1);
  }

  document.getElementById('reality-bar').style.width=(player.hp/player.maxHp*100)+'%';
  document.getElementById('reality-val').textContent=Math.round(player.hp/player.maxHp*100)+'%';
  for(const w of player.activeWeapons){
    const el=document.getElementById('wcd-'+w.id);
    if(el)el.style.width=Math.max(0,100-(w.cd/w.baseCooldown)*100)+'%';
  }
}

// ═══ DRAW PLAYER (Robed Figure) ═════════════════════════════════════════════
function drawIsoPlayer(){
  const sc=toScreen(player.x,player.y,0);
  const cx=sc.sx,cy=sc.sy;
  // Always bob slightly to give a floating/mystical feel
  const bob=Math.sin(frameCount*0.06)*2.5 + (player.moving?Math.sin(player.frame*0.5)*1.2:0);
  const sq=player.squash,st=player.stretch;

  // Broadcast after-images
  for(const img of BCAST.afterImages){
    const isc=toScreen(img.x,img.y,0);
    ctx.save();ctx.globalAlpha=img.alpha*0.4;
    ctx.translate(isc.sx,isc.sy + Math.sin(frameCount*0.06 + img.x)*2.5);
    ctx.scale(img.squash,img.stretch);
    ctx.fillStyle=KZ.gold;
    // Draw simple silhouette for afterimage
    ctx.beginPath();
    ctx.moveTo(-6, 0);
    ctx.bezierCurveTo(-10, -14, -8, -26, 0, -32);
    ctx.bezierCurveTo(8, -26, 10, -14, 6, 0);
    ctx.closePath();ctx.fill();
    ctx.restore();
  }

  if(player.invuln>0&&frameCount%4<2)ctx.globalAlpha=0.4;

  // Shadow (disconnected from body for floating effect)
  ctx.save();
  const shadowAlpha = 0.25 - (bob / 2.5) * 0.05;
  ctx.globalAlpha = shadowAlpha;
  ctx.fillStyle = '#000';
  ctx.beginPath();ctx.ellipse(cx,cy+6,12*sq,4/st,0,0,Math.PI*2);ctx.fill();
  
  // Faint glowing gold/crimson ritual circle outline under the player's shadow
  ctx.globalAlpha = 0.08 + Math.sin(frameCount * 0.05) * 0.04;
  ctx.strokeStyle = KZ.gold;
  ctx.lineWidth = 1;
  ctx.beginPath();ctx.ellipse(cx,cy+6,15*sq,5/st,0,0,Math.PI*2);ctx.stroke();
  ctx.restore();
  
  ctx.globalAlpha=player.invuln>0&&frameCount%4<2?0.4:1;

  ctx.save();ctx.translate(cx,cy+bob);ctx.scale(sq,st);

  // Broadcast aura
  if(BCAST.active){
    ctx.globalAlpha=0.12+Math.sin(frameCount*0.2)*0.06;
    ctx.fillStyle=KZ.gold;
    ctx.beginPath();ctx.ellipse(0,-16,24,34,0,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }
  if(player.dashTimer>12){
    ctx.globalAlpha=player.dashTimer/30*0.2;ctx.fillStyle=KZ.gold;
    ctx.beginPath();ctx.ellipse(0,-14,20,28,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  }

  // 1. Draw Robe/Cloak body (Bezier curves for fluid cloth feel)
  // Back cloak layer
  ctx.fillStyle='#180f14';
  ctx.beginPath();
  ctx.moveTo(-8, 0);
  ctx.bezierCurveTo(-14, -14, -10, -26, 0, -32);
  ctx.bezierCurveTo(10, -26, 14, -14, 8, 0);
  ctx.closePath();
  ctx.fill();

  // Front robe drape
  ctx.fillStyle=KZ.bone;
  ctx.beginPath();
  ctx.moveTo(-5, 0);
  ctx.bezierCurveTo(-8, -8, -6, -20, 0, -24);
  ctx.bezierCurveTo(6, -20, 8, -8, 5, 0);
  ctx.closePath();
  ctx.fill();

  // Draw crimson patterns on the robe
  ctx.strokeStyle=KZ.crimson;
  ctx.lineWidth=1.2;
  ctx.beginPath();
  ctx.moveTo(-3, -2);
  ctx.quadraticCurveTo(-5, -10, 0, -22);
  ctx.moveTo(3, -2);
  ctx.quadraticCurveTo(5, -10, 0, -22);
  ctx.stroke();

  // Crimson Sash
  ctx.fillStyle=KZ.crimson;
  ctx.fillRect(-4, -6, 8, 2.5);

  // 2. Draw Hood & Shadow Face
  ctx.fillStyle='#1c1218';
  ctx.beginPath();
  ctx.arc(0, -26, 7.5, 0, Math.PI*2);
  ctx.fill();

  // Hood opening (deep void face)
  ctx.fillStyle='#000';
  ctx.beginPath();
  ctx.ellipse(0, -26, 4.5, 5.5, 0, 0, Math.PI*2);
  ctx.fill();

  // 3. Glowing Golden Eye in Void Face
  const eyePulse=0.85+Math.sin(frameCount*0.12)*0.15;
  ctx.globalAlpha=0.4*eyePulse;
  ctx.fillStyle=KZ.gold;
  ctx.beginPath();
  ctx.arc(0, -26, 3.5, 0, Math.PI*2);
  ctx.fill();
  
  ctx.globalAlpha=1;
  ctx.fillStyle=KZ.gold;
  ctx.beginPath();
  ctx.ellipse(0, -26, 2.5*eyePulse, 1.4*eyePulse, 0, 0, Math.PI*2);
  ctx.fill();
  
  ctx.fillStyle='#000';
  ctx.beginPath();
  ctx.arc(0, -26, 0.8, 0, Math.PI*2);
  ctx.fill();

  // 4. Orbiting Occult Shards
  ctx.globalAlpha=0.6;
  ctx.fillStyle=KZ.gold;
  for(let i=0;i<3;i++){
    const ang = frameCount * 0.04 + i * (Math.PI * 2 / 3);
    const rx = Math.cos(ang) * 14;
    const ry = -12 + Math.sin(ang) * 5;
    ctx.beginPath();
    ctx.moveTo(rx, ry - 2);
    ctx.lineTo(rx + 1.5, ry);
    ctx.lineTo(rx, ry + 2);
    ctx.lineTo(rx - 1.5, ry);
    ctx.closePath();
    ctx.fill();
  }
  ctx.globalAlpha=1;

  // Broadcast orbital
  if(BCAST.active||player.dashTimer>0){
    const alpha=BCAST.active?0.6:player.dashTimer/30*0.5;
    ctx.globalAlpha=alpha;ctx.fillStyle=KZ.gold;
    for(let i=0;i<4;i++){
      const a=frameCount*0.4+i*Math.PI*0.5;
      const r=22+Math.sin(frameCount*0.15)*3;
      ctx.beginPath();ctx.arc(Math.cos(a)*r,-12+Math.sin(a)*r*0.4,1.5,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  ctx.restore();ctx.globalAlpha=1;

  // Add player glow to bloom
  const bS=1/4;
  bloomCtx.globalAlpha=0.5;bloomCtx.fillStyle=KZ.gold;
  bloomCtx.beginPath();bloomCtx.arc(cx*bS,(cy-26)*bS,4.5,0,Math.PI*2);bloomCtx.fill();
  bloomCtx.globalAlpha=1;
}

// ═══ DRAW ENEMY (Kurazian shapes) ═══════════════════════════════════════════
function drawIsoEnemy(e){
  const sc=toScreen(e.x,e.y,e.z);
  const cx=sc.sx,cy=sc.sy;
  if(cx<-70||cx>W+70||cy<-70||cy>H+90)return;

  // Subconscious rendering: WITNESS and INFINITE EMPLOYEE flicker
  if((e.shape==='witness'||e.shape==='employee')&&!e.isBoss){
    if(frameCount%10>=8&&memeticExposure>25)return; // invisible 2/10 frames
  }

  if(e.dead)ctx.globalAlpha=e.deathTimer/35;
  else if(e.flash>0&&frameCount%2===0)ctx.globalAlpha=0.3;

  const s=Math.round(e.size*TILE_W);
  const sq=e.squash||1,st=e.stretch||1;

  // Dynamic shadow with offset (living shadows)
  const shSc=toScreen(e.shadowX||e.x,e.shadowY||e.y,0);
  ctx.save();
  ctx.globalAlpha=(e.dead?e.deathTimer/35:1)*0.18;
  ctx.fillStyle='#000';
  ctx.beginPath();ctx.ellipse(shSc.sx,shSc.sy+s*0.15,s*0.6*sq,s*0.15/st,0,0,Math.PI*2);ctx.fill();
  ctx.restore();

  if(e.dead)ctx.globalAlpha=e.deathTimer/35;
  else if(e.flash>0&&frameCount%2===0)ctx.globalAlpha=0.3;
  else ctx.globalAlpha=1;

  ctx.save();ctx.translate(cx,cy);ctx.scale(sq,st);
  const col=e.color;

  if(e.stunned>0){
    ctx.globalAlpha=0.3+Math.sin(frameCount*0.3)*0.2;
    ctx.strokeStyle=KZ.gold;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,-s,s*0.7,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=1;
  }

  // Shape-specific rendering
  if(e.shape==='witness'){
    // Tall, thin, single large eye
    isoBox(0,0,s*0.5,s*1.1,s*0.3,shadeHex(col,10),col,shadeHex(col,-30));
    // Single eye
    ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(0,-s*0.7,s*0.25,s*0.15,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=KZ.gold;ctx.beginPath();ctx.arc(0,-s*0.7,s*0.1,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(0,-s*0.7,s*0.04,0,Math.PI*2);ctx.fill();
  }else if(e.shape==='dog'){
    // Four-legged, low, fast
    const legPhase=frameCount*0.3+e.bobPhase;
    ctx.fillStyle=col;
    ctx.fillRect(-s*0.45,-s*0.3,s*0.9,s*0.3); // body
    ctx.fillRect(-s*0.5,-s*0.4,s*0.2,s*0.15); // head
    // Legs
    ctx.fillStyle=shadeHex(col,-20);
    ctx.fillRect(-s*0.35,0,s*0.12,s*0.2+Math.sin(legPhase)*2);
    ctx.fillRect(-s*0.1,0,s*0.12,s*0.2-Math.sin(legPhase)*2);
    ctx.fillRect(s*0.1,0,s*0.12,s*0.2+Math.sin(legPhase+1)*2);
    ctx.fillRect(s*0.3,0,s*0.12,s*0.2-Math.sin(legPhase+1)*2);
    // Eye
    ctx.fillStyle=KZ.crimson;ctx.fillRect(-s*0.48,-s*0.38,s*0.08,s*0.06);
  }else if(e.shape==='listener'){
    // Large with ear protrusions
    isoBox(0,0,s*0.8,s*0.85,s*0.4,shadeHex(col,10),col,shadeHex(col,-30));
    // Head
    const hs=s*0.5;
    isoBox(0,-s*0.85,hs,hs,hs*0.4,shadeHex(col,20),shadeHex(col,10),shadeHex(col,-15));
    // Ear protrusions
    ctx.fillStyle=shadeHex(col,30);
    ctx.beginPath();ctx.moveTo(-hs*0.6,-s*0.85);ctx.lineTo(-hs*1.2,-s*1.2);ctx.lineTo(-hs*0.4,-s*1.1);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(hs*0.6,-s*0.85);ctx.lineTo(hs*1.2,-s*1.2);ctx.lineTo(hs*0.4,-s*1.1);ctx.closePath();ctx.fill();
    // Small eyes
    ctx.fillStyle=KZ.signal;
    ctx.fillRect(-hs*0.2,-s*0.85-hs*0.4,2,2);ctx.fillRect(hs*0.1,-s*0.85-hs*0.4,2,2);
  }else if(e.shape==='admin'){
    // Smiling administrator
    isoBox(0,0,s*0.7,s*0.9,s*0.35,shadeHex(col,10),col,shadeHex(col,-30));
    const hs=s*0.55;
    isoBox(0,-s*0.9,hs,hs,hs*0.4,shadeHex(col,25),shadeHex(col,10),shadeHex(col,-20));
    // The Smile
    ctx.strokeStyle='#000';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(0,-s*0.9-hs*0.2,hs*0.3,0.2,Math.PI-0.2);ctx.stroke();
    // Dot eyes
    ctx.fillStyle='#000';
    ctx.beginPath();ctx.arc(-hs*0.2,-s*0.9-hs*0.5,1.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(hs*0.2,-s*0.9-hs*0.5,1.5,0,Math.PI*2);ctx.fill();
  }else if(e.shape==='certified'){
    // Normal human, gray, badge
    isoBox(0,0,s*0.65,s*0.85,s*0.3,shadeHex(col,10),col,shadeHex(col,-25));
    const hs=s*0.5;
    isoBox(0,-s*0.85,hs,hs,hs*0.4,shadeHex(col,20),shadeHex(col,5),shadeHex(col,-15));
    // Badge
    ctx.fillStyle=KZ.gold;ctx.fillRect(-s*0.15,-s*0.5,s*0.12,s*0.08);
    // Eyes
    ctx.fillStyle='#555';
    ctx.fillRect(-hs*0.25,-s*0.85-hs*0.4,2,2);ctx.fillRect(hs*0.1,-s*0.85-hs*0.4,2,2);
  }else if(e.shape==='employee'){
    // Suit, no face
    isoBox(0,0,s*0.6,s*1.0,s*0.3,'#1a1a20',col,shadeHex(col,-20));
    const hs=s*0.45;
    isoBox(0,-s*1.0,hs,hs,hs*0.4,shadeHex(col,10),col,shadeHex(col,-15));
    // NO face — just blank
    ctx.fillStyle=col;ctx.fillRect(-hs*0.3,-s*1.0-hs*0.6,hs*0.6,hs*0.4);
  }else if(e.shape==='priest'){
    // Boss: robed, multiple eyes
    isoBox(0,0,s*0.75,s*0.9,s*0.35,shadeHex(col,10),col,shadeHex(col,-30));
    const hs=s*0.6;
    isoBox(0,-s*0.9,hs,hs,hs*0.4,shadeHex(col,25),shadeHex(col,10),shadeHex(col,-20));
    // Multiple eyes
    const eyeColors=[KZ.gold,KZ.crimson,KZ.signal];
    for(let ei=0;ei<5;ei++){
      const ex=(ei-2)*hs*0.2,ey=-s*0.9-hs*(0.3+Math.sin(ei*1.3)*0.15);
      ctx.fillStyle=eyeColors[ei%3];
      ctx.beginPath();ctx.arc(ex,ey,2,0,Math.PI*2);ctx.fill();
    }
    // Crown spikes
    ctx.strokeStyle=KZ.gold;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(-hs*0.3,-s*0.9-hs);ctx.lineTo(-hs*0.3,-s*0.9-hs*1.4);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,-s*0.9-hs);ctx.lineTo(0,-s*0.9-hs*1.6);ctx.stroke();
    ctx.beginPath();ctx.moveTo(hs*0.3,-s*0.9-hs);ctx.lineTo(hs*0.3,-s*0.9-hs*1.4);ctx.stroke();
  }else if(e.shape==='moderator'){
    // Boss: large admin with X marks
    isoBox(0,0,s*0.8,s*1.0,s*0.4,shadeHex(col,10),col,shadeHex(col,-25));
    const hs=s*0.6;
    isoBox(0,-s*1.0,hs,hs,hs*0.4,shadeHex(col,25),shadeHex(col,10),shadeHex(col,-15));
    // X mark
    ctx.strokeStyle='#fff';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(-hs*0.3,-s*1.0-hs*0.6);ctx.lineTo(hs*0.3,-s*1.0-hs*0.2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(hs*0.3,-s*1.0-hs*0.6);ctx.lineTo(-hs*0.3,-s*1.0-hs*0.2);ctx.stroke();
  }else if(e.shape==='sun'){
    // Golden circle with eye — stays at edge
    const pulse=0.8+Math.sin(frameCount*0.05)*0.2;
    ctx.fillStyle=KZ.gold;ctx.globalAlpha*=0.3*pulse;
    ctx.beginPath();ctx.arc(0,-s*0.5,s*1.2,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=e.dead?e.deathTimer/35:1;
    ctx.fillStyle='#FFD700';
    ctx.beginPath();ctx.arc(0,-s*0.5,s*0.6,0,Math.PI*2);ctx.fill();
    // Eye in center
    ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(0,-s*0.5,s*0.25,s*0.15,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=KZ.crimson;ctx.beginPath();ctx.arc(0,-s*0.5,s*0.08,0,Math.PI*2);ctx.fill();
    // Rays
    ctx.strokeStyle=KZ.gold+'66';ctx.lineWidth=1;
    for(let r=0;r<8;r++){
      const a=r*Math.PI/4+frameCount*0.01;
      ctx.beginPath();ctx.moveTo(Math.cos(a)*s*0.7,-s*0.5+Math.sin(a)*s*0.7);
      ctx.lineTo(Math.cos(a)*s*1.5,-s*0.5+Math.sin(a)*s*1.5);ctx.stroke();
    }
  }else if(e.shape==='fish'){
    // Just a fish. Simple.
    ctx.fillStyle=col;
    ctx.beginPath();ctx.ellipse(0,-s*0.3,s*0.5,s*0.25,0,0,Math.PI*2);ctx.fill();
    // Tail
    ctx.beginPath();ctx.moveTo(s*0.4,-s*0.3);ctx.lineTo(s*0.7,-s*0.1);ctx.lineTo(s*0.7,-s*0.5);ctx.closePath();ctx.fill();
    // Eye
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(-s*0.2,-s*0.35,2,0,Math.PI*2);ctx.fill();
    // Mouth
    ctx.strokeStyle='#000';ctx.lineWidth=0.8;
    ctx.beginPath();ctx.arc(-s*0.35,-s*0.28,2,0.3,1.2);ctx.stroke();
  }else{
    // Default fallback
    isoBox(0,0,s*0.7,s*0.9,s*0.35,shadeHex(col,10),col,shadeHex(col,-30));
    const hs=s*0.55;
    isoBox(0,-s*0.9,hs,hs,hs*0.4,shadeHex(col,25),shadeHex(col,10),shadeHex(col,-20));
    ctx.fillStyle=KZ.gold;
    ctx.fillRect(-hs*0.3,-s*0.9-hs*0.5,3,2);ctx.fillRect(hs*0.1,-s*0.9-hs*0.5,3,2);
  }

  // HP bar
  if(e.maxHp>25||e.isBoss){
    const bw=s*1.5,bh=e.isBoss?5:3;
    const by2=e.shape==='sun'?-s*1.8:-s-(e.shape==='fish'?s*0.3:s*0.5)-12;
    ctx.fillStyle='#0A0608';ctx.fillRect(-bw/2,by2,bw,bh);
    const hpPct=e.hp/e.maxHp;
    ctx.fillStyle=e.isBoss?`hsl(${hpPct*40},80%,40%)`:KZ.crimson;
    ctx.fillRect(-bw/2,by2,bw*hpPct,bh);
    if(e.isBoss){ctx.strokeStyle=KZ.gold+'44';ctx.lineWidth=0.5;ctx.strokeRect(-bw/2,by2,bw,bh);}
  }

  // Memetic name display (spaced out at high memetic exposure)
  if(e.isBoss&&!e.dead){
    const name=memeticExposure>50?e.name.split('').join(' '):e.name;
    ctx.fillStyle=KZ.bone+'88';ctx.font='4px Share Tech Mono';ctx.textAlign='center';
    ctx.fillText(name,0,-s*1.2-18);
  }

  ctx.restore();ctx.globalAlpha=1;

  // Bloom glow for enemy eyes
  const bS=1/4;
  bloomCtx.globalAlpha=0.2;bloomCtx.fillStyle=e.color;
  bloomCtx.beginPath();bloomCtx.arc(cx*bS,(cy-s*0.7)*bS,2,0,Math.PI*2);bloomCtx.fill();
  bloomCtx.globalAlpha=1;
}

// ═══ DRAW BULLETS ═══════════════════════════════════════════════════════════
function drawBullets(){
  for(const b of bullets){
    const sc=toScreen(b.x,b.y,b.z||0);
    const bx=sc.sx,by=sc.sy;
    const bS=1/4;
    if(b.type==='memory'){
      ctx.save();ctx.translate(bx,by);ctx.rotate(Math.atan2(b.vy,b.vx));
      ctx.globalAlpha=0.3;ctx.fillStyle=KZ.bone;ctx.fillRect(-8,-3,16,6);
      ctx.globalAlpha=1;ctx.fillStyle=KZ.bone;ctx.fillRect(-6,-1.5,12,3);
      ctx.fillStyle='#fff';ctx.fillRect(-2,-0.5,4,1);
      ctx.restore();
      bloomCtx.globalAlpha=0.5;bloomCtx.fillStyle=KZ.bone;
      bloomCtx.beginPath();bloomCtx.arc(bx*bS,by*bS,3,0,Math.PI*2);bloomCtx.fill();
    }else if(b.type==='prayer'){
      const scR=b.r*TILE_W*0.9;
      ctx.globalAlpha=b.life/22*0.5;ctx.strokeStyle=KZ.gold;ctx.lineWidth=2.5;
      ctx.beginPath();ctx.ellipse(bx,by,scR,scR*0.4,0,0,Math.PI*2);ctx.stroke();
      ctx.globalAlpha=b.life/22*0.1;ctx.fillStyle=KZ.gold;
      ctx.beginPath();ctx.ellipse(bx,by,scR,scR*0.4,0,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=1;
      bloomCtx.globalAlpha=0.3;bloomCtx.strokeStyle=KZ.gold;bloomCtx.lineWidth=2;
      bloomCtx.beginPath();bloomCtx.ellipse(bx*bS,by*bS,scR*bS,scR*0.4*bS,0,0,Math.PI*2);bloomCtx.stroke();
    }else if(b.type==='saint'){
      // Cross shape
      ctx.globalAlpha=0.3;ctx.fillStyle=KZ.crimson;
      ctx.beginPath();ctx.arc(bx,by,12,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=1;ctx.fillStyle=KZ.crimson;
      ctx.fillRect(bx-2,by-8,4,16);ctx.fillRect(bx-6,by-2,12,4);
      ctx.fillStyle='#fff8';ctx.fillRect(bx-1,by-1,2,2);
      bloomCtx.globalAlpha=0.5;bloomCtx.fillStyle=KZ.crimson;
      bloomCtx.beginPath();bloomCtx.arc(bx*bS,by*bS,4,0,Math.PI*2);bloomCtx.fill();
    }else if(b.type==='signal'){
      const r=b.r*0.72;
      ctx.globalAlpha=b.life/16*0.8;ctx.strokeStyle=KZ.signal;ctx.lineWidth=4;
      ctx.beginPath();ctx.arc(bx,by,r*0.45,b.angle-Math.PI*0.6,b.angle+Math.PI*0.6);ctx.stroke();
      ctx.strokeStyle='#fff3';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(bx,by,r*0.45,b.angle-Math.PI*0.6,b.angle+Math.PI*0.6);ctx.stroke();
      ctx.globalAlpha=1;
    }else if(b.type==='parasite'){
      const ar=b.r*0.75;
      const pulse=0.12+Math.sin(frameCount*0.28)*0.04;
      ctx.globalAlpha=pulse;ctx.fillStyle=KZ.rot;
      ctx.beginPath();ctx.ellipse(bx,by,ar,ar*0.38,0,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=0.35;ctx.strokeStyle=KZ.rot;ctx.lineWidth=2;
      ctx.beginPath();ctx.ellipse(bx,by,ar,ar*0.38,0,0,Math.PI*2);ctx.stroke();
      ctx.globalAlpha=1;
    }else if(b.type==='hymn'){
      ctx.save();ctx.translate(bx,by);ctx.rotate(b.spin||0);
      ctx.globalAlpha=0.3;ctx.fillStyle=KZ.gold;
      ctx.fillRect(-10,-2,20,4);ctx.fillRect(-2,-10,4,20);
      ctx.globalAlpha=1;ctx.fillStyle=KZ.gold;
      ctx.fillRect(-8,-1.5,16,3);ctx.fillRect(-1.5,-8,3,16);
      ctx.fillStyle='#fff8';ctx.fillRect(-1.5,-1.5,3,3);
      ctx.restore();
      bloomCtx.globalAlpha=0.4;bloomCtx.fillStyle=KZ.gold;
      bloomCtx.beginPath();bloomCtx.arc(bx*bS,by*bS,3,0,Math.PI*2);bloomCtx.fill();
    }
  }
  bloomCtx.globalAlpha=1;
}

// ═══ MINIMAP ════════════════════════════════════════════════════════════════
function renderMinimap(){
  const mw=70,mh=55;
  if(!minimapBgCached)cacheMinimapBg();
  mctx.drawImage(minimapBgCv,0,0);
  
  const sx=mw/WORLD_COLS,sy=mh/WORLD_ROWS;
  for(const e of enemies){
    if(e.dead)continue;
    mctx.fillStyle=e.isBoss?KZ.crimson:KZ.bone+'66';
    mctx.fillRect(e.x*sx-1,e.y*sy-1,2,2);
  }
  for(const g of gems){mctx.fillStyle=g.color;mctx.fillRect(g.x*sx,g.y*sy,1,1);}
  mctx.fillStyle=KZ.gold;mctx.fillRect(player.x*sx-2,player.y*sy-2,4,4);
  const vw=(W/TILE_W)*sx*0.5,vh=(H/TILE_H)*sy*0.5;
  mctx.strokeStyle=KZ.gold+'55';mctx.lineWidth=1;
  mctx.strokeRect(cam.x*sx-vw/2,cam.y*sy-vh/2,vw,vh);
}

// ═══ LIGHT SHAFTS ═══════════════════════════════════════════════════════════
function drawLightShafts(ox,oy){
  ctx.save();
  for(const p of props){
    if(p.type!=='altar'&&p.type!=='obelisk')continue;
    const iso=worldToIso(p.c,p.r);
    const x=iso.sx+ox,y=iso.sy+oy;
    if(x<-100||x>W+100||y<-100||y>H+100)continue;
    const col=PROP_COLORS[p.type];
    const ph=col.h;
    const pulse=0.03+Math.sin(frameCount*0.02+p.c*0.5)*0.015;
    ctx.globalAlpha=pulse;ctx.fillStyle=col.glow;
    // Shaft: narrow at top, wider at bottom
    ctx.beginPath();
    ctx.moveTo(x-2,y-ph);ctx.lineTo(x+2,y-ph);
    ctx.lineTo(x+15,y+40);ctx.lineTo(x-15,y+40);
    ctx.closePath();ctx.fill();
  }
  ctx.restore();
}

// ═══ CHROMATIC ABERRATION (post-process) ═════════════════════════════════════
function applyChromaticAberration(intensity){
  const offset=Math.ceil(intensity);
  if(offset<1)return;
  try{
    tmpCtx.drawImage(canvas,0,0);
    ctx.globalCompositeOperation='screen';
    ctx.globalAlpha=0.15*Math.min(intensity/3,1);
    // Red shift left
    ctx.drawImage(tmpCv,-offset,0);
    // Blue shift right
    ctx.drawImage(tmpCv,offset,0);
    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=1;
  }catch(e){}
}

// ═══ REALITY FRACTURE (post-process) ════════════════════════════════════════
let fractureTimer=0;
function applyRealityFracture(){
  if(fractureTimer<=0)return;
  fractureTimer--;
  const blockW=W/4,blockH=H/4;
  try{
    tmpCtx.drawImage(canvas,0,0);
    for(let i=0;i<3;i++){
      const bx=Math.floor(Math.random()*4)*blockW;
      const by2=Math.floor(Math.random()*4)*blockH;
      const dx=(Math.random()-0.5)*8;
      const dy2=(Math.random()-0.5)*6;
      ctx.drawImage(tmpCv,bx,by2,blockW,blockH,bx+dx,by2+dy2,blockW,blockH);
    }
  }catch(e){}
}

// ═══ RENDER PIPELINE ════════════════════════════════════════════════════════
function render(){
  // 1. Motion blur persistence
  const mbAlpha=memeticExposure>75?0.06:memeticExposure>50?0.09:0.14;
  ctx.fillStyle=`rgba(10,6,8,${mbAlpha})`;
  ctx.fillRect(0,0,W,H);

  // 2. Apply screen shake + rotation
  ctx.save();
  ctx.translate(W/2,H/2);
  ctx.rotate(cam.shakeRot);
  ctx.translate(-W/2,-H/2);

  // Clear bloom canvas
  bloomCtx.clearRect(0,0,bloomCv.width,bloomCv.height);

  const{ox,oy}=getTileOrigin();

  // 3. Back fog layer (Disabled for pixelated theme & speed)
  if (false) {
    ctx.save();ctx.globalAlpha=0.35+memeticExposure*0.003;
    const fogScrollX1=(frameCount*0.15)%fogCv1.width;
    ctx.drawImage(fogCv1,fogScrollX1,0,fogCv1.width-fogScrollX1,fogCv1.height,0,0,W*(1-fogScrollX1/fogCv1.width),H);
    ctx.drawImage(fogCv1,0,0,fogScrollX1,fogCv1.height,W*(1-fogScrollX1/fogCv1.width),0,W*fogScrollX1/fogCv1.width,H);
    ctx.restore();
  }

  // Broadcast tint
  if(BCAST.active){
    ctx.fillStyle='rgba(197,160,63,0.03)';ctx.fillRect(0,0,W,H);
  }

  // 4. Visible tile range
  const pad=4;
  const cMin=Math.floor(cam.x-W/TILE_W-pad),cMax=Math.ceil(cam.x+W/TILE_W+pad);
  const rMin=Math.floor(cam.y-H/TILE_H-pad),rMax=Math.ceil(cam.y+H/TILE_H+pad);
  const c0=Math.max(0,cMin),c1=Math.min(WORLD_COLS-1,cMax);
  const r0=Math.max(0,rMin),r1=Math.min(WORLD_ROWS-1,rMax);

  for(let s=c0+r0;s<=c1+r1;s++){
    for(let c=c0;c<=c1;c++){
      const r=s-c;
      if(r<r0||r>r1||r<0||r>=WORLD_ROWS||c<0||c>=WORLD_COLS)continue;
      drawIsoTile(c,r,ox,oy);
    }
  }

  // 5. Puddle reflections
  drawPuddles(ox,oy);

  // 6. Light shafts from altars
  drawLightShafts(ox,oy);

  // 7. Props
  const sortedProps=[...props].sort((a,b)=>(a.c+a.r)-(b.c+b.r));
  for(const p of sortedProps){
    const iso=worldToIso(p.c,p.r);
    const x=iso.sx+ox,y=iso.sy+oy;
    if(x<-100||x>W+100||y<-100||y>H+140)continue;
    drawProp(p,ox,oy);
  }

  // 8. Gems (sigil shards)
  for(const g of gems){
    const sc=toScreen(g.x,g.y,g.z+0.12);
    if(sc.sx<-20||sc.sx>W+20||sc.sy<-20||sc.sy>H+20)continue;
    const pulse=0.8+Math.sin(frameCount*0.18+g.x*0.5)*0.22;
    const gs=11*pulse;
    ctx.save();ctx.translate(sc.sx,sc.sy);
    ctx.globalAlpha=0.25;ctx.fillStyle=g.color;
    ctx.beginPath();ctx.arc(0,0,gs,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;ctx.fillStyle=g.color;
    ctx.beginPath();ctx.moveTo(0,-gs*0.6);ctx.lineTo(gs*0.4,0);ctx.lineTo(0,gs*0.4);ctx.lineTo(-gs*0.4,0);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.6)';
    ctx.beginPath();ctx.arc(-gs*0.1,-gs*0.2,gs*0.12,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  // 9. Particles (text/eye/sigil fragments)
  for(const p of particles){
    const sc=toScreen(p.x,p.y,p.z);
    ctx.globalAlpha=p.life;ctx.fillStyle=p.color;
    if(p.isText&&p.text){
      ctx.font='6px Share Tech Mono';ctx.textAlign='center';
      ctx.fillText(p.text,sc.sx,sc.sy);
    }else{
      const ps=Math.round(p.size*TILE_W);
      ctx.fillRect(sc.sx-ps/2,sc.sy-ps/2,ps,ps);
    }
  }
  ctx.globalAlpha=1;

  // 10. Entities sorted by depth
  const renderList=[];
  for(const e of enemies)if(!e.dead||e.deathTimer>0)renderList.push({type:'enemy',d:e,depth:e.x+e.y});
  renderList.push({type:'player',depth:player.x+player.y});
  renderList.sort((a,b)=>a.depth-b.depth);
  for(const ent of renderList){
    if(ent.type==='player')drawIsoPlayer();
    else drawIsoEnemy(ent.d);
  }

  // 11. Projectiles
  drawBullets();

  // 12. Additive bloom pass (Disabled for performance & pixel art clarity)
  if (false) {
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha=0.45;
    ctx.imageSmoothingEnabled=true;
    ctx.drawImage(bloomCv,0,0,W,H);
    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=1;
    ctx.restore();
  }

  // 13. Front fog layer (Disabled for performance & pixel art clarity)
  if (false) {
    ctx.save();ctx.globalAlpha=0.2+memeticExposure*0.002;
    const fogScrollX2=(frameCount*0.08+200)%fogCv2.width;
    ctx.drawImage(fogCv2,fogScrollX2,0,fogCv2.width-fogScrollX2,fogCv2.height,0,0,W*(1-fogScrollX2/fogCv2.width),H);
    ctx.drawImage(fogCv2,0,0,fogScrollX2,fogCv2.height,W*(1-fogScrollX2/fogCv2.width),0,W*fogScrollX2/fogCv2.width,H);
    ctx.restore();
  }

  // Aim line
  const psc=toScreen(player.x,player.y,0);
  ctx.globalAlpha=0.06;ctx.strokeStyle=KZ.bone;ctx.lineWidth=1;ctx.setLineDash([3,10]);
  ctx.beginPath();ctx.moveTo(psc.sx,psc.sy-10);ctx.lineTo(mouse.sx,mouse.sy);ctx.stroke();
  ctx.setLineDash([]);ctx.globalAlpha=1;

  // 14. Rain
  drawRain();

  // 15. Vignette
  const vig=ctx.createRadialGradient(W/2,H/2,H*0.12,W/2,H/2,H*0.72);
  vig.addColorStop(0,'rgba(0,0,0,0)');
  vig.addColorStop(1,'rgba(0,0,0,0.8)');
  ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);

  // 16. Watching eyes (subliminal background)
  if (!isMobile) {
    drawWatchingEyes();
  }

  ctx.restore(); // undo shake/rotation

  // 17. Chromatic aberration (post-process)
  const caIntensity=memeticExposure>75?3+Math.sin(frameCount*0.1)*2:
                     memeticExposure>50?1.5:
                     orderValue<20?2:
                     player.hp<player.maxHp*0.3?1.5:0;
  if(caIntensity>0)applyChromaticAberration(caIntensity);

  // 18. Reality fracture
  if(orderValue<15&&Math.random()<0.01)fractureTimer=15;
  if(memeticExposure>85&&Math.random()<0.005)fractureTimer=10;
  applyRealityFracture();

  // 19. Glitch
  if(glitchTimer>0)updateGlitch();

  // 20. Minimap
  renderMinimap();
}

// ═══ GAME LOOP ══════════════════════════════════════════════════════════════
function loop(){update();render();requestAnimationFrame(loop);}

// ═══ SOUND SYSTEM (Web Audio API Synth) ══════════════════════════════════════
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let ambientOsc1, ambientOsc2, ambientGain;
let audioStarted = false;

function playSound(type) {
  try {
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    const now = audioCtx.currentTime;
    
    if (type === 'shoot') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(800, now);
      osc.frequency.exponentialRampToValueAtTime(150, now + 0.12);
      gain.gain.setValueAtTime(0.04, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
      osc.start(now);
      osc.stop(now + 0.12);
    } else if (type === 'kill') {
      const bufferSize = audioCtx.sampleRate * 0.15;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(400, now);
      filter.frequency.exponentialRampToValueAtTime(10, now + 0.15);
      
      noise.connect(filter);
      filter.connect(gain);
      
      gain.gain.setValueAtTime(0.06, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
      
      noise.start(now);
      noise.stop(now + 0.15);
    } else if (type === 'hit') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(120, now);
      osc.frequency.setValueAtTime(60, now + 0.1);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
      osc.start(now);
      osc.stop(now + 0.15);
    } else if (type === 'levelup') {
      const notes = [261.63, 329.63, 392.00, 523.25]; // C4, E4, G4, C5
      notes.forEach((freq, idx) => {
        const time = now + idx * 0.08;
        const individualOsc = audioCtx.createOscillator();
        const individualGain = audioCtx.createGain();
        individualOsc.type = 'sine';
        individualOsc.frequency.setValueAtTime(freq, time);
        individualOsc.connect(individualGain);
        individualGain.connect(audioCtx.destination);
        individualGain.gain.setValueAtTime(0.05, time);
        individualGain.gain.exponentialRampToValueAtTime(0.005, time + 0.2);
        individualOsc.start(time);
        individualOsc.stop(time + 0.25);
      });
    } else if (type === 'broadcast') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(100, now);
      osc.frequency.exponentialRampToValueAtTime(800, now + 0.4);
      gain.gain.setValueAtTime(0.04, now);
      gain.gain.linearRampToValueAtTime(0.06, now + 0.1);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
      
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'peaking';
      filter.frequency.setValueAtTime(200, now);
      filter.frequency.exponentialRampToValueAtTime(2000, now + 0.4);
      osc.disconnect(gain);
      osc.connect(filter);
      filter.connect(gain);
      
      osc.start(now);
      osc.stop(now + 0.4);
    } else if (type === 'select') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.setValueAtTime(880, now + 0.08);
      gain.gain.setValueAtTime(0.05, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
      osc.start(now);
      osc.stop(now + 0.15);
    }
  } catch (err) {}
}

function startAmbientDrone() {
  try {
    ambientOsc1 = audioCtx.createOscillator();
    ambientOsc2 = audioCtx.createOscillator();
    ambientGain = audioCtx.createGain();
    
    ambientOsc1.type = 'sawtooth';
    ambientOsc1.frequency.setValueAtTime(65.41, audioCtx.currentTime); // C2
    
    ambientOsc2.type = 'triangle';
    ambientOsc2.frequency.setValueAtTime(98.00, audioCtx.currentTime); // G2
    
    const lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(110, audioCtx.currentTime);
    
    ambientOsc1.connect(lp);
    ambientOsc2.connect(lp);
    lp.connect(ambientGain);
    ambientGain.connect(audioCtx.destination);
    
    ambientGain.gain.setValueAtTime(0.015, audioCtx.currentTime);
    
    ambientOsc1.start();
    ambientOsc2.start();
  } catch(e) {}
}

function ensureAudioStarted() {
  if (audioStarted) return;
  audioStarted = true;
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  startAmbientDrone();
}
document.addEventListener('click', ensureAudioStarted);
document.addEventListener('touchstart', ensureAudioStarted);

async function fetchOSMData(city) {
  const radius = 0.003;
  const minLat = city.lat - radius;
  const maxLat = city.lat + radius;
  const minLon = city.lon - radius * 1.35;
  const maxLon = city.lon + radius * 1.35;
  
  const query = `[out:json][timeout:5];
    (
      way[highway](${minLat},${minLon},${maxLat},${maxLon});
      way[building](${minLat},${minLon},${maxLat},${maxLon});
    );
    out geom;`;
  
  const url = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`;
  
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error("OSM Server Offline");
    const data = await res.json();
    parseOSMData(data, city);
    return true;
  } catch (e) {
    console.warn("OSM Fetch Failed, Generating Procedural Fallback City Map:", e);
    generateProceduralCity(city);
    throw e;
  }
}

function parseOSMData(data, city) {
  const radius = 0.003;
  const minLat = city.lat - radius;
  const maxLat = city.lat + radius;
  const minLon = city.lon - radius * 1.35;
  const maxLon = city.lon + radius * 1.35;
  
  props.length = 0;
  spawnProps(); // Keep special altars/obelisks
  
  const roadMatrix = Array(WORLD_ROWS).fill(0).map(() => Array(WORLD_COLS).fill(false));
  
  if (data && data.elements) {
    for (const el of data.elements) {
      if (el.type === 'way' && el.geometry) {
        const points = el.geometry.map(pt => {
          const py = (pt.lat - minLat) / (maxLat - minLat);
          const px = (pt.lon - minLon) / (maxLon - minLon);
          return { x: px * WORLD_COLS, y: py * WORLD_ROWS };
        });
        
        if (el.tags.highway) {
          for (let i = 0; i < points.length - 1; i++) {
            drawRoadSegment(points[i], points[i+1], roadMatrix);
          }
        } else if (el.tags.building) {
          let cx = 0, cy = 0;
          for (const pt of points) { cx += pt.x; cy += pt.y; }
          cx /= points.length; cy /= points.length;
          
          const col = Math.floor(cx);
          const row = Math.floor(cy);
          if (col >= 2 && col < WORLD_COLS - 2 && row >= 2 && row < WORLD_ROWS - 2) {
            if (Math.abs(col - player.x) > 3 || Math.abs(row - player.y) > 3) {
              const h = el.tags['building:levels'] ? el.tags['building:levels'] * 8 : 16 + Math.random() * 24;
              props.push({
                c: col, r: row,
                type: 'building',
                height: h,
                color: ['#0A0608', '#0C0A0D', '#120E15'][Math.floor(Math.random()*3)]
              });
            }
          }
        }
      }
    }
  }
  
  // Fill concrete and roads
  for (let r = 0; r < WORLD_ROWS; r++) {
    for (let c = 0; c < WORLD_COLS; c++) {
      if (roadMatrix[r][c]) {
        tileMap[r][c] = 4; // Road
      } else {
        tileMap[r][c] = (r+c)%2 === 0 ? 0 : 1;
      }
    }
  }
  // Clear any buildings right on top of player to prevent stuck bugs
  const safeProps = props.filter(p => {
    if (p.type === 'building' || p.type === 'wall' || p.type === 'pillar') {
      return Math.hypot(p.c - player.x, p.r - player.y) > 2.5;
    }
    return true;
  });
  props.length = 0;
  for (const p of safeProps) props.push(p);
  
  cacheMinimapBg();
}

function drawRoadSegment(p1, p2, roadMatrix) {
  const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
  const steps = Math.ceil(dist * 2);
  for (let i = 0; i <= steps; i++) {
    const t = steps === 0 ? 0 : i / steps;
    const c = Math.floor(p1.x + (p2.x - p1.x) * t);
    const r = Math.floor(p1.y + (p2.y - p1.y) * t);
    if (c >= 0 && c < WORLD_COLS && r >= 0 && r < WORLD_ROWS) {
      roadMatrix[r][c] = true;
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          const nr = r + dr, nc = c + dc;
          if (nr >= 0 && nr < WORLD_ROWS && nc >= 0 && nc < WORLD_COLS && Math.random() < 0.6) {
            roadMatrix[nr][nc] = true;
          }
        }
      }
    }
  }
}

function generateProceduralCity(city) {
  props.length = 0;
  spawnProps();
  
  const roadMatrix = Array(WORLD_ROWS).fill(0).map(() => Array(WORLD_COLS).fill(false));
  
  if (city.style === 'newyork' || city.style === 'kyoto') {
    const interval = city.style === 'newyork' ? 8 : 6;
    for (let r = 0; r < WORLD_ROWS; r++) {
      for (let c = 0; c < WORLD_COLS; c++) {
        if (r % interval === 0 || c % interval === 0) {
          roadMatrix[r][c] = true;
        }
      }
    }
  } else if (city.style === 'paris') {
    const cx = 26, cy = 26;
    for (let r = 0; r < WORLD_ROWS; r++) {
      for (let c = 0; c < WORLD_COLS; c++) {
        const dx = c - cx, dy = r - cy;
        const dist = Math.hypot(dx, dy);
        const angle = Math.atan2(dy, dx);
        if (Math.abs(dist - 11) < 1.5 || Math.abs(dist - 21) < 1.5) {
          roadMatrix[r][c] = true;
        }
        const spokeAngle = Math.round(angle / (Math.PI / 4)) * (Math.PI / 4);
        if (Math.abs(angle - spokeAngle) < 0.12) {
          roadMatrix[r][c] = true;
        }
      }
    }
  } else {
    for (let r = 0; r < WORLD_ROWS; r++) {
      for (let c = 0; c < WORLD_COLS; c++) {
        if (Math.abs(r - (26 + Math.sin(c * 0.15) * 8)) < 1.5 || Math.abs(c - (26 + Math.cos(r * 0.15) * 8)) < 1.5) {
          roadMatrix[r][c] = true;
        }
      }
    }
    for (let i = 0; i < 6; i++) {
      let rx = Math.floor(Math.random() * WORLD_COLS), ry = Math.floor(Math.random() * WORLD_ROWS);
      for (let step = 0; step < 25; step++) {
        if (rx >= 0 && rx < WORLD_COLS && ry >= 0 && ry < WORLD_ROWS) {
          roadMatrix[ry][rx] = true;
          rx += Math.random() < 0.5 ? (Math.random() < 0.5 ? -1 : 1) : 0;
          ry += Math.random() < 0.5 ? (Math.random() < 0.5 ? -1 : 1) : 0;
        }
      }
    }
  }
  
  for (let r = 2; r < WORLD_ROWS - 2; r++) {
    for (let c = 2; c < WORLD_COLS - 2; c++) {
      if (roadMatrix[r][c]) {
        tileMap[r][c] = 4;
      } else {
        tileMap[r][c] = (r+c)%2 === 0 ? 0 : 1;
        if (Math.abs(c - player.x) > 3 || Math.abs(r - player.y) > 3) {
          if (Math.random() < 0.12) {
            let hasB = false;
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                if (props.some(p => p.type === 'building' && p.c === c+dc && p.r === r+dr)) hasB = true;
              }
            }
            if (!hasB) {
              const h = city.style === 'newyork' ? 38 + Math.random() * 24 : 14 + Math.random() * 14;
              props.push({
                c, r,
                type: 'building',
                height: h,
                color: ['#0A0608', '#0C0A0D', '#120E15'][Math.floor(Math.random()*3)]
              });
            }
          }
        }
      }
    }
  }
  // Clear any buildings right on top of player to prevent stuck bugs
  const safeProps = props.filter(p => {
    if (p.type === 'building' || p.type === 'wall' || p.type === 'pillar') {
      return Math.hypot(p.c - player.x, p.r - player.y) > 2.5;
    }
    return true;
  });
  props.length = 0;
  for (const p of safeProps) props.push(p);

  cacheMinimapBg();
}

function loadCityMap(city) {
  fetchOSMData(city).then(() => {
    showSysNotif("CITY DEPLOYED: " + city.name.split(" ")[0]);
  }).catch(() => {
    showSysNotif("SIMULATION: " + city.name.split(" ")[0]);
  });
}
loadCityMap(currentCity);
loop(); // Start game loop after all initializations are complete
