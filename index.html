<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>KURAZIAN ORDER</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0608">
<link rel="apple-touch-icon" sizes="120x120" href="icons/icon-120.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="icon" sizes="192x192" href="icons/icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Share+Tech+Mono&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}

html,body{
  width:100%;height:100%;
  overflow:hidden;user-select:none;
  background:#0A0608;
  font-family:'Share Tech Mono',monospace;
  -webkit-tap-highlight-color:transparent;
  touch-action:none;
}

/* ── GAME WRAPPER ─────────────────────────────────── */
#game-wrapper{
  position:fixed;
  top:0;left:0;
  width:100vw;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  background:#0A0608;
}

#canvas{
  display:block;
  position:absolute;
  top:0;left:0;
  width:100%;
  height:100%;
  image-rendering:-moz-crisp-edges;
  image-rendering:-webkit-crisp-edges;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
}

#grain-overlay{
  position:absolute;inset:0;pointer-events:none;z-index:3;opacity:0.04;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='256' height='256' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  background-size:128px;mix-blend-mode:overlay;
}

/* ── HUD ─────────────────────────────────────────── */
#hud{
  position:absolute;
  top:0;left:0;right:0;
  z-index:10;
  pointer-events:none;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:start;
  padding-top:max(env(safe-area-inset-top,0px),8px);
}

#hud-left{
  background:rgba(10,6,8,0.85);
  border-right:2px solid #C5A03F;
  border-bottom:1px solid rgba(197,160,63,0.2);
  padding:6px 8px;
}
#hud-center{
  background:rgba(10,6,8,0.85);
  border-bottom:2px solid #C5A03F;
  border-left:1px solid rgba(197,160,63,0.12);
  border-right:1px solid rgba(197,160,63,0.12);
  padding:5px 8px;
  text-align:center;
  min-width:90px;
}
#hud-right{
  background:rgba(10,6,8,0.85);
  border-left:2px solid #C5A03F;
  border-bottom:1px solid rgba(197,160,63,0.2);
  padding:6px 8px;
}

.bar-row{display:flex;align-items:center;gap:5px;margin-bottom:3px;}
.bar-icon{font-size:10px;width:12px;text-align:center;flex-shrink:0;}
.bar-track{flex:1;height:5px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.05);overflow:hidden;}
.bar-fill{height:100%;transition:width .18s;}
#reality-bar{background:linear-gradient(90deg,#ff5b5b,#e60000);}
#order-bar{background:linear-gradient(90deg,#ffdf80,#C5A03F);}
#xp-bar{background:linear-gradient(90deg,#d5c8b0,#9c8a6c);}
#meme-bar{background:linear-gradient(90deg,#8dfcff,#00E5CC);}
.bar-val{font-size:8px;min-width:24px;text-align:right;color:#E8DCC8;flex-shrink:0;}
.stat-line{font-size:7px;color:#E8DCC844;letter-spacing:1px;margin-top:3px;}
.stat-val{color:#8B0000;}

#timer-display{font-size:14px;color:#C5A03F;font-family:'Cinzel',serif;font-weight:700;letter-spacing:2px;line-height:1;}
#signal-display{font-size:6px;color:#8B0000;letter-spacing:1px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.weapon-slot{display:flex;align-items:center;gap:4px;margin-bottom:3px;font-size:7px;}
.wname{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#E8DCC8;}
.wcd-track{width:28px;height:2px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);flex-shrink:0;}
.wcd-fill{height:100%;transition:width .08s;}
.wlvl{font-size:7px;color:#C5A03F;min-width:12px;flex-shrink:0;}

/* ── COMBO / STREAK ─────────────────────────────── */
#combo-display{
  position:absolute;
  bottom:calc(env(safe-area-inset-bottom,0px) + 100px);
  left:50%;transform:translateX(-50%);
  text-align:center;pointer-events:none;z-index:20;opacity:0;transition:opacity .2s;
}
#combo-display.show{opacity:1;}
#combo-num{font-size:20px;color:#C5A03F;line-height:1;font-family:'Cinzel',serif;font-weight:700;}
#combo-label{font-size:7px;color:#E8DCC844;letter-spacing:2px;margin-top:2px;}

#streak-banner{
  position:absolute;
  top:calc(max(env(safe-area-inset-top,0px),8px) + 56px);
  left:50%;transform:translateX(-50%);
  background:rgba(10,6,8,0.92);border:1px solid #C5A03F;
  padding:3px 10px;font-size:9px;color:#C5A03F;
  opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;
  white-space:nowrap;letter-spacing:2px;font-family:'Cinzel',serif;
}
#streak-banner.show{opacity:1;}

/* ── BROADCAST ─────────────────────────────────── */
#broadcast-overlay{
  position:absolute;inset:0;pointer-events:none;z-index:6;
  border:1px solid rgba(197,160,63,0.12);
  opacity:0;transition:opacity .15s;
}
#broadcast-overlay.active{opacity:1;}

#broadcast-bar-wrap{
  position:absolute;
  bottom:calc(env(safe-area-inset-bottom,0px) + 90px);
  left:50%;transform:translateX(-50%);
  pointer-events:none;z-index:15;text-align:center;
}
#broadcast-label{font-size:7px;color:#C5A03F;letter-spacing:2px;margin-bottom:2px;}
#broadcast-track{width:80px;height:3px;background:rgba(255,255,255,0.05);border:1px solid rgba(197,160,63,0.3);margin:0 auto;}
#broadcast-fill{height:100%;background:linear-gradient(90deg,#C5A03F,#E8DCC8);width:0%;transition:width .05s;}

/* ── BRAINROT / NOTIFS ─────────────────────────── */
#brainrot-msg{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:13px;color:#8B0000;letter-spacing:4px;
  opacity:0;transition:opacity .15s;pointer-events:none;z-index:22;
  text-align:center;padding:0 16px;
  font-family:'Cinzel',serif;font-weight:700;
  text-shadow:0 0 10px rgba(139,0,0,0.4);
}
#brainrot-msg.show{opacity:1;}

#sys-notif{
  position:absolute;
  top:calc(max(env(safe-area-inset-top,0px),8px) + 56px);
  left:50%;transform:translateX(-50%);
  background:rgba(10,6,8,0.92);border:1px solid #C5A03F;
  padding:3px 10px;font-size:7px;color:#C5A03F;letter-spacing:2px;
  opacity:0;transition:opacity .2s;pointer-events:none;z-index:25;
  white-space:nowrap;font-family:'Cinzel',serif;
}
#sys-notif.show{opacity:1;}

#screen-flash{position:absolute;inset:0;pointer-events:none;z-index:5;opacity:0;transition:opacity .05s;}
#dmg-vignette{
  position:absolute;inset:0;pointer-events:none;z-index:4;
  box-shadow:inset 0 0 80px rgba(139,0,0,0);transition:box-shadow .15s;
}
#dmg-vignette.hit{box-shadow:inset 0 0 80px rgba(139,0,0,0.5);}

/* ── MINIMAP ─────────────────────────────────────── */
#minimap-wrap{
  position:absolute;
  bottom:calc(env(safe-area-inset-bottom,0px) + 90px);
  left:8px;
  border:1px solid rgba(197,160,63,0.25);
  background:#0A0608;
  z-index:10;
}
#minimap-canvas{display:block;}

/* ── REVELATION ─────────────────────────────────── */
#revelation-screen{
  position:absolute;inset:0;
  background:rgba(10,6,8,0.97);
  z-index:50;display:none;
  flex-direction:column;align-items:center;
  justify-content:flex-start;
  padding-top:max(env(safe-area-inset-top,0px),24px);
  padding-bottom:max(env(safe-area-inset-bottom,0px),16px);
  padding-left:12px;padding-right:12px;
  gap:10px;
  overflow-y:auto;
}
#revelation-screen.show{display:flex;}
#revelation-title{
  font-size:16px;color:#C5A03F;font-family:'Cinzel',serif;font-weight:700;
  letter-spacing:6px;margin-top:8px;text-align:center;
  animation:revealIn .6s cubic-bezier(.175,.885,.32,1.15);
}
#revelation-msg{
  font-size:8px;color:#8B0000;letter-spacing:3px;
  font-family:'Share Tech Mono',monospace;
  text-align:center;
}
@keyframes revealIn{from{transform:scale(0.9);opacity:0;}to{transform:scale(1);opacity:1;}}

.upgrade-cards{
  display:flex;flex-direction:column;
  gap:8px;width:100%;max-width:360px;align-items:center;
}
.upgrade-card{
  width:100%;
  background:rgba(16,10,12,0.95);
  border-top:1px solid rgba(197,160,63,0.12);
  border-left:3px solid #C5A03F;
  border-right:1px solid rgba(197,160,63,0.12);
  border-bottom:1px solid rgba(197,160,63,0.12);
  padding:10px 12px;
  cursor:pointer;
  display:flex;align-items:center;gap:12px;
  position:relative;overflow:hidden;
  transition:background .1s;
  -webkit-tap-highlight-color:transparent;
}
.upgrade-card:active{background:rgba(197,160,63,0.06);}
.ucard-icon{width:36px;height:36px;flex-shrink:0;border:1px solid rgba(197,160,63,0.2);}
.ucard-text{flex:1;text-align:left;}
.ucard-choice{font-size:7px;color:#C5A03F;letter-spacing:3px;font-family:'Cinzel',serif;font-weight:bold;margin-bottom:3px;}
.ucard-name{font-size:11px;color:#E8DCC8;font-family:'Cinzel',serif;font-weight:700;letter-spacing:0.5px;line-height:1.3;margin-bottom:4px;}
.ucard-desc{font-size:8px;color:#6b5d56;line-height:1.4;}
.ucard-rarity{font-size:7px;margin-top:4px;letter-spacing:2px;font-weight:bold;}
.r-common{color:#6c757d;}.r-rare{color:#C5A03F;}.r-epic{color:#8B0000;}

/* ── END SCREEN ─────────────────────────────────── */
#end-screen{
  position:absolute;inset:0;background:rgba(10,6,8,0.98);
  z-index:60;display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:20px;
}
#end-screen.show{display:flex;}
#end-title{font-size:16px;font-family:'Cinzel',serif;font-weight:700;letter-spacing:4px;text-align:center;line-height:1.4;}
#end-stats{font-size:9px;color:#E8DCC855;text-align:center;line-height:2;letter-spacing:1px;}
#restart-btn{
  font-family:'Cinzel',serif;font-size:9px;font-weight:700;
  background:transparent;color:#C5A03F;
  border:1px solid #C5A03F;padding:12px 24px;cursor:pointer;margin-top:8px;
  letter-spacing:3px;-webkit-tap-highlight-color:transparent;
}
#restart-btn:active{background:rgba(197,160,63,0.06);}

/* ── MOBILE BROADCAST BUTTON ────────────────────── */
#mobile-broadcast-btn{
  display:flex;
  position:absolute;
  bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  right:16px;
  width:60px;height:60px;
  background:rgba(10,6,8,0.88);
  border:1px solid #C5A03F;
  color:#C5A03F;
  font-family:'Cinzel',serif;font-size:7px;font-weight:bold;letter-spacing:1px;
  z-index:100;
  align-items:center;justify-content:center;
  pointer-events:auto;cursor:pointer;user-select:none;
  text-align:center;line-height:1.3;
}
#mobile-broadcast-btn:active{background:rgba(197,160,63,0.1);}

/* ── FLOAT TEXT ─────────────────────────────────── */
.float-text{
  position:absolute;font-family:'Share Tech Mono',monospace;
  font-size:9px;pointer-events:none;
  animation:floatUp .9s ease-out forwards;z-index:100;
  text-shadow:1px 1px 0 #0A0608,-1px -1px 0 #0A0608,1px -1px 0 #0A0608,-1px 1px 0 #0A0608;
}
.float-big{font-size:13px!important;font-weight:bold;}
@keyframes floatUp{
  0%{opacity:0;transform:translateY(0) scale(.85);}
  20%{opacity:1;transform:translateY(-6px) scale(1.1);}
  100%{opacity:0;transform:translateY(-44px) scale(.95);}
}

/* ── CURSOR ─────────────────────────────────────── */
#cursor{position:absolute;width:24px;height:24px;pointer-events:none;z-index:200;transform:translate(-50%,-50%);}

/* ── DESKTOP ─────────────────────────────────────── */
@media (hover:hover) and (pointer:fine){
  #mobile-broadcast-btn{display:none!important;}
  #minimap-wrap{bottom:10px;left:auto;right:10px;}
  #broadcast-bar-wrap{bottom:50px;}
  #combo-display{bottom:60px;}
}
</style>
</head>
<body>
<div id="game-wrapper">
  <canvas id="canvas" width="390" height="844"></canvas>
  <div id="grain-overlay"></div>
  <div id="screen-flash"></div>
  <div id="dmg-vignette"></div>
  <div id="broadcast-overlay"></div>

  <svg id="cursor" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="11" cy="11" rx="8" ry="5" stroke="#E8DCC8" stroke-width="0.8" fill="none"/>
    <circle cx="11" cy="11" r="2.5" fill="#C5A03F"/>
    <circle cx="11" cy="11" r="1" fill="#E8DCC8"/>
    <line x1="0" y1="11" x2="3" y2="11" stroke="#E8DCC844" stroke-width="0.5"/>
    <line x1="19" y1="11" x2="22" y2="11" stroke="#E8DCC844" stroke-width="0.5"/>
  </svg>

  <div id="hud">
    <div id="hud-left">
      <div class="bar-row">
        <div class="bar-icon" style="color:#8B0000">✙</div>
        <div class="bar-track"><div class="bar-fill" id="reality-bar" style="width:100%"></div></div>
        <span class="bar-val" id="reality-val" style="color:#8B0000">100%</span>
      </div>
      <div class="bar-row">
        <div class="bar-icon" style="color:#E8DCC8">☉</div>
        <div class="bar-track"><div class="bar-fill" id="xp-bar" style="width:0%"></div></div>
        <span class="bar-val" id="rev-val" style="color:#E8DCC8">I</span>
      </div>
      <div class="bar-row">
        <div class="bar-icon" style="color:#C5A03F">⚖</div>
        <div class="bar-track"><div class="bar-fill" id="order-bar" style="width:50%"></div></div>
        <span class="bar-val" id="order-val" style="color:#C5A03F">50</span>
      </div>
      <div class="bar-row" style="margin-bottom:0">
        <div class="bar-icon" style="color:#00E5CC">🜎</div>
        <div class="bar-track"><div class="bar-fill" id="meme-bar" style="width:0%"></div></div>
        <span class="bar-val" id="meme-val" style="color:#00E5CC">0%</span>
      </div>
      <div class="stat-line">ERASED <span class="stat-val" id="kill-label">0</span> CHAIN <span class="stat-val" id="streak-val">0</span></div>
    </div>

    <div id="hud-center">
      <div id="timer-display">30:00</div>
      <div id="signal-display">SIGNAL 1</div>
    </div>

    <div id="hud-right">
      <div style="font-size:6px;color:#E8DCC833;margin-bottom:3px;letter-spacing:.5px;">CORRUPTIONS</div>
      <div id="weapon-slots"></div>
    </div>
  </div>

  <div id="combo-display">
    <div id="combo-num">x1</div>
    <div id="combo-label">ERASURE CHAIN</div>
  </div>

  <div id="broadcast-bar-wrap">
    <div id="broadcast-label">BROADCAST</div>
    <div id="broadcast-track"><div id="broadcast-fill"></div></div>
  </div>

  <div id="streak-banner">CHAIN x<span id="streak-num">3</span></div>
  <div id="brainrot-msg"></div>
  <div id="sys-notif">REVELATION APPROACHING</div>
  <div id="minimap-wrap"><canvas id="minimap-canvas" width="70" height="55"></canvas></div>

  <div id="revelation-screen">
    <div id="revelation-title">REVELATION</div>
    <div id="revelation-msg">THE EYES INSIDE THE SUN</div>
    <div class="upgrade-cards" id="upgrade-cards"></div>
  </div>

  <div id="end-screen">
    <div id="end-title"></div>
    <div id="end-stats"></div>
    <button id="restart-btn" onclick="restartGame()">RE-ENTER THE ORDER</button>
  </div>
  <div id="mobile-broadcast-btn">BROADCAST</div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════════
// KURAZIAN ORDER — Brain Rot x Cosmic Horror x Survivors
// ═══════════════════════════════════════════════════════════════════════════════

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const mmCv = document.getElementById('minimap-canvas');
const mctx = mmCv.getContext('2d');
const minimapBgCv = document.createElement('canvas');
minimapBgCv.width = 70; minimapBgCv.height = 55;
const mBgCtx = minimapBgCv.getContext('2d');
let minimapBgCached = false;
let W = 390, H = 844;
let isMobile = true; // always mobile-first

const TILE_W = 40, TILE_H = 20, TILE_D = 14;
const WORLD_COLS = 52, WORLD_ROWS = 52;

// Early declaration to fix initialization order bugs
const wrapper = document.getElementById('game-wrapper');
const cursorEl = document.getElementById('cursor');
const mouse = {sx: W/2, sy: H/2, wx: WORLD_COLS/2, wy: WORLD_ROWS/2};

// ═══ KURAZIAN PALETTE ═══════════════════════════════════════════════════════
const KZ = {
  bone:    '#E8DCC8',
  crimson: '#8B0000',
  gold:    '#C5A03F',
  void:    '#0A0608',
  signal:  '#00E5CC',
  dark:    '#1a0a10',
  rot:     '#6B3A6B',
};

// ═══ OFFSCREEN CANVASES ═════════════════════════════════════════════════════
const bloomCv = document.createElement('canvas');
bloomCv.width = Math.floor(W/4); bloomCv.height = Math.floor(H/4);
const bloomCtx = bloomCv.getContext('2d');

const fogCv1 = document.createElement('canvas');
fogCv1.width = 512; fogCv1.height = 256;
const fogCtx1 = fogCv1.getContext('2d');
const fogCv2 = document.createElement('canvas');
fogCv2.width = 512; fogCv2.height = 256;
const fogCtx2 = fogCv2.getContext('2d');

const tmpCv = document.createElement('canvas');
const tmpCtx = tmpCv.getContext('2d');

// ═══ SCREEN RESIZE & MOBILE DETECT ══════════════════════════════════════════
function resizeCanvas() {
  const vw = window.innerWidth;
  const vh = window.innerHeight || document.documentElement.clientHeight;
  isMobile = (vw < vh) || ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

  // Logical canvas resolution — portrait-optimised
  if (isMobile) {
    W = Math.min(vw, 420);
    H = vh;
  } else {
    // Landscape desktop: fixed logical resolution, rendered at 2× via CSS
    W = 420;
    H = Math.round(vw / 2 * (vh / vw) * 2);
    H = Math.max(H, 600);
  }

  canvas.width = W;
  canvas.height = H;

  bloomCv.width = Math.max(1, Math.floor(W/4));
  bloomCv.height = Math.max(1, Math.floor(H/4));
  tmpCv.width = W;
  tmpCv.height = H;

  if (isMobile) {
    cursorEl.style.display = 'none';
    document.body.classList.add('mobile-mode');
  } else {
    cursorEl.style.display = 'block';
    document.body.classList.remove('mobile-mode');
  }
}
window.addEventListener('resize', () => { resizeCanvas(); minimapBgCached = false; cacheMinimapBg(); });
resizeCanvas();

// ═══ NOISE & FOG GENERATION ═════════════════════════════════════════════════
function hashNoise(x,y){const n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n);}
function smoothNoise(x,y){
  const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;
  const sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);
  return hashNoise(ix,iy)*(1-sx)*(1-sy)+hashNoise(ix+1,iy)*sx*(1-sy)+hashNoise(ix,iy+1)*(1-sx)*sy+hashNoise(ix+1,iy+1)*sx*sy;
}
function fbmNoise(x,y,oct){let v=0,a=0.5,f=1;for(let i=0;i<oct;i++){v+=a*smoothNoise(x*f,y*f);a*=0.5;f*=2;}return v;}

function generateFog(cvs,cCtx,seed,r,g,b){
  const w=cvs.width,h=cvs.height;
  const img=cCtx.createImageData(w,h);
  const d=img.data;
  for(let y=0;y<h;y++){for(let x=0;x<w;x++){
    const i=(y*w+x)*4;
    const n=fbmNoise(x*0.012+seed,y*0.012+seed*0.7,4);
    const a=Math.max(0,(n-0.28))*55;
    d[i]=r;d[i+1]=g;d[i+2]=b;d[i+3]=a;
  }}
  cCtx.putImageData(img,0,0);
}
generateFog(fogCv1,fogCtx1,0,25,5,14);
generateFog(fogCv2,fogCtx2,100,12,8,20);

function worldToIso(wx,wy){return{sx:(wx-wy)*(TILE_W/2),sy:(wx+wy)*(TILE_H/2)};}
const cam={x:WORLD_COLS/2,y:WORLD_ROWS/2,shakeX:0,shakeY:0,shakeMag:0,shakeRot:0,shakeDecay:0.82};

function toScreen(wx,wy,wz){
  const ci=worldToIso(cam.x,cam.y),pi=worldToIso(wx,wy);
  return{sx:pi.sx-ci.sx+W/2+cam.shakeX,sy:pi.sy-ci.sy+H/2+cam.shakeY-(wz||0)*TILE_D};
}
function getTileOrigin(){
  const ci=worldToIso(cam.x,cam.y);
  return{ox:W/2-ci.sx+cam.shakeX,oy:H/2-ci.sy+cam.shakeY};
}

function shadeHex(hex,amt){
  if(!hex||hex[0]!=='#')return'#111';
  let r=parseInt(hex.slice(1,3),16)+amt,g=parseInt(hex.slice(3,5),16)+amt,b=parseInt(hex.slice(5,7),16)+amt;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return'#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function seedR(a,b){return(((a*1664525+b*214013+2531011)^(a*214013+b*1664525))>>>0)%100;}

const tileMap=[];
function buildMap(){
  for(let r=0;r<WORLD_ROWS;r++){
    tileMap[r]=[];
    for(let c=0;c<WORLD_COLS;c++){
      const n=seedR(r*3+1,c*7+2);
      let t=0;
      const cx=Math.abs(c-WORLD_COLS/2),ry=Math.abs(r-WORLD_ROWS/2);
      if(cx>WORLD_COLS/2-7||ry>WORLD_ROWS/2-7)t=3;
      else if(cx<5&&ry<5)t=5;
      else if((c+r)%18<2)t=6;
      else if(c>12&&c<22&&r>12&&r<22)t=4;
      else if(c>30&&c<40&&r>30&&r<40)t=4;
      else if(c>36&&r<16)t=1;
      else if(c<16&&r>36)t=1;
      else if((c*7+r*3)%25===0)t=2;
      else if(n<8)t=seedR(r,c)%2===0?1:3;
      else t=0;
      tileMap[r][c]=t;
    }
  }
}
function cacheMinimapBg(){
  const mw=70,mh=55;
  mBgCtx.fillStyle='#0A0608';mBgCtx.fillRect(0,0,mw,mh);
  const sx=mw/WORLD_COLS,sy=mh/WORLD_ROWS;
  for(let r=0;r<WORLD_ROWS;r+=2){
    for(let c=0;c<WORLD_COLS;c+=2){
      const t=tileMap[r]?.[c]??0;
      const colors=['#0A0A0D','#0D0A0E','#12040A','#0E0C08','#08060E','#0C0408','#0F0D04'];
      mBgCtx.fillStyle=colors[t]||'#0A0A0D';
      mBgCtx.fillRect(c*sx,r*sy,sx*2,sy*2);
    }
  }
  minimapBgCached = true;
}

function drawRain(){
  ctx.save();
  const boneDrops=[];
  const darkDrops=[];
  const activeRain = rainDrops;
  for(const r of activeRain){
    r.y+=r.spd;r.x-=r.spd*0.15;
    if(r.y>H){r.y=-10;r.x=Math.random()*W;}
    if(r.x<-20)r.x=W+20;
    if(r.bone)boneDrops.push(r);
    else darkDrops.push(r);
  }
  
  // Batch dark rain
  ctx.strokeStyle='#1a1520';
  ctx.lineWidth=0.5;
  ctx.globalAlpha=0.1;
  ctx.beginPath();
  for(const r of darkDrops){
    ctx.moveTo(r.x,r.y);
    ctx.lineTo(r.x-r.len*0.15,r.y+r.len);
  }
  ctx.stroke();

  // Batch bone rain
  ctx.strokeStyle=KZ.bone;
  ctx.lineWidth=0.8;
  ctx.globalAlpha=0.25;
  ctx.beginPath();
  for(const r of boneDrops){
    ctx.moveTo(r.x,r.y);
    ctx.lineTo(r.x-r.len*0.15,r.y+r.len);
  }
  ctx.stroke();

  ctx.restore();
}

const puddles=[];
for(let i=0;i<24;i++){

  });

function drawPuddles(ox,oy){
  ctx.save();
  for(const p of puddles){
    const iso=worldToIso(p.wx,p.wy);
    const sx=iso.sx+ox,sy=iso.sy+oy;
    if(sx<-60||sx>W+60||sy<-30||sy>H+30)continue;
    const pulse=0.03+Math.sin(frameCount*0.025+p.phase)*0.015;
    
    // Draw base puddle
    ctx.globalAlpha=pulse*1.5;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.ellipse(sx,sy+TILE_D*0.5,p.w*TILE_W*0.5,p.h*TILE_H*0.5,0,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=pulse*0.5;ctx.fillStyle=p.color;
    ctx.font='3px Share Tech Mono';ctx.textAlign='center';
    ctx.fillText(RITUAL_TEXTS[p.textIdx],sx,sy+TILE_D*0.5+3);
    
    // Puddle reflection (clipping mask)
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(sx,sy+TILE_D*0.5,p.w*TILE_W*0.5,p.h*TILE_H*0.5,0,0,Math.PI*2);
    ctx.clip();
    
    // Reflect player
    const pDist = Math.hypot(player.x - p.wx, player.y - p.wy);
    if(pDist < 4.0){
      const psc = toScreen(player.x, player.y, 0);
      ctx.save();
      // Mirror across puddle surface Y line
      ctx.translate(psc.sx, (sy + TILE_D*0.5)*2 - psc.sy);
      ctx.scale(1, -0.5); // Flipped and squished
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = p.color;
      // Simplified robe silhouette
      ctx.beginPath();
      ctx.moveTo(-6, 0);
      ctx.bezierCurveTo(-10, -14, -8, -26, 0, -32);
      ctx.bezierCurveTo(8, -26, 10, -14, 6, 0);
      ctx.closePath();
      ctx.fill();
      // Glowing eye reflection
      ctx.fillStyle = KZ.gold;
      ctx.beginPath();ctx.arc(0, -26, 2, 0, Math.PI*2);ctx.fill();
      ctx.restore();
    }
    
    // Skip enemy and prop reflections on mobile to optimize performance
    if (!isMobile) {
      // Reflect nearby enemies
      for(const e of enemies){
        if(e.dead)continue;
        const eDist = Math.hypot(e.x - p.wx, e.y - p.wy);
        if(eDist < 4.0){
          const esc = toScreen(e.x, e.y, e.z);
          ctx.save();
          ctx.translate(esc.sx, (sy + TILE_D*0.5)*2 - esc.sy);
          ctx.scale(1, -0.5);
          ctx.globalAlpha = 0.4;
          ctx.fillStyle = p.color;
          
          // Simplified enemy shape reflection
          const s = e.size * TILE_W;
          ctx.beginPath();
          ctx.ellipse(0, -s*0.5, s*0.4, s*0.5, 0, 0, Math.PI*2);
          ctx.fill();
          ctx.restore();
        }
      }
      
      // Reflect nearby props
      for(const pr of props){
        const prDist = Math.hypot(pr.c - p.wx, pr.r - p.wy);
        if(prDist < 4.0){
          const priso = worldToIso(pr.c, pr.r);
          const prsc = {sx: priso.sx+ox, sy: priso.sy+oy};
          const col = PROP_COLORS[pr.type]||PROP_COLORS.altar;
          ctx.save();
          ctx.translate(prsc.sx, (sy + TILE_D*0.5)*2 - prsc.sy);
          ctx.scale(1, -0.5);
          ctx.globalAlpha = 0.35;
          ctx.fillStyle = p.color;
          // Simple column reflection
          ctx.fillRect(-TILE_W*0.3, -col.h, TILE_W*0.6, col.h);
          ctx.restore();
        }
      }
    }
    ctx.restore(); // restores from clip()
  }
  ctx.restore();
}

// ═══ TILE DRAWING (with impossible geometry) ═════════════════════════════════
function drawIsoTile(c,r,ox,oy){
  const geoOffset=orderValue<15?Math.sin(frameCount*0.03+c*0.5)*2*((15-orderValue)/15):0;
  const iso=worldToIso(c,r);
  const x=iso.sx+ox+geoOffset,y=iso.sy+oy;
  if(x<-TILE_W*1.5||x>W+TILE_W||y<-TILE_H*2||y>H+TILE_D+TILE_H*2)return;
  const t=tileMap[r]?.[c]??0;
  const pal=TILE_PALETTES[t];
  const n=seedR(r*5+3,c*11+7)%pal.top.length;
  const isAccent=pal.accent&&(r+c)%2===0;
  const topColor=isAccent?(pal.accentColor||pal.top[0]):pal.top[n];
  const hw=TILE_W/2,hh=TILE_H/2;

  ctx.beginPath();
  ctx.moveTo(x,y-hh);ctx.lineTo(x+hw,y);ctx.lineTo(x,y+hh);ctx.lineTo(x-hw,y);
  ctx.closePath();ctx.fillStyle=topColor;ctx.fill();

  if(!isAccent&&(c+r)%6===0){
    ctx.strokeStyle=pal.line+'0C';ctx.lineWidth=0.3;
    ctx.beginPath();ctx.moveTo(x-hw,y);ctx.lineTo(x+hw,y);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x,y-hh);ctx.lineTo(x,y+hh);ctx.stroke();
  }
  // Ritual sigil lines (bone-colored, very faint)
  if((c*3+r*7)%47===0){
    ctx.strokeStyle=KZ.bone+'08';ctx.lineWidth=0.5;
    ctx.beginPath();ctx.arc(x,y,hw*0.6,0,Math.PI*2);ctx.stroke();
  }

  ctx.beginPath();
  ctx.moveTo(x-hw,y);ctx.lineTo(x,y+hh);ctx.lineTo(x,y+hh+TILE_D);ctx.lineTo(x-hw,y+TILE_D);
  ctx.closePath();ctx.fillStyle=shadeHex(pal.side,-4);ctx.fill();

  ctx.beginPath();
  ctx.moveTo(x+hw,y);ctx.lineTo(x,y+hh);ctx.lineTo(x,y+hh+TILE_D);ctx.lineTo(x+hw,y+TILE_D);
  ctx.closePath();ctx.fillStyle=shadeHex(pal.side,-18);ctx.fill();

  if((c+r)%10===0){
    ctx.strokeStyle=pal.line+'0A';ctx.lineWidth=0.4;
    ctx.beginPath();ctx.moveTo(x-hw,y);ctx.lineTo(x,y+hh);ctx.stroke();
  }
}

function drawProp(p,ox,oy){
  if (p.dead) return;
  const iso=worldToIso(p.c,p.r);
  const x=iso.sx+ox,y=iso.sy+oy;
  const hw=TILE_W/2,hh=TILE_H/2;

  // Render Rune Gimmick (Flat floor sigil)
  if (p.type === 'rune') {
    ctx.save();
    ctx.globalAlpha = p.activated ? 0.2 : 0.45 + Math.sin(frameCount * 0.12) * 0.15;
    ctx.strokeStyle = p.activated ? KZ.bone : KZ.gold;
    ctx.lineWidth = 1;
    // Circular bounds
    ctx.beginPath();
    ctx.ellipse(x, y + hh * 0.5, hw * 0.8, hh * 0.8, 0, 0, Math.PI * 2);
    ctx.stroke();
    // Occult Star
    ctx.beginPath();
    ctx.moveTo(x, y); ctx.lineTo(x, y + hh);
    ctx.moveTo(x - hw * 0.5, y + hh * 0.5); ctx.lineTo(x + hw * 0.5, y + hh * 0.5);
    ctx.stroke();
    // Inner crystal
    ctx.fillStyle = p.activated ? KZ.bone : KZ.gold;
    ctx.beginPath();
    ctx.arc(x, y + hh * 0.5, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    return;
  }
  
  let col, ph;
  if (p.type === 'building') {
    col = {
      top: shadeHex(p.color, 12),
      sideL: p.color,
      sideR: shadeHex(p.color, -15),
      glow: KZ.signal
    };
    ph = p.height || 24;
  } else {
    col = PROP_COLORS[p.type] || PROP_COLORS.altar;
    ph = col.h;
  }
  
  const pulse=0.4+Math.sin(frameCount*0.06+p.c+p.r)*0.4;

  // Enhance Prop Shadow
  ctx.save();
  ctx.globalAlpha = 0.25;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(x, y + hh * 0.5, hw * 0.9, hh * 0.6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Draw 3D isometric box
  ctx.beginPath();
  ctx.moveTo(x,y-hh-ph);ctx.lineTo(x+hw,y-ph);ctx.lineTo(x,y+hh-ph);ctx.lineTo(x-hw,y-ph);
  ctx.closePath();ctx.fillStyle=col.top;ctx.fill();

  // Glow line under top edge
  if (p.type !== 'building') {
    ctx.strokeStyle=col.glow+(Math.floor(pulse*60+20).toString(16).padStart(2,'0'));ctx.lineWidth=0.8;
    ctx.beginPath();ctx.moveTo(x-hw,y-ph);ctx.lineTo(x+hw,y-ph);ctx.stroke();
  } else {
    ctx.strokeStyle=KZ.signal + '33'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x-hw, y-ph); ctx.lineTo(x, y+hh-ph); ctx.lineTo(x+hw, y-ph); ctx.stroke();
    ctx.strokeStyle=p.c % 2 === 0 ? KZ.signal + '55' : KZ.crimson + '55';
    ctx.beginPath(); ctx.moveTo(x, y+hh-ph); ctx.lineTo(x, y+hh); ctx.stroke();
  }

  ctx.beginPath();
  ctx.moveTo(x-hw,y-ph);ctx.lineTo(x,y+hh-ph);ctx.lineTo(x,y+hh);ctx.lineTo(x-hw,y);
  ctx.closePath();ctx.fillStyle=col.sideL;ctx.fill();

  ctx.beginPath();
  ctx.moveTo(x+hw,y-ph);ctx.lineTo(x,y+hh-ph);ctx.lineTo(x,y+hh);ctx.lineTo(x+hw,y);
  ctx.closePath();ctx.fillStyle=col.sideR;ctx.fill();

  if (p.type !== 'building') {
    ctx.globalAlpha=0.2+pulse*0.3;
    ctx.strokeStyle=col.glow;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x+hw,y-ph);ctx.lineTo(x+hw,y);ctx.stroke();
    ctx.globalAlpha=1;
  }
}

// ═══ ISOBOX HELPER ══════════════════════════════════════════════════════════
function isoBox(cx,cy,w,h,d,topC,leftC,rightC){
  const hw=w/2;
  ctx.fillStyle=leftC;ctx.fillRect(cx-hw,cy-h,w,h);
  ctx.fillStyle='rgba(232,220,200,0.03)';ctx.fillRect(cx-hw,cy-h,1.5,h);
  ctx.fillStyle='rgba(0,0,0,0.15)';ctx.fillRect(cx+hw-1.5,cy-h,1.5,h);
  ctx.fillStyle=topC;
  ctx.beginPath();
  ctx.moveTo(cx-hw,cy-h);ctx.lineTo(cx+hw,cy-h);
  ctx.lineTo(cx+hw+d*0.5,cy-h-d*0.5);ctx.lineTo(cx-hw+d*0.5,cy-h-d*0.5);
  ctx.closePath();ctx.fill();
  ctx.fillStyle=rightC;
  ctx.beginPath();
  ctx.moveTo(cx+hw,cy);ctx.lineTo(cx+hw+d*0.5,cy-d*0.5);
  ctx.lineTo(cx+hw+d*0.5,cy-h-d*0.5);ctx.lineTo(cx+hw,cy-h);
  ctx.closePath();ctx.fill();
}

wrapper.addEventListener('mousemove',e=>{
  const rect=canvas.getBoundingClientRect();
  const rawSx = e.clientX-rect.left;
  const rawSy = e.clientY-rect.top;
  cursorEl.style.left=rawSx+'px';cursorEl.style.top=rawSy+'px';
  
  mouse.sx=rawSx * (W / rect.width);
  mouse.sy=rawSy * (H / rect.height);

  const rx=mouse.sx-W/2+ci.sx-cam.shakeX,ry=mouse.sy-H/2+ci.sy-cam.shakeY;
  mouse.wx=(rx/(TILE_W/2)+ry/(TILE_H/2))/2;mouse.wy=(ry/(TILE_H/2)-rx/(TILE_W/2))/2;
});

// ═══ BULLETS UPDATE ═════════════════════════════════════════════════════════
function updateBullets(){
  const slow=BCAST.active?BCAST.slowFactor:1;
  
  // 弾と壊せるオベリスクの当たり判定
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    if (b.type === 'memory' || b.type === 'saint' || b.type === 'hymn') {
      for (const pr of props) {
        if (pr.type === 'obelisk' && !pr.dead) {
          const d = Math.hypot(b.x - pr.c, b.y - pr.r);
          if (d < 0.6) {
            pr.hp = (pr.hp || 100) - (b.dmg || 10);
            b.life = 0; // 弾消滅
            spawnKzParticles(pr.c, pr.r, '#FFE066', 8);
            if (pr.hp <= 0) {
              pr.dead = true;
              // XPジェムとハートジェムを生成
              for (let j = 0; j < 6; j++) {
                gems.push({
                  x: pr.c + (Math.random() - 0.5) * 0.8,
                  y: pr.r + (Math.random() - 0.5) * 0.8,
                  z: 0,
                  val: 20,
                  size: 0.25,
                  life: 600,
                  color: '#C5A03F'
                });
              }
              gems.push({
                x: pr.c, y: pr.r, z: 0, val: 0, size: 0.35, life: 600, color: '#ff5b5b', isHeart: true
              });
              playSound('kill');
            }
          }
        }
      }
    }
  }

  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];b.life--;
    if(b.type==='memory'){
      if(b.target&&!b.target.dead){
        const ang=Math.atan2(b.target.y-b.y,b.target.x-b.x);
        b.vx+=(Math.cos(ang)*8-b.vx)*0.15;b.vy+=(Math.sin(ang)*8-b.vy)*0.15;
      }
      b.x+=b.vx/TILE_W*2*slow;b.y+=b.vy/TILE_W*2*slow;
      if(b.life<=0){bullets.splice(i,1);continue;}
      for(const e of enemies){
        if(e.dead||b.hit.has(e))continue;
        if(Math.hypot(e.x-b.x,e.y-b.y)<e.size+0.15){
          hitEnemy(e,b.dmg);b.hit.add(e);spawnKzParticles(e.x,e.y,KZ.bone,8);
          if(!b.pierce)b.life=0;
        }
      }
    }else if(b.type==='prayer'){
      b.r+=(b.maxR/TILE_W*2)/b.life*3.5;
      if(b.life<=0){bullets.splice(i,1);continue;}
      for(const e of enemies){
        if(e.dead||b.hit.has(e))continue;
        const d=Math.hypot(e.x-b.x,e.y-b.y);
        if(d<b.r+e.size&&d>b.r-0.5){
          hitEnemy(e,b.dmg);b.hit.add(e);e.stunned=90;
          spawnKzParticles(e.x,e.y,KZ.gold,8);
        }
      }
    }else if(b.type==='saint'){
      if(b.target&&!b.target.dead){
        const ang=Math.atan2(b.target.y-b.y,b.target.x-b.x);
        b.vx=Math.cos(ang)*b.spd;b.vy=Math.sin(ang)*b.spd;
      }
      b.x+=(b.vx||0)/TILE_W*2*slow;b.y+=(b.vy||0)/TILE_W*2*slow;
      if(b.life<=0){bullets.splice(i,1);continue;}
      for(const e of enemies){
        if(e.dead)continue;
        if(Math.hypot(e.x-b.x,e.y-b.y)<e.size+0.18){
          hitEnemy(e,b.dmg);b.life=0;spawnKzParticles(e.x,e.y,KZ.crimson,12);break;
        }
      }
    }else if(b.type==='signal'){
      if(b.life<=0){bullets.splice(i,1);continue;}
      for(const e of enemies){
        if(e.dead||b.hit.has(e))continue;
        const dx=e.x-b.x,dy=e.y-b.y,dist=Math.hypot(dx,dy);
        if(dist<(b.r/TILE_W*2)+e.size){
          const ae=Math.atan2(dy,dx);
          const diff=Math.abs(((ae-b.angle)+Math.PI*3)%(Math.PI*2)-Math.PI);
          if(diff<Math.PI*0.7){hitEnemy(e,b.dmg);b.hit.add(e);spawnKzParticles(e.x,e.y,KZ.signal,6);}
        }
      }
    }else if(b.type==='parasite'){
      b.x=player.x;b.y=player.y;
      if(b.life<=0){bullets.splice(i,1);continue;}
      if(b.life%5===0){
        for(const e of enemies){
          if(e.dead||b.hit.has(e))continue;
          if(Math.hypot(e.x-b.x,e.y-b.y)<b.r/TILE_W*2+e.size){
            hitEnemy(e,b.dmg);b.hit.add(e);
            player.hp=Math.min(player.maxHp,player.hp+1);
            spawnKzParticles(e.x,e.y,KZ.rot,4);
          }
        }
      }
    }else if(b.type==='hymn'){
      if(!b.returning){
        b.x+=b.vx/TILE_W*2*slow;b.y+=b.vy/TILE_W*2*slow;
        if(Math.hypot(b.x-b.ox,b.y-b.oy)>9)b.returning=true;
      }else{
        const ang=Math.atan2(player.y-b.y,player.x-b.x);
        b.vx=Math.cos(ang)*b.spd;b.vy=Math.sin(ang)*b.spd;
        b.x+=b.vx/TILE_W*2*slow;b.y+=b.vy/TILE_W*2*slow;
        if(Math.hypot(b.x-player.x,b.y-player.y)<0.4)b.life=0;
      }
      b.spin=(b.spin||0)+0.22;
      if(b.life<=0){bullets.splice(i,1);continue;}
      for(const e of enemies){
        if(e.dead||b.hit.has(e))continue;
        if(Math.hypot(e.x-b.x,e.y-b.y)<e.size+0.25){
          hitEnemy(e,b.dmg);b.hit.add(e);spawnKzParticles(e.x,e.y,KZ.gold,6);
        }
      }
    }
  }
}

// ═══ HIT / KILL ═════════════════════════════════════════════════════════════
function hitEnemy(e,rawDmg){
  if(e.dead||e.invuln>0)return;
  const dmg=Math.round(rawDmg*player.might*(1+comboCount*0.04));
  e.hp-=dmg;e.invuln=12;e.flash=8;
  e.squash=1.4;e.stretch=0.7;
  const sc=toScreen(e.x,e.y,e.z+e.size*0.5);
  spawnFloatText(sc.sx,sc.sy-14,'-'+dmg,KZ.bone,false);
  cam.shakeMag=Math.min(cam.shakeMag+2.5,12);
  flashScreen('#8B000015',40);
  if(e.hp<=0)killEnemy(e);
}

function killEnemy(e){
  e.dead=true;e.deathTimer=35;
  kills++;
  document.getElementById('kill-label').textContent=kills;
  playSound('kill');

  // ORDER increases on kill
  orderValue=Math.min(100,orderValue+1.5);
  updateOrderHUD();

  // XP gem — double if low order
  const xpMult=orderValue<30?2:1;
  gems.push({x:e.x,y:e.y,z:0,val:e.xp*xpMult,size:e.isBoss?0.35:0.22,life:600,color:e.isBoss?KZ.gold:KZ.bone});

  // Optimized particle explosion (20-30 particles total)
  spawnKzParticles(e.x,e.y,e.color,12);
  spawnKzParticles(e.x,e.y,KZ.bone,6);
  // Text fragment particles
  for(let j=0;j<3;j++){
    const a=Math.random()*Math.PI*2,s=0.05+Math.random()*0.15;
    particles.push({
      x:e.x,y:e.y,z:Math.random()*0.4,
      vx:Math.cos(a)*s,vy:Math.sin(a)*s,vz:0.06+Math.random()*0.08,
      life:1,decay:0.03+Math.random()*0.03,size:0.15,color:KZ.bone,
      text:['?','!','0','1','X','O','.'][Math.floor(Math.random()*7)],isText:true,
    });
  }

  if(Math.random()<0.3)triggerGlitch(3);
  streakCount++;streakTimer=160;
  comboCount++;comboTimer=COMBO_EXPIRE;
  document.getElementById('streak-val').textContent=streakCount;
  flashScreen('#C5A03F15',80);
  cam.shakeMag=Math.min(cam.shakeMag+4,e.isBoss?25:14);
  if(e.isBoss)cam.shakeRot=(Math.random()-0.5)*0.04;

  if(streakCount>=3){
    const sb=document.getElementById('streak-banner');
    document.getElementById('streak-num').textContent=streakCount;
    sb.classList.add('show');
    setTimeout(()=>sb.classList.remove('show'),1400);
  }
  updateComboDisplay();
}

function updateComboDisplay(){
  const cd=document.getElementById('combo-display');
  const cn=document.getElementById('combo-num');
  if(comboCount>=2){
    cn.textContent='x'+comboCount;
    cn.style.color=comboCount>=10?KZ.crimson:comboCount>=5?KZ.gold:KZ.bone;
    cn.style.fontSize=Math.min(22+comboCount*1.5,46)+'px';
    cd.classList.add('show');
  }else cd.classList.remove('show');
}

function flashScreen(color,dur){
  const el=document.getElementById('screen-flash');
  el.style.background=color;el.style.opacity='1';
  setTimeout(()=>el.style.opacity='0',dur);
}

// ═══ XP / REVELATION ════════════════════════════════════════════════════════
function updateGems(){
  for(let i=gems.length-1;i>=0;i--){
    const g=gems[i];
    const d=Math.hypot(g.x-player.x,g.y-player.y);
    const attr=2.0+player.level*0.12;
    if(d<attr){
      const ang=Math.atan2(player.y-g.y,player.x-g.x);
      const spd=d<0.5?0.4:0.2;
      g.x+=Math.cos(ang)*spd;g.y+=Math.sin(ang)*spd;
    }
    if(d<0.3){
      if(g.isHeart){
        player.hp=Math.min(player.maxHp,player.hp+25);
        showSysNotif("+25 REALITY");
      }else{
        player.xp+=g.val;
      }
      gems.splice(i,1);
      checkLevelUp();
      continue;
    }
    g.life--;if(g.life<=0)gems.splice(i,1);
  }
}

function checkLevelUp(){
  while(player.xp>=player.xpToNext){
    player.xp-=player.xpToNext;
    player.level++;
    player.xpToNext=Math.round(player.xpToNext*1.22);
    document.getElementById('rev-val').textContent=['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV'][Math.min(player.level-1,14)];
    flashScreen('#C5A03F33',200);
    cam.shakeMag=15;cam.shakeRot=(Math.random()-0.5)*0.02;
    triggerGlitch(8);
    showSysNotif('REVELATION APPROACHING');
    playSound('levelup');
    triggerRevelation();return;
  }
  updateXPBar();
}
function updateXPBar(){
  const p=Math.min(100,(player.xp/player.xpToNext)*100);
  document.getElementById('xp-bar').style.width=p+'%';
}

function showSysNotif(msg){
  const el=document.getElementById('sys-notif');
  el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),1800);
}

function updateOrderHUD(){
  document.getElementById('order-bar').style.width=orderValue+'%';
  document.getElementById('order-val').textContent=Math.round(orderValue);
  document.getElementById('meme-bar').style.width=memeticExposure+'%';
  document.getElementById('meme-val').textContent=Math.round(memeticExposure)+'%';
}

// ═══ REVELATION (Upgrade) SCREEN ════════════════════════════════════════════
let pausedForUpgrade=false;
function triggerRevelation(){
  gameState='levelup';pausedForUpgrade=true;
  const screen=document.getElementById('revelation-screen');
  screen.classList.add('show');
  document.getElementById('revelation-msg').textContent=REVELATION_MSGS[Math.floor(Math.random()*REVELATION_MSGS.length)];
  const container=document.getElementById('upgrade-cards');
  container.innerHTML='';
  const choices=pickUpgrades();
  const labels=['ACCEPT','DENY','OBSERVE'];
  for(let idx=0;idx<choices.length;idx++){
    const upg=choices[idx];
    const card=document.createElement('div');
    card.className='upgrade-card';
    card.innerHTML=`
      <canvas class="ucard-icon" width="36" height="36"></canvas>
      <div class="ucard-text">
        <div class="ucard-choice">${labels[idx]}</div>
        <div class="ucard-name">${upg.name}</div>
        <div class="ucard-desc">${upg.desc}</div>
        <div class="ucard-rarity r-${upg.rarity}">${upg.rarity.toUpperCase()}</div>
      </div>
    `;
    card.addEventListener('click',()=>applyUpgrade(upg));
    container.appendChild(card);
    drawCardIcon(card.querySelector('canvas'),upg);
  }
}

function drawCardIcon(cv,upg){
  const ic=cv.getContext('2d');
  ic.fillStyle='#0A0608';ic.fillRect(0,0,36,36);
  ic.strokeStyle=upg.color+'33';ic.lineWidth=1;ic.strokeRect(2,2,32,32);
  ic.fillStyle=upg.color;
  if(upg.type==='drip'){
    ic.strokeStyle=upg.color;ic.lineWidth=1.5;
    ic.beginPath();ic.ellipse(18,18,9,5,0,0,Math.PI*2);ic.stroke();
    ic.beginPath();ic.arc(18,18,3,0,Math.PI*2);ic.fill();
    ic.fillStyle=upg.color+'44';
    ic.beginPath();ic.arc(18,18,1.5,0,Math.PI*2);ic.fill();
    ic.globalAlpha=0.3;ic.strokeStyle=upg.color;ic.lineWidth=0.5;
    for(let a=0;a<Math.PI*2;a+=Math.PI/4){
      ic.beginPath();ic.moveTo(18+Math.cos(a)*10,18+Math.sin(a)*6);
      ic.lineTo(18+Math.cos(a)*14,18+Math.sin(a)*8);ic.stroke();
    }
    ic.globalAlpha=1;
  }else{
    ic.fillStyle=upg.color+'18';ic.fillRect(4,4,28,28);
    ic.fillStyle=upg.color;
    ic.fillRect(7,20,22,4);ic.fillRect(7,15,16,4);ic.fillRect(7,10,10,4);
    ic.strokeStyle=upg.color;ic.lineWidth=0.8;ic.strokeRect(4,4,28,28);
  }
}

function pickUpgrades(){
  const dripPool=UPGRADES.filter(u=>u.type==='drip').sort(()=>Math.random()-0.5);
  const statPool=UPGRADES.filter(u=>u.type==='stat').sort(()=>Math.random()-0.5);
  const picks=[];
  for(const w of dripPool){
    if(picks.length>=2)break;
    const ex=player.activeWeapons.find(pw=>pw.id===w.id);
    if(!ex&&player.activeWeapons.length<6)picks.push({...w,isNew:true,levelUp:false});
    else if(ex&&ex.level<8)picks.push({...w,isNew:false,levelUp:true,weaponRef:ex,desc:`Tier ${ex.level} to ${ex.level+1}. ${w.desc}`});
  }
  for(const p of statPool){
    if(picks.length>=3)break;
    // Rename BECOME DOG based on level
    if(p.id==='spd'){
      const copy={...p};
      if(dogLevel===1){copy.name='BECOME MORE DOG';copy.desc='+0.35 speed. Even more canine.';}
      else if(dogLevel===2){copy.name='BECOME EXTREMELY DOG';copy.desc='+0.35 speed. Enemies also accelerate.';}
      else if(dogLevel>=3){copy.name='MAXIMUM DOG';copy.desc='+0.35 speed. There are too many dogs.';}
      picks.push(copy);
    }else picks.push({...p});
  }
  while(picks.length<3)picks.push({...statPool[picks.length%statPool.length]});
  return picks.slice(0,3);
}

function applyUpgrade(upg){
  if(upg.type==='drip'){
    if(upg.isNew)player.activeWeapons.push(initDrip(upg.id));
    else if(upg.levelUp&&upg.weaponRef){
      const w=upg.weaponRef;w.level++;
      w.dmg=Math.round(w.def.baseDmg*(1+(w.level-1)*0.2)*player.might);
      w.range=Math.round(w.def.baseRange*(1+player.areaBonus));
    }
  }else{
    if(upg.id==='dmg'){player.might+=0.10;recalcDmg();}
    if(upg.id==='spd'){
      player.speed+=0.35;dogLevel++;
      if(dogLevel>=3){
        // Enemies also get faster at extreme dog
        for(const e of enemies)e.spd*=1.1;
      }
    }
    if(upg.id==='hp'){player.maxHp+=25;player.hp=Math.min(player.hp+25,player.maxHp);}
    if(upg.id==='cdr'){player.hasteBonus+=0.08;recalcCDR();}
    if(upg.id==='area'){player.areaBonus+=0.12;recalcArea();}
    if(upg.id==='regen'){player.regen+=0.6;}
    // Brain rot upgrades reduce ORDER
    orderValue=Math.max(0,orderValue-8);
    updateOrderHUD();
  }
  document.getElementById('revelation-screen').classList.remove('show');
  gameState='playing';pausedForUpgrade=false;
  updateXPBar();buildDripHUD();
  checkFusions();
  playSound('select');
}

function recalcDmg(){for(const w of player.activeWeapons)w.dmg=Math.round(w.def.baseDmg*(1+(w.level-1)*0.2)*player.might);}
function recalcCDR(){for(const w of player.activeWeapons)w.baseCooldown=Math.round(w.def.baseCooldown*(1-player.hasteBonus));}
function recalcArea(){for(const w of player.activeWeapons)w.range=Math.round(w.def.baseRange*(1+player.areaBonus));}

function buildDripHUD(){
  const c=document.getElementById('weapon-slots');c.innerHTML='';
  for(const w of player.activeWeapons){
    const d=document.createElement('div');d.className='weapon-slot';
    d.innerHTML=`<span class="wname" style="color:${w.def.color}">${w.def.name}</span>
      <div class="wcd-track"><div class="wcd-fill" id="wcd-${w.id}" style="width:0%;background:${w.def.color}88"></div></div>
      <span class="wlvl">T${w.level}</span>`;
    c.appendChild(d);
  }
}
buildDripHUD();

const keys={};
document.addEventListener('keydown',e=>{
  if(['KeyW','KeyA','KeyS','KeyD','Space'].includes(e.code)){keys[e.code]=true;e.preventDefault();}
});
document.addEventListener('keyup',e=>{keys[e.code]=false;});

// Touch controls for mobile
let touchActive = false;
let touchX = 0;
let touchY = 0;

function handleTouch(e) {
  if (e.touches.length > 0) {
    const rect = canvas.getBoundingClientRect();
    const t = e.touches[0];
    // Scale touch positions to match canvas logical resolution
    touchX = (t.clientX - rect.left) * (W / rect.width);
    touchY = (t.clientY - rect.top) * (H / rect.height);
    touchActive = true;
  }
}

canvas.addEventListener('touchstart', e => {
  handleTouch(e);
}, { passive: true });

canvas.addEventListener('touchmove', e => {
  handleTouch(e);
}, { passive: true });

canvas.addEventListener('touchend', e => {
  touchActive = false;
}, { passive: true });

// Mobile Broadcast Button
const mobileBcastBtn = document.getElementById('mobile-broadcast-btn');
if (mobileBcastBtn) {
  mobileBcastBtn.addEventListener('touchstart', e => {
    keys['Space'] = true;
    e.preventDefault();
  }, { passive: false });
  mobileBcastBtn.addEventListener('touchend', e => {
    keys['Space'] = false;
    e.preventDefault();
  }, { passive: false });
}
